<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>古尘录 · 像素人生模拟器</title>
<style>
  :root{
    --bg:#171422; --panel:#241d33; --panel2:#2c2440; --line:#0d0a14;
    --ink:#efe3cd; --dim:#a99d8a; --gold:#f2c14e; --red:#e05252; --green:#7fd47a;
    --blue:#7ab8ff; --purple:#c99bff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    font-size:14px; overflow:hidden;
  }
  #app{max-width:1280px; height:100%; margin:0 auto; display:flex; flex-direction:column; padding:8px;}
  /* ===== 顶栏 ===== */
  #topbar{
    display:flex; align-items:center; gap:14px; padding:8px 12px;
    background:linear-gradient(#2e2546,#251d38); border:3px solid #0d0a14;
    box-shadow:inset 0 0 0 1px #4a3b63; margin-bottom:8px;
  }
  #topbar .logo{font-size:20px; font-weight:900; color:var(--gold); letter-spacing:4px; text-shadow:2px 2px 0 #000;}
  #topbar .sub{font-size:10px; color:var(--dim); letter-spacing:2px;}
  #clock{font-size:15px; font-weight:700; color:var(--blue);}
  #clock .season{color:var(--green);}
  #moneybox{font-size:15px; font-weight:700; color:var(--gold);}
  .spacer{flex:1;}
  .btn{
    background:linear-gradient(#4a3b63,#3a2d50); color:var(--ink);
    border:2px solid #0d0a14; box-shadow:0 3px 0 #0d0a14, inset 0 0 0 1px #6a5588;
    padding:5px 12px; font-size:13px; cursor:pointer; letter-spacing:1px;
  }
  .btn:hover{filter:brightness(1.15);}
  .btn:active{transform:translateY(2px); box-shadow:0 1px 0 #0d0a14;}
  .btn.gold{background:linear-gradient(#8a6d2a,#6b5420); color:#ffe9a8;}
  .btn:disabled{opacity:.4; cursor:not-allowed; filter:grayscale(.6);}
  /* ===== 主区 ===== */
  #main{flex:1; display:flex; gap:10px; min-height:0;}
  #mapWrap{
    position:relative; flex:0 0 auto; border:3px solid #0d0a14;
    box-shadow:inset 0 0 0 1px #4a3b63, 0 0 30px rgba(0,0,0,.6); background:#000;
  }
  canvas{display:block; image-rendering:pixelated; image-rendering:crisp-edges; cursor:pointer;}
  #labels{position:absolute; inset:0; pointer-events:none;}
  .loclabel{
    position:absolute; transform:translateX(-50%);
    font-size:11px; color:#ffe9c0; letter-spacing:1px; white-space:nowrap;
    background:rgba(10,8,16,.72); padding:1px 6px; border:1px solid #4a3b63;
    text-shadow:1px 1px 0 #000;
  }
  #mapHint{
    position:absolute; left:8px; bottom:8px; font-size:11px; color:#cfc3ae;
    background:rgba(10,8,16,.7); padding:2px 8px; border:1px solid #4a3b63;
  }
  #interactList{display:flex; flex-direction:column; gap:4px; max-height:52vh; overflow-y:auto; padding-right:2px;}
  /* ===== 侧栏 ===== */
  #side{flex:1; display:flex; flex-direction:column; gap:8px; min-width:380px; min-height:0;}
  .panel{
    background:var(--panel); border:3px solid #0d0a14;
    box-shadow:inset 0 0 0 1px #4a3b63; padding:8px 10px; overflow:hidden;
  }
  .panel h3{
    font-size:12px; color:var(--gold); letter-spacing:3px; margin-bottom:6px;
    border-bottom:1px dashed #4a3b63; padding-bottom:4px;
  }
  #statsPanel{flex:0 0 auto;}
  #statGrid{display:grid; grid-template-columns:1fr 1fr; gap:3px 14px;}
  .stat{display:flex; align-items:center; gap:6px; font-size:12px; white-space:nowrap;}
  .stat .name{width:52px; color:var(--dim); flex:0 0 auto;}
  .bar{flex:1; height:10px; background:#14101f; border:1px solid #0d0a14; position:relative; min-width:30px;}
  .bar .fill{height:100%; background:linear-gradient(#8fd97f,#4c9a4f);}
  .bar .fill.hp{background:linear-gradient(#ff9d8a,#c0392b);}
  .bar .fill.md{background:linear-gradient(#ffd97a,#d4a017);}
  .bar .fill.sk{background:linear-gradient(#9fc0ff,#5b7bd5);}
  .stat .num{width:38px; text-align:right; color:var(--ink); font-variant-numeric:tabular-nums;}
  #roleLine{font-size:12px; color:var(--dim); margin-bottom:5px;}
  #roleLine b{color:var(--ink);}
  #statGrid2{display:grid; grid-template-columns:1fr 1fr; gap:2px 14px; font-size:12px;}
  #statGrid2 .k{color:var(--dim);} #statGrid2 .v{color:var(--ink); text-align:right;}
  #actionPanel{flex:0 1 auto; max-height:30%; display:flex; flex-direction:column;}
  #actionList{overflow-y:auto; display:flex; flex-direction:column; gap:4px; padding-right:2px;}
  .lochead{font-size:11px; color:var(--purple); letter-spacing:2px; margin:2px 0 1px;}
  .actbtn{
    text-align:left; background:#332a4c; color:var(--ink); border:2px solid #0d0a14;
    box-shadow:inset 0 0 0 1px #5b4a7e; padding:5px 9px; cursor:pointer; font-size:13px;
  }
  .actbtn:hover:not(:disabled){filter:brightness(1.18);}
  .actbtn:disabled{opacity:.45; cursor:not-allowed;}
  .actbtn .meta{color:var(--dim); font-size:11px; float:right; margin-left:8px;}
  #logPanel{flex:1; min-height:0; display:flex; flex-direction:column;}
  #log{overflow-y:auto; font-size:12.5px; line-height:1.65; flex:1; min-height:0; padding-right:4px;}
  #log .t{color:var(--dim);}
  #log .good{color:var(--green);}
  #log .bad{color:var(--red);}
  #log .ev{color:var(--purple);}
  #log .n{color:var(--ink);}
  /* ===== 滚动条 ===== */
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-track{background:#14101f;}
  ::-webkit-scrollbar-thumb{background:#4a3b63; border:2px solid #14101f;}
  /* ===== 弹窗 ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(8,6,14,.78); z-index:50;
    display:flex; align-items:center; justify-content:center; overflow:auto; padding:20px;
  }
  .modal{
    background:var(--panel); border:4px solid #0d0a14; max-width:560px; width:100%;
    box-shadow:inset 0 0 0 1px #6a5588, 0 10px 40px rgba(0,0,0,.8); padding:16px 20px;
  }
  .modal h2{color:var(--gold); font-size:18px; letter-spacing:2px; margin-bottom:10px; text-align:center;}
  .modal .body{font-size:13.5px; line-height:1.9; color:var(--ink); margin-bottom:12px; white-space:pre-wrap;}
  .modal .opts{display:flex; flex-direction:column; gap:7px;}
  .modal .optbtn{
    text-align:left; background:#332a4c; color:var(--ink); border:2px solid #0d0a14;
    box-shadow:inset 0 0 0 1px #5b4a7e; padding:8px 12px; cursor:pointer; font-size:13.5px; line-height:1.5;
  }
  .modal .optbtn:hover:not(:disabled){filter:brightness(1.18);}
  .modal .optbtn:disabled{opacity:.45;}
  .modal .optbtn .fx{color:var(--dim); font-size:11px;}
  /* ===== 开局页 ===== */
  #startOverlay{z-index:60;}
  #startPanel{max-width:660px; max-height:90vh; overflow-y:auto;}
  .pickrow{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;}
  .pick{
    background:#332a4c; border:2px solid #0d0a14; color:var(--ink); padding:6px 10px;
    cursor:pointer; font-size:12.5px; text-align:left; box-shadow:inset 0 0 0 1px #5b4a7e; flex:1; min-width:150px;
  }
  .pick.sel{border-color:var(--gold); box-shadow:inset 0 0 0 2px var(--gold); background:#453760;}
  .pick b{display:block; font-size:13px; color:var(--gold);}
  .pick small{color:var(--dim);}
  .inputrow{display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap;}
  .inputrow input, .inputrow select{
    background:#14101f; color:var(--ink); border:2px solid #0d0a14; padding:6px 10px; font-size:13px;
    box-shadow:inset 0 0 0 1px #4a3b63;
  }
  .swatch{width:26px; height:26px; border:3px solid #0d0a14; cursor:pointer; display:inline-block;}
  .swatch.sel{outline:3px solid var(--gold);}
  /* ===== 结局页 ===== */
  #endPanel{max-width:640px; max-height:90vh; overflow-y:auto;}
  #endTitle{font-size:26px; text-align:center; letter-spacing:6px; margin:6px 0 4px; color:var(--gold); text-shadow:2px 2px 0 #000;}
  #endSub{text-align:center; color:var(--dim); font-size:12px; margin-bottom:12px;}
  #endStats,#endData{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:12px;}
  #endStats .cell,#endData .cell{background:#14101f; border:1px solid #3a2d50; padding:6px 8px; text-align:center;}
  #endStats .cell b,#endData .cell b{display:block; font-size:15px; color:var(--gold);}
  #endStats .cell span,#endData .cell span{font-size:11px; color:var(--dim);}
  #catalogList{display:grid; grid-template-columns:1fr 1fr; gap:6px;}
  .cat{background:#14101f; border:1px solid #3a2d50; padding:6px 9px; font-size:12px; color:var(--dim);}
  .cat.got{color:var(--gold); border-color:var(--gold);}
  .cat b{display:block; font-size:13px;}
  .cat small{color:var(--dim); font-size:11px;}
  #endChronicle{max-height:170px; overflow-y:auto; background:#14101f; border:1px solid #3a2d50; padding:8px 10px; font-size:12px; line-height:1.7; margin-bottom:12px;}
  #endAchv{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:14px;}
  .achv{font-size:11px; border:1px solid #3a2d50; background:#14101f; padding:3px 7px; color:var(--dim);}
  .achv.got{color:var(--gold); border-color:var(--gold);}
  .achv.new{animation:blink 1s steps(2) infinite; color:#fff; background:#5a3d1a;}
  @keyframes blink{50%{opacity:.5;}}
  .hidden{display:none !important;}
  #helpPanel{max-width:560px;}
</style>
</head>
<body>
<div id="app">
  <!-- 顶栏 -->
  <div id="topbar">
    <div>
      <span class="logo">古尘录</span><br>
      <span class="sub">· 像素人生模拟器 ·</span>
    </div>
    <div id="clock">太初七年 · 春</div>
    <div id="moneybox">纹银 0 两</div>
    <div class="spacer"></div>
    <button class="btn" id="btnSave">存档</button>
    <button class="btn" id="btnLoad">读档</button>
    <button class="btn" id="btnHelp">帮助</button>
    <button class="btn gold" id="btnNew">新一世</button>
  </div>

  <div id="main">
    <!-- 地图 -->
    <div id="mapWrap">
      <canvas id="cv" width="768" height="480"></canvas>
      <div id="labels"></div>
      <div id="mapHint">点击地面或方向键行走 · 走到建筑旁按「空格」互动</div>
    </div>
    <!-- 侧栏 -->
    <div id="side">
      <div class="panel" id="statsPanel">
        <h3>人物</h3>
        <div id="roleLine"></div>
        <div id="estateLine"></div>
        <div id="statGrid"></div>
        <div id="statGrid2" style="margin-top:6px;"></div>
      </div>
      <div class="panel" id="actionPanel">
        <h3>可做之事 <button class="btn" id="btnRepeat" style="float:right;padding:2px 8px;font-size:11px;letter-spacing:0;">重复上次(R)</button></h3>
        <div id="actionList"></div>
      </div>
      <div class="panel" id="logPanel">
        <h3>生平纪事</h3>
        <div id="log"></div>
      </div>
    </div>
  </div>
</div>

<!-- 通用事件弹窗 -->
<div class="overlay hidden" id="modal">
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <div class="body" id="modalBody"></div>
    <div class="opts" id="modalOpts"></div>
  </div>
</div>

<!-- 互动菜单（走到建筑旁按空格） -->
<div class="overlay hidden" id="interactOverlay">
  <div class="modal">
    <h2 id="interactTitle"></h2>
    <div class="opts" id="interactList"></div>
    <div style="text-align:center; margin-top:12px;">
      <button class="btn" id="interactClose">离开（空格 / Esc）</button>
    </div>
  </div>
</div>

<!-- 开局 -->
<div class="overlay hidden" id="startOverlay">
  <div class="modal" id="startPanel">
    <h2>古 尘 录</h2>
    <div class="body" style="text-align:center; color:var(--dim);">架空朝代「大夏」· 一方水土，一世浮沉。<br>本朝文教昌明，男女皆可入学、应试、从仕、从商、从军。</div>
    <div class="inputrow">
      <label style="color:var(--dim);">姓名</label>
      <input id="inpName" maxlength="6" placeholder="留空则随机" style="width:140px;">
      <label style="color:var(--dim);">性别</label>
      <select id="selGender"><option value="m">男</option><option value="f">女</option></select>
      <label style="color:var(--dim);">衣色</label>
      <span id="robeRow"></span>
    </div>
    <div class="body" style="margin-bottom:6px; color:var(--gold);">一 · 出身</div>
    <div class="pickrow" id="pickIdentity"></div>
    <div class="body" style="margin-bottom:6px; color:var(--gold);">二 · 性情</div>
    <div class="pickrow" id="pickTrait"></div>
    <div style="text-align:center; margin-top:4px;">
      <button class="btn gold" id="btnStart" style="font-size:16px; padding:9px 34px;">开始这一世</button>
      <button class="btn" id="btnRandom" style="margin-left:10px;">天降随机</button>
    </div>
  </div>
</div>

<!-- 结局 -->
<div class="overlay hidden" id="endOverlay">
  <div class="modal" id="endPanel">
    <div id="endSub">—— 一世终了 · 盖棺定论 ——</div>
    <div id="endTitle"></div>
    <div id="endRank" style="text-align:center; color:var(--dim); font-size:12px; margin-bottom:12px;"></div>
    <div id="endStats"></div>
    <div class="body" style="margin:8px 0 6px; color:var(--gold);">一生行迹</div>
    <div id="endData"></div>
    <div class="body" style="margin-bottom:6px; color:var(--gold);">生平大事记</div>
    <div id="endChronicle"></div>
    <div class="body" style="margin-bottom:6px; color:var(--gold);">成就</div>
    <div id="endAchv"></div>
    <div style="text-align:center;">
      <button class="btn gold" id="btnAgain" style="font-size:15px; padding:8px 28px;">再世为人</button>
      <button class="btn" id="btnEpitaph" style="margin-left:10px;">墓志铭</button>
      <button class="btn" id="btnCatalog" style="margin-left:10px;">结局图鉴</button>
      <button class="btn" id="btnLook" style="margin-left:10px;">细看此生</button>
    </div>
  </div>
</div>

<!-- 墓志铭 -->
<div class="overlay hidden" id="epitaphOverlay">
  <div class="modal" id="epitaphPanel">
    <h2>墓 志 铭</h2>
    <textarea id="epitaphText" readonly spellcheck="false" style="width:100%;height:220px;background:#14101f;color:var(--ink);border:2px solid #0d0a14;box-shadow:inset 0 0 0 1px #4a3b63;padding:10px;font-family:'KaiTi','STKaiti','Kaiti SC',serif;font-size:14px;line-height:1.9;resize:none;"></textarea>
    <div style="text-align:center; margin-top:12px;">
      <button class="btn gold" id="btnEpitaphCopy">复制墓志铭</button>
      <button class="btn" id="btnEpitaphClose" style="margin-left:10px;">关闭</button>
    </div>
  </div>
</div>

<!-- 结局图鉴 -->
<div class="overlay hidden" id="catalogOverlay">
  <div class="modal" id="catalogPanel">
    <h2>结局图鉴</h2>
    <div class="body" style="color:var(--dim);">已达成的结局点亮金色；未达成的灰字附条件提示。</div>
    <div id="catalogList"></div>
    <div style="text-align:center; margin-top:12px;"><button class="btn" id="btnCatalogClose">关闭</button></div>
  </div>
</div>

<!-- 帮助 -->
<div class="overlay hidden" id="helpOverlay">
  <div class="modal" id="helpPanel">
    <h2>玩法说明</h2>
    <div class="body" id="helpBody"></div>
    <div style="text-align:center;"><button class="btn" id="btnHelpClose">知道了</button></div>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   古尘录 · 像素人生模拟器
   架空古代 大夏朝 · 地图直接操作 · 纯规则+随机 · 多结局 · 本地存档
   ===================================================================== */

/* ---------- 工具 ---------- */
const $ = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const rnd = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
function mulberry32(seed){return function(){seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296;};}
function chance(p){return Math.random()<p;}

/* 音效 */
let AC=null;
function beep(f,d=0.08,type='square',vol=0.06){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=f; g.gain.value=vol;
    o.connect(g); g.connect(AC.destination);
    const t=AC.currentTime;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.start(t); o.stop(t+d);
  }catch(e){}
}
const sfx={act:()=>beep(330,.05), good:()=>{beep(520,.07);setTimeout(()=>beep(660,.09),60);}, bad:()=>{beep(180,.15,'sawtooth');}, event:()=>{beep(440,.06);setTimeout(()=>beep(587,.07),70);}, death:()=>{beep(220,.3,'sawtooth',.08);setTimeout(()=>beep(140,.5,'sawtooth',.08),150);}};

/* ---------- 贴图（像素画，16x16） ---------- */

SPR.gov=[

"..sRRRRRRRRRRs..","..sRRkkkkkkRRs..","..sRRkkkkkkRRs..","..sRRkkkkkkRRs..",

"...ssssssssss...","....d....d......","....g....g......","................"];
SPR.martial=[

"..rbbbbbbbbbr...","..rbbkkbbkbr....","..rbbbbbbbbbr...","..rbbbbbbbbbr...",
"..rrrrrrrrrr....","..R.............","..R..kkkk.......","..R..RRRR.......",
"..R.............","..d.............","..g.............","................"];
SPR.med=[

"..rbkkbbbbkbr...","..rbkkbbbbkbr...","..rbybbbbbbbybr.","..rbbbbbbbbbr...",

"................","................","................","................"];
SPR.temple=[

"..RRRRRRRRRR....","..RRRRRRRRRR....","..s..RRRR..s....","..s..bbbb..s....",
"..s..bbbb..s....","..s..bkbb..s....","..s..bbbb..s....","..ssssssssss....",
"....dd..dd......","....gg..gg......","................","................"];

SPR.qinglou=[

"..RRRRRRRRRRRR..","..RbbbbbbbbbbR..","..RbkkbbbbkkbR..","..RbbddbbddbbR..",
"..RbbbbbbbbbbR..","..yRRRRRRRRRRy..","...d...d...d....","...g...g...g...."];

let mapTiles=[], decor=[]; // decor: {x,y,kind}
function inMap(x,y){return x>=0&&x<MW&&y>=0&&y<MH;}
function buildMap(){
  const locs=curLocs();
  const reg=G.region||'home';
  mapTiles=[];
  for(let y=0;y<MH;y++){
    mapTiles[y]=[];
    for(let x=0;x<MW;x++){
      mapTiles[y][x]='grass';
    }
  }
  if(reg==='home'){
    // 底部水面
    for(let y=WATER;y<MH;y++) for(let x=0;x<MW;x++) mapTiles[y][x]='water';
    // 左上山脉
    for(let y=0;y<3;y++) for(let x=0;x<4;x++){ if(y*4+x<=8 && !(x===0&&y===0)) mapTiles[y][x]='mountain'; }
    // 道路：横 y=7，竖 x=11
    for(let x=0;x<MW;x++) if(mapTiles[7][x]!=='water') mapTiles[7][x]='road';
    for(let y=0;y<MH;y++) if(mapTiles[y][11]!=='water') mapTiles[y][11]='road';
    // 农田周边
    [[7,9],[9,9],[7,10],[9,10],[8,10]].forEach(([x,y])=>{ if(inMap(x,y)) mapTiles[y][x]='field'; });
  }else if(reg==='jingcheng'){
    // 京城：环城路+井字街
    for(let y=2;y<12;y++) for(let x=2;x<22;x++){ if(x===2||x===21||y===2||y===11) mapTiles[y][x]='road'; }
    for(let x=2;x<22;x++){ mapTiles[7][x]='road'; }
    for(let y=2;y<12;y++){ mapTiles[11][y]='road'; }
  }else if(reg==='bianguan'){
    // 边关：北山荒原+两道官道
    for(let y=0;y<4;y++) for(let x=0;x<MW;x++) mapTiles[y][x]='mountain';
    for(let x=0;x<MW;x++){ mapTiles[4][x]='road'; mapTiles[8][x]='road'; }
    // 通往山上建筑（校场/城墙/烽火台）的坡道
    [[7,3],[12,3],[18,2]].forEach(([x,y])=>{ for(let yy=4;yy>=y;yy--) mapTiles[yy][x]='road'; });
  }else if(reg==='jiangnan'){
    // 江南：一条大江横贯 + 两座可通行的石桥，水塘点缀不挡路
    for(let x=0;x<MW;x++) mapTiles[7][x]='water';
    mapTiles[7][7]='road';    // 西桥（桥上下均为陆地，可通行）
    mapTiles[7][15]='road';   // 东桥
    [[2,3],[2,4],[3,4],[18,2],[19,2],[19,3],[16,12],[17,12],[17,13],[9,2],[10,2],[11,2]].forEach(([x,y])=>{
      if(inMap(x,y)) mapTiles[y][x]='water';
    });
  }
  // 建筑落位
  locs.forEach(l=>{ if(inMap(l.x,l.y)) mapTiles[l.y][l.x]='road'; });
  // 装饰：树/花/石（避开道路建筑水面山脉）
  const rng=G.rng;
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    if(mapTiles[y][x]!=='grass') continue;
    if(locs.some(l=>Math.abs(l.x-x)<=1&&Math.abs(l.y-y)<=1)) continue;
    const r=rng();
    if(r<0.05) decor.push({x,y,kind:'tree'});
    else if(r<0.08) decor.push({x,y,kind:'flower'});
    else if(r<0.09) decor.push({x,y,kind:'rock'});
  }
}
function walkable(x,y){
  if(!inMap(x,y)) return false;
  const t=mapTiles[y][x];
  return t!=='water' && t!=='mountain';
}
function tileName(x,y){
  if(!inMap(x,y)) return null;
  return mapTiles[y][x];
}

/* ---------- 画布绘制 ---------- */
const cv=$('cv'), ctx=cv.getContext('2d');
let animX=0,animY=0,frame=0,animTick=0,playerDir=1;

function drawSprite(spr, dx, dy, scale){
  for(let y=0;y<16;y++){
    const row=spr[y];
    for(let x=0;x<16;x++){
      const ch=row[x];
      if(ch==='.') continue;
      const col=SPAL[ch];
      if(!col) continue;
      ctx.fillStyle=col;
      ctx.fillRect(dx+x*scale, dy+y*scale, scale, scale);
    }
  }
}
function drawPlayer(dx,dy,scale){
  const pix=(frame%2===0)?PIX_F1:PIX_F2;
  for(let y=0;y<14;y++){
    const row=pix[y];
    for(let x=0;x<12;x++){
      const ch=row[x];
      if(ch==='.') continue;
      let col=SPAL[ch];
      if(ch==='P') col=G.robe;
      if(ch==='B') col='#5b3a1e';
      if(ch==='p') col='#f6cf9a';
      ctx.fillStyle=col;
      const sx = playerDir>=0 ? x : (11-x);
      ctx.fillRect(dx+sx*scale, dy+y*scale, scale, scale);
    }
  }
}
function drawMap(){
  ctx.fillStyle='#3e6b2c';
  ctx.fillRect(0,0,cv.width,cv.height);
  // 地形
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    const t=mapTiles[y][x], dx=x*TILE, dy=y*TILE;
    if(t==='grass'){
      const r=((x*7+y*13+G.mapSeed)%5);
      ctx.fillStyle=(r<2)?'#3e6b2c':'#44742f';
      ctx.fillRect(dx,dy,TILE,TILE);
      if((x*3+y*5)%9===0){ ctx.fillStyle='rgba(90,140,60,.35)'; ctx.fillRect(dx+8,dy+20,3,3); ctx.fillRect(dx+22,dy+8,3,3);}
    }else if(t==='road'){
      ctx.fillStyle='#c2a06a'; ctx.fillRect(dx,dy,TILE,TILE);
      ctx.fillStyle='rgba(0,0,0,.12)';
      for(let i=0;i<3;i++) ctx.fillRect(dx+((x*5+y*7+i*9)%26), dy+((y*3+i*13)%26), 4,3);
    }else if(t==='water'){
      ctx.fillStyle='#3f7fd4'; ctx.fillRect(dx,dy,TILE,TILE);
      if((x+y+Math.floor(animTick/400))%2===0){ ctx.fillStyle='rgba(255,255,255,.10)'; ctx.fillRect(dx+4,dy+6,14,4); ctx.fillRect(dx+18,dy+20,10,3);}
      else { ctx.fillStyle='rgba(255,255,255,.08)'; ctx.fillRect(dx+16,dy+8,10,3);}
    }else if(t==='field'){
      drawSprite(SPR.field,dx,dy,2);
    }else if(t==='mountain'){
      drawSprite(SPR.mountain,dx,dy,2);
    }
  }
  // 装饰
  decor.forEach(d=>{
    const dx=d.x*TILE, dy=d.y*TILE;
    if(d.kind==='tree') drawSprite(SPR.tree,dx,dy,2);
    else if(d.kind==='flower') drawSprite(SPR.flower,dx,dy,2);
    else if(d.kind==='rock') drawSprite(SPR.rock,dx,dy,2);
  });
  // 建筑
  curLocs().forEach(l=>{
    const dx=l.x*TILE, dy=l.y*TILE;
    ctx.fillStyle='rgba(0,0,0,.28)';
    ctx.fillRect(dx+2,dy+26,TILE-4,8);
    drawSprite(SPR[l.spr]||SPR.home,dx,dy,2);
  });
  // 玩家
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.fillRect(animX-10,animY+12,20,6);
  drawPlayer(animX-12,animY-16,2);
  // 若正在走，路径高亮
  if(path.length){
    ctx.strokeStyle='rgba(242,193,78,.6)';
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(G.x*TILE+16,G.y*TILE+16);
    path.forEach(p=>ctx.lineTo(p[0]*TILE+16,p[1]*TILE+16));
    ctx.stroke();
  }
}
function drawLoop(t){
  animTick=t;
  if(!G){ requestAnimationFrame(drawLoop); return; }
  // 行走动画
  if(path.length){
    walking=true; frame++;
    const target=[path[0][0]*TILE+16, path[0][1]*TILE+16];
    const dx=target[0]-animX, dy=target[1]-animY;
    const dist=Math.hypot(dx,dy);
    const step=Math.min(dist, 2.8);
    if(dx!==0) playerDir=dx>0?1:-1;
    animX+=dx/dist*step; animY+=dy/dist*step;
    if(dist<=step+0.1){
      G.x=path[0][0]; G.y=path[0][1];
      animX=G.x*TILE+16; animY=G.y*TILE+16;
      path.shift();
    }
    if(!path.length) walking=false;
  }
  drawMap();
  requestAnimationFrame(drawLoop);
}

/* ---------- 移动 ---------- */
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function moveTo(tx,ty){
  if(!G||DEAD) return;
  if(!walkable(tx,ty)){
    // 找最近的可行点
    for(let r=1;r<4;r++){
      for(let dx=-r;dx<=r;dx++) for(let dy=-r;dy<=r;dy++){
        if(Math.abs(dx)+Math.abs(dy)!==r) continue;
        if(walkable(tx+dx,ty+dy)){ tx+=dx; ty+=dy; r=99; break; }
      }
      if(r===99) break;
    }
    if(!walkable(tx,ty)) return;
  }
  const p=findPath(G.x,G.y,tx,ty);
  if(p&&p.length){ path=p; walking=true; }
}
function findPath(sx,sy,tx,ty){
  if(!walkable(tx,ty)) return null;
  const q=[[sx,sy]], prev={}, seen=new Set([sx+','+sy]);
  while(q.length){
    const [x,y]=q.shift();
    if(x===tx&&y===ty){
      const p=[]; let k=tx+','+ty;
      while(k){ p.push(k.split(',').map(Number)); k=prev[k]; }
      return p.reverse();
    }
    for(let i=0;i<4;i++){
      const nx=x+DIRS[i][0], ny=y+DIRS[i][1], nk=nx+','+ny;
      if(inMap(nx,ny)&&walkable(nx,ny)&&!seen.has(nk)){
        seen.add(nk); prev[nk]=x+','+y; q.push([nx,ny]);
      }
    }
  }
  return null;
}
cv.addEventListener('click',e=>{
  if(!G||DEAD) return;
  if($('interactOverlay').classList.contains('hidden')===false) $('interactOverlay').classList.add('hidden');
  const r=cv.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/TILE), y=Math.floor((e.clientY-r.top)/TILE);
  moveTo(x,y);
});
document.addEventListener('keydown',e=>{
  if(!G||DEAD||$('modal').classList.contains('hidden')===false) return;
  const k=e.key.toLowerCase();
  const interactOpen=$('interactOverlay').classList.contains('hidden')===false;
  // 空格 / 回车：打开或关闭互动菜单
  if(k===' '||k==='enter'){
    e.preventDefault();
    if(interactOpen){ $('interactOverlay').classList.add('hidden'); return; }
    openInteract();
    return;
  }
  if(k==='escape'&&interactOpen){ $('interactOverlay').classList.add('hidden'); return; }
  if(interactOpen) return;   // 菜单打开时方向键不再移动
  if(k==='r'){ e.preventDefault(); repeatLast(10); return; }   // R：重复上次行动
  let dx=0,dy=0;
  if(k==='arrowup'||k==='w') dy=-1;
  else if(k==='arrowdown'||k==='s') dy=1;
  else if(k==='arrowleft'||k==='a') dx=-1;
  else if(k==='arrowright'||k==='d') dx=1;
  else return;
  e.preventDefault();
  if(walking) return;
  moveTo(G.x+dx,G.y+dy);
});

  });

    else if(k.career==='farm'){ const m=rnd(3,8); G.money+=m; }

  });
  // 成年子女成家（自动，花三十两操办）
  G.kids.filter(k=>k.adult&&!k.dead&&!k.married&&k.ageMonths>=240).forEach(k=>{

      sfx.good();
    }
  });

function nearLocs(){
  return curLocs().filter(l=>Math.abs(l.x-G.x)<=1&&Math.abs(l.y-G.y)<=1);
}
function renderActions(){
  const el=$('actionList');
  if(DEAD){ el.innerHTML='<div style="color:var(--dim);font-size:12px;">此生已了，点击右上角「新一世」。</div>'; return; }
  const locs=nearLocs();
  let html='';
  locs.forEach(l=>{
    html+='<div class="lochead">▸ '+l.name+'</div>';
    ACTIONS[l.id].forEach(a=>{
      const need=a.need? a.need(G):null;   // null=可行
      const stOk=G.stamina>=a.stam;
      const reason = !stOk?'体力不足' : need;
      html+='<button class="actbtn" data-a="'+l.id+':'+a.id+'"'+(reason?' disabled title="'+reason+'"':'')+'>'+a.name+
        '<span class="meta">耗时'+a.t+'月 · 体力'+(a.stam<0?'+'+(-a.stam):a.stam)+(a.cost>0?' · 银'+a.cost+'两':'')+'</span></button>';
    });
  });
  el.innerHTML=html||'<div style="color:var(--dim);font-size:12px;">走到某个地方去，看看能做些什么。</div>';
  el.querySelectorAll('.actbtn').forEach(b=>{
    b.addEventListener('click',()=>{
      const [lid,aid]=b.dataset.a.split(':');
      const a=ACTIONS[lid].find(x=>x.id===aid);
      if(a) doAction(lid,a);
    });
  });
}
function repeatLast(n){
  if(!G||DEAD||!G.lastAction) return;
  const A=ACTIONS[G.lastAction.lid], a=A.find(x=>x.id===G.lastAction.aid);
  if(!a) return;
  for(let i=0;i<n;i++){
    if(DEAD||G.modalOpen) break;
    const need=a.need?a.need(G):null;
    if(need){ pushLog(a.name+'：'+need+'，重复停止','bad'); renderUI(); break; }
    if(G.stamina<a.stam){ pushLog('体力不支，重复停止','bad'); renderUI(); break; }
    doAction(G.lastAction.lid,a);
  }
}
function openInteract(){
  if(!G||DEAD||G.modalOpen) return;
  const locs=nearLocs();
  if(!locs.length){
    pushLog('此处四下无人，无可互动之处','n');
    sfx.bad();
    renderUI();
    return;
  }
  $('interactTitle').textContent = locs.length===1 ? locs[0].name : '附近的去处（按空格互动）';
  const list=$('interactList'); list.innerHTML='';
  locs.forEach(l=>{
    const h=document.createElement('div');
    h.className='lochead';
    h.textContent='▸ '+l.name;
    list.appendChild(h);
    ACTIONS[l.id].forEach(a=>{
      const need=a.need? a.need(G):null;
      const stOk=G.stamina>=a.stam;
      const reason=!stOk?'体力不足':need;
      const b=document.createElement('button');
      b.className='actbtn';
      b.innerHTML=a.name+'<span class="meta">耗时'+a.t+'月 · 体力'+(a.stam<0?'+'+(-a.stam):a.stam)+(a.cost>0?' · 银'+a.cost+'两':'')+'</span>';
      if(reason){ b.disabled=true; b.title=reason; }
      b.addEventListener('click',()=>{
        $('interactOverlay').classList.add('hidden');
        doAction(l.id,a);
      });
      list.appendChild(b);
    });
  });
  $('interactOverlay').classList.remove('hidden');
}
function xpGain(skill,base){
  let v=base;
  if(G.trait==='haoshuang'&&(skill==='wu'||skill==='str')) v=Math.round(v*1.15);
  if(G.trait==='jimmin'&&(skill==='shop'||skill==='int')) v=Math.round(v*1.15);
  if(G.trait==='houthou'&&(skill==='nong'||skill==='moral')) v=Math.round(v*1.15);
  if(G.trait==='conghui'&&skill==='wen') v=Math.round(v*1.15);
  if(G.trait==='danbo'&&(skill==='moral'||skill==='xiu')) v=Math.round(v*1.4);
  return v;
}
function doAction(lid,a){
  if(DEAD) return;
  const need=a.need?a.need(G):null;
  if(need){ pushLog(a.name+'：'+need,'bad'); return; }
  if(G.stamina<a.stam){ pushLog('体力不支，先歇歇吧。','bad'); return; }
  G.lastAction={lid:lid,aid:a.id};
  G.stat.acts++;
  if(lid==='school') G.stat.reads++;
  if(lid==='market'&&a.id==='trade') G.stat.trades++;
  if(lid==='martial') G.stat.battles++;
  if(lid==='dock'&&a.id==='caravan') G.stat.caravans++;
  G.stamina=clamp(G.stamina-a.stam,0,100);
  const r=a.run(G);
  if(DEAD){ renderUI(); return; }   // 行动中离世（战死/出家/归隐）
  advanceMonths(a.t);
  if(r&&r.log) pushLog(r.log, r.c||'n');
  sfx.act();
  afterAction();
}
function afterAction(){
  renderUI();
  // 死亡判定
  if(checkDeath()) return;
  // 随机事件
  if(DEAD) return;
  if(G.modalOpen){ autoSave(); return; }   // 已有弹窗展示中（如生育）
  const p=G.mood<25?0.34:0.24;
  if(chance(p)){
    const ev=pickEvent();
    if(ev){ showEvent(ev); return; }
  }
  flushEventQueue();
  autoSave();
}
function pickEvent(){
  const pool=EVENTS.filter(e=>!e.cond||e.cond(G));
  if(!pool.length) return null;
  const total=pool.reduce((s,e)=>s+(e.weight||1),0);
  let r=Math.random()*total;
  for(const e of pool){ r-=e.weight||1; if(r<=0) return e; }
  return pool[0];
}

/* ---------- 死亡与结局 ---------- */
function checkDeath(){
  if(DEAD) return true;
  if(G.health<=0){ die('病故'); return true; }
  if(Math.floor(G.ageMonths/12)>=G.lifespan){ die('寿终正寝'); return true; }
  return false;
}
function die(cause){
  if(DEAD) return;
  DEAD=true; G.died=true; G.deathCause=cause;
  sfx.death();
  pushLog(cause=== '寿终正寝'?'寿终正寝，享年'+Math.floor(G.ageMonths/12)+'岁。':'病逝于太初'+yearNow()+'年，享年'+Math.floor(G.ageMonths/12)+'岁。','bad');
  autoSave();
  const end=evaluateEnding();
  unlockedEndings[end.title]=1;
  try{ localStorage.setItem(STORE_END,JSON.stringify(unlockedEndings)); }catch(e){}
  showEnding(end);
}

function evaluateEnding(){
  const age=Math.floor(G.ageMonths/12);
  const rankIdx=RANK_ORDER.indexOf(G.rank);
  let guan=rankIdx*6+G.fame*0.2;
  let shang=G.money*0.06+(G.fields*2)+G.shopLv*12;
  let wu=G.skills.wu*0.5+G.battle*3+(G.military===5?30:0);
  let wen=G.skills.wen*0.45+(G.rank==='jinshi'||rankIdx>=3?25:0)+(G.books||0)*10;
  let yi=G.skills.med*0.35+G.heals*3;
  let yin=G.moral*0.25+G.xiu*3+(G.quest===4?40:0);
  let feng=G.cha*0.2+G.skills.talent*0.3+G.kids.length*2+(G.zhiji?4:0)+(G.spouse&&G.spouse.fromQinglou?8:0)+(G.concubines?G.concubines.length*3:0)+(G.grandkids||0)*2;
  const scores={位极人臣:guan,富可敌国:shang,一代名将:wu,文坛宗师:wen,悬壶济世:yi,得道高人:yin,风流名士:feng};
  let best='庸碌一生', bestV=0;
  for(const k in scores){ if(scores[k]>bestV){bestV=scores[k];best=k;} }
  // 覆盖判定
  if(G.reput<0&&G.moral<25) best='遗臭万年';
  else if(age<35) best='英年早逝';
  else if(bestV<25) best= age>=G.lifespan-5?'安然寿终':'庸碌一生';
  const END_DESC={
    '位极人臣':'你从一介布衣走到庙堂之巅，垂拱而治，名垂青史。',
    '富可敌国':'你凭一双巧手与胆识，把铜板滚成金山，富甲一方。',
    '一代名将':'沙场百战，马革裹尸，你的名字让敌军闻风丧胆。',
    '文坛宗师':'你笔下的锦绣文章流传天下，莘莘学子皆以你为范。',
    '悬壶济世':'你的一生救人无数，药庐前挂满感恩的锦旗。',
    '得道高人':'你勘破红尘，一苇渡江，终成一方高士。',
    '风流名士':'你风流不羁，才情四溢，天下谁人不识君。',
    '遗臭万年':'你的名字成了乡里骂人的话，青史留了一个污点。',
    '英年早逝':'天妒英才，你的人生还没展开便戛然而止。',
    '庸碌一生':'日出而作，日落而息，一世平凡，也算安稳。',
    '安然寿终':'你安然老去，儿孙绕膝，此生无憾。'
  };
  const end={title:best, desc:END_DESC[best]||'', rank: bestV>=60?'一品':bestV>=40?'三品':bestV>=25?'七品':'末品'};
  // 成就
  checkAchievements(end);
  return end;
}

let modalCallback=null;
function showEvent(ev){
  if(G.modalOpen){ // 已有弹窗展示中，排队稍后显示（如生育+子女训练同年来）
    (G.eventQueue=G.eventQueue||[]).push(ev);
    return;
  }
  G.modalOpen=true;
  sfx.event();
  $('modalTitle').textContent=ev.title;
  $('modalBody').textContent=(typeof ev.text==='function'? ev.text(G):(ev.text||''));
  const opts=$('modalOpts'); opts.innerHTML='';
  ev.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='optbtn';
    b.textContent=o.label+(o.fx?'<span class="fx"> '+o.fx+'</span>':'');
    b.innerHTML=b.textContent;
    if(o.need&&o.need(G)) b.disabled=true;
    b.addEventListener('click',()=>{
      G.modalOpen=false;
      $('modal').classList.add('hidden');
      if(o.effect) o.effect(G);
      renderUI();
      if(checkDeath()) return;
      autoSave();
      flushEventQueue();
    });
    opts.appendChild(b);
  });
  $('modal').classList.remove('hidden');
}
function flushEventQueue(){
  if(DEAD||!G||G.modalOpen) return;
  if(G.eventQueue&&G.eventQueue.length){
    showEvent(G.eventQueue.shift());
  }
}

function travelTo(r){
  if(!REGIONS[r]||!G) return;
  G.stat.travels++;
  G.visited=G.visited||{}; G.visited[r]=1;
  G.region=r;
  buildMap();
  const e=REGIONS[r].entry;
  G.x=e.x; G.y=e.y;
  animX=G.x*TILE+16; animY=G.y*TILE+16;
  path=[]; walking=false;
  renderLabels(); renderUI();
  pushLog('你来到'+REGIONS[r].name,'ev');
  G.chronicle.push({y:Math.floor(G.ageMonths/12),s:'远赴'+REGIONS[r].name});
  sfx.good();
}

function examRun(){
  const lv=RANK_ORDER.indexOf(G.rank); // 0布衣→童生试,1秀才→乡试,2举人→会试
  const need=[10,30,55][lv];
  const chanceP=clamp((G.skills.wen-need*.9)/25 + G.int/80 + (G.luck-50)/200 + (G.trait==='conghui'?.08:0), .12,.93);
  G.lastExamAt=G.ageMonths;
  if(Math.random()<chanceP){
    const names=['童生试','乡试','会试'];
    G.rank=RANK_ORDER[lv+1];
    G.fame=clamp(G.fame+[8,15,25][lv],0,100);
    G.chronicle.push({y:Math.floor(G.ageMonths/12),s:'高中'+RANK_NAME[G.rank]});
    pushLog('金榜题名！你通过了'+names[lv]+'，成为'+RANK_NAME[G.rank]+'','good');
    sfx.good();
    return {log:'',c:''};
  }else{
    G.mood=clamp(G.mood-8,0,100);
    return {log:'名落孙山，三年后再来',c:'bad'};
  }
}

/* =====================================================================
   存档 / 读档
   ===================================================================== */
function autoSave(){ saveGame(); }
function saveGame(){
  if(!G) return;
  try{
    const d={G:G, animX:animX, animY:animY, DEAD:DEAD};
    localStorage.setItem(STORE_SAVE, JSON.stringify(d));
  }catch(e){}
}
function loadGame(){
  try{
    const raw=localStorage.getItem(STORE_SAVE);
    if(!raw){ if(G) pushLog('没有找到存档','bad'); else beep(180,.1); return; }
    const d=JSON.parse(raw);
    G=d.G; DEAD=d.DEAD;
    if(!G) return;
    G.modalOpen=false;
    // 旧档兼容：补经济系统字段
    G.bank=G.bank||{dep:0,loan:0,loanAt:-999};
    G.houses=G.houses||0;
    G.hold=G.hold||null;
    G.market=G.market||{grain:100,silk:100,salt:100};
    G.marketPrev=G.marketPrev||{grain:100,silk:100,salt:100};
    // 旧档兼容：补感情系统字段
    G.concubines=G.concubines||[];
    G.grandkids=G.grandkids||0;
    if(G.spouse&&G.spouse.affection===undefined) G.spouse.affection=50;
    G.stat=G.stat||{acts:0,reads:0,trades:0,battles:0,caravans:0,travels:0,friends:0};
    G.lastAction=G.lastAction||null;
    G.friends=G.friends||[];
    G.region=G.region||'home';
    G.visited=G.visited||{home:1};
    G.enemies=G.enemies||[];
    G.books=G.books||0;
    animX=G.x*TILE+16; animY=G.y*TILE+16;
    path=[]; walking=false;
    if(DEAD){ const end=evaluateEnding(); showEnding(end); return; }
    $('startOverlay').classList.add('hidden');
    buildMapFromSave();
    renderLabels(); renderUI();
    pushLog('读档成功','good');
  }catch(e){ if(G) pushLog('存档损坏','bad'); }
}
function buildMapFromSave(){
  // 重建地图（装饰由存档种子生成）
  const seed=G.mapSeed||Math.floor(Math.random()*1e9)|0;
  G.rng=mulberry32(seed);
  mapTiles=[]; decor=[];
  buildMap();
}

  '\n· 智力/魅力/运气/体魄影响学习、婚配与成败；道德与名声影响事件走向与结局。'+
  '\n【经济】'+
  '\n· 集市看行情、囤货出仓（低买高卖）；钱庄存取吃息、应急借贷；牙行置业（瓦房→别院→庄园）收租。'+
  '\n· 码头可组商队跑长途博大利；商号、田产、俸禄各有所出；每年还要交田赋商税，记得留够银子。'+
  '\n【家室】'+
  '\n· 夫妻有感情值：常回家“与妻儿话家常”增进感情，冷落会生分；感情越笃，添丁越易。'+
  '\n· 青楼赎身：未婚可娶为正妻，已婚可收为侧室；媒婆也会上门说媒纳妾（至多三位）。侧室要花用度，妻妾争宠需安抚。'+
  '\n· 已有家室仍可去青楼「会知音」——但私会随时可能败露：伤感情、损名声，甚至闹到和离。'+
  '\n· 子女十二岁拜师学艺，十八岁成年择业（读书/从军/经商/务农/行医），日后成家生子，光耀门楣。'+
  '\n【人情】'+
  '\n· 酒馆可会友交游、赠礼厚待挚友——好友会求助、还银、厚赠。'+
  '\n· 入仕后朝中谢王两党相争，投靠哪边由你定夺：同党帮衬，政敌攻讦，站错队还可能被贬。'+
  '\n【远行】'+
  '\n· 渡口可「出远门」：京城（上朝办差、国子监、东市西市、教坊司）、边关（帅帐校场、巡城戍守、边市互市）、江南（绸庄茶园、戏楼园林、钱庄总号），处处都有独特营生。'+
  '\n· 年满十六方可远行，每趟耗时二月、银五两；外埠渡口可乘船回临安。'+
  '\n【养生】'+
  '\n· 年三十后可在家里食补、练五禽戏，庙宇打坐导引，调养身心；染病有风寒、疟疾等不同症候。'+
  '\n【其他】'+
  '\n· 声望带来头衔（乡绅→名士→贤达→天下闻名）；按 R 或点「重复上次」可连续行动；死亡页有结局图鉴与一生行迹统计。'+
  '\n· 江湖恩怨：与人结仇后仇家会寻仇暗算，可在武馆「了结恩怨」，也可破财化解。'+
  '\n· 文才八十可在京城国子监闭门著书，传世之作名动天下；结局页可一键生成文言墓志铭并复制分享。'+
  '\n【成就】成就跨世保留，一局约10~20分钟，多结局多周目。'+
  '\n【存档】每次行动后自动存档，也可手动。浏览器关掉下次继续。';
  $('helpOverlay').classList.remove('hidden');
});

   ===================================================================== */
let selIdentity='shu', selTrait='conghui', selGender='m', selRobe='#d35400';
function buildStartUI(){
  const ri=$('pickIdentity'); ri.innerHTML='';
  Object.keys(IDENTITIES).forEach(k=>{
    const b=document.createElement('button');
    b.className='pick'+(k===selIdentity?' sel':'');
    b.innerHTML='<b>'+IDENTITIES[k].name+'</b><small>'+IDENTITIES[k].note+'</small>';
    b.onclick=()=>{selIdentity=k;buildStartUI();};
    ri.appendChild(b);
  });
  const rt=$('pickTrait'); rt.innerHTML='';
  Object.keys(TRAITS).forEach(k=>{
    const b=document.createElement('button');
    b.className='pick'+(k===selTrait?' sel':'');
    b.innerHTML='<b>'+TRAITS[k].name+'</b><small>'+TRAITS[k].desc+'</small>';
    b.onclick=()=>{selTrait=k;buildStartUI();};
    rt.appendChild(b);
  });
  const robes=['#d35400','#c0392b','#5b7bd5','#27ae60','#8e44ad'];
  const rr=$('robeRow'); rr.innerHTML='';
  robes.forEach(c=>{
    const s=document.createElement('span');
    s.className='swatch'+(c===selRobe?' sel':'');
    s.style.background=c;
    s.onclick=()=>{selRobe=c;buildStartUI();};
    rr.appendChild(s);
  });
}
$('btnStart').addEventListener('click',()=>{
  const nm=$('inpName').value.trim();
  selGender=$('selGender').value;
  $('startOverlay').classList.add('hidden');
  newGame(selIdentity, selTrait, selGender, nm, selRobe);
});
$('btnRandom').addEventListener('click',()=>{
  const ids=Object.keys(IDENTITIES), trs=Object.keys(TRAITS);
  selIdentity=ids[rnd(0,ids.length-1)]; selTrait=trs[rnd(0,trs.length-1)];
  selGender=chance(.5)?'m':'f';
  const robes=['#d35400','#c0392b','#5b7bd5','#27ae60','#8e44ad'];
  selRobe=robes[rnd(0,robes.length-1)];
  buildStartUI();
  const nm=$('inpName'); nm.value=randName(selGender);
});

function showEnding(end){
  lastEnding=end;
  $('endTitle').textContent=end.title;
  $('endRank').textContent='品级 · '+end.rank+'　·　'+end.desc;
  const age=Math.floor(G.ageMonths/12);
  $('endStats').innerHTML=[
    ['享年',age+' 岁'],['银两',G.money+' 两'],['声望',G.fame],
    ['最高官阶',RANK_NAME[G.rank]],['子女',G.kids.length+' 人'],['成就',G.achievements.length+' 项'],
    ['道德',G.moral],['文才',G.skills.wen],['武艺',G.skills.wu]
  ].map(([k,v])=>'<div class="cell"><b>'+v+'</b><span>'+k+'</span></div>').join('');
  const s=G.stat||{};
  $('endData').innerHTML=[
    ['行动总数',s.acts||0],['读书次数',s.reads||0],['买卖次数',s.trades||0],
    ['征战次数',s.battles||0],['行医救人',G.heals||0],['跑商次数',s.caravans||0],
    ['远行次数',s.travels||0],['挚友',(G.friends||[]).length],['修行次数',G.xiu||0]
  ].map(([k,v])=>'<div class="cell"><b>'+v+'</b><span>'+k+'</span></div>').join('');
  $('endChronicle').innerHTML=G.chronicle.map(c=>'<div>太初'+c.y+'年 · '+c.s+'</div>').join('');
  const ael=$('endAchv'); ael.innerHTML='';
  ACHS.forEach(a=>{
    const got=!!unlockedAchv[a.id];
    const d=document.createElement('span');
    d.className='achv'+(got?' got':'')+(G.newAchv===a.id?' new':'');
    d.textContent=(got?'◆ ':'◇ ')+a.name;
    ael.appendChild(d);
  });
  $('endOverlay').classList.remove('hidden');
}
function showCatalog(){
  const el=$('catalogList'); el.innerHTML='';
  END_CATALOG.forEach(c=>{
    const got=!!unlockedEndings[c.title];
    const d=document.createElement('div');
    d.className='cat'+(got?' got':'');
    d.innerHTML='<b>'+(got?'◆ ':'◇ ')+c.title+'</b><small>'+(got?'已达成':'未达成 · '+c.hint)+'</small>';
    el.appendChild(d);
  });
  $('catalogOverlay').classList.remove('hidden');
}
const EPI_MOTTO={
  '位极人臣':'朝为田舍郎，暮登天子堂。',
  '富可敌国':'金玉满堂，何足道哉。',
  '一代名将':'醉卧沙场君莫笑，古来征战几人回。',
  '文坛宗师':'文章千古事，得失寸心知。',
  '悬壶济世':'但愿世间人无病，何妨架上药生尘。',
  '得道高人':'一花一世界，一叶一菩提。',
  '风流名士':'江山风月，本无常主，闲者便是主人。',
  '遗臭万年':'身后是非谁管得，满村听说蔡中郎。',
  '英年早逝':'天不假年，魂归太虚。',
  '安然寿终':'生如夏花之绚烂，死如秋叶之静美。',
  '庸碌一生':'平平淡淡才是真。'
};
function makeEpitaph(){
  if(!G) return '';
  const age=Math.floor(G.ageMonths/12);
  const end=lastEnding||evaluateEnding();
  const deeds=[];
  if(RANK_ORDER.indexOf(G.rank)>=4) deeds.push('官至'+RANK_NAME[G.rank]);
  if(G.rank==='zaixiang') deeds.push('位极人臣');
  if(G.military===5) deeds.push('官拜将军');
  if((G.books||0)>0) deeds.push('著书'+(G.books||0)+'部');
  if(G.shopOwned) deeds.push('置有商号');
  if(G.houses===3) deeds.push('拥庄园广厦');
  if(G.money>=500) deeds.push('家财颇丰');
  const liveKids=G.kids.filter(k=>!k.dead).length;
  if(liveKids) deeds.push('育有子女'+liveKids+'人');
  if(G.grandkids) deeds.push('孙辈绕膝');
  if(G.heals>=10) deeds.push('活人无数');
  if(G.battle>=50) deeds.push('身经百战');
  if(!deeds.length) deeds.push('平淡度日');
  const c=END_CATALOG.find(x=>x.title===end.title);
  return [
    '【墓志铭】',
    '公讳'+G.name+'，'+IDENTITIES[G.identity].name+'出身，性'+TRAITS[G.trait].name+'。',
    '生于太初七年，卒于太初'+yearNow()+'年，享年'+age+'岁。',
    '一生'+(G.gender==='m'?'公':'氏')+'历尽浮沉：'+deeds.slice(0,4).join('，')+'。',
    '盖棺论之，'+(c?c.hint:end.title)+'。',
    '铭曰：'+(EPI_MOTTO[end.title]||'浮生若梦，为欢几何。')
  ].join('\n');
}
function showEpitaph(){
  $('epitaphText').value=makeEpitaph();
  $('epitaphOverlay').classList.remove('hidden');
}
function copyEpitaph(){
  const t=$('epitaphText').value;
  if(!t) return;
  const done=()=>{ if(G) pushLog('墓志铭已复制，可粘贴分享','good'); beep(660,.08); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(()=>{ legacyCopy(t); done(); });
  }else legacyCopy(t);
}
function legacyCopy(t){
  try{
    const ta=$('epitaphText'); ta.removeAttribute('readonly'); ta.select(); ta.setSelectionRange(0,t.length);
    document.execCommand('copy'); ta.setAttribute('readonly','');
  }catch(e){}
}
