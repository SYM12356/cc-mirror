  function drawKakaBody(t, bob, p) {
    const rest = p.rest > 0;
    const jump = p.jump > 0;
    const skin0 = rest ? '#b9bebf' : '#f7d6ae';
    const skin1 = rest ? '#969b9d' : '#e2b184';
    const uni0  = rest ? '#939a9d' : '#5f92d8';
    const uni1  = rest ? '#71787b' : '#37619b';
    const hair  = rest ? '#606669' : '#3b2c21';
    const ink   = rest ? '#5b6164' : '#2b2b33';
    const breath = rest ? Math.sin(t * 1.8) * 1.4 : 0;

    ctx.save();
    ctx.translate(0, (rest ? 4 : 0) + breath + (jump ? 0 : bob * 0.4));

    // 腿
    if (jump) {
      ctx.fillStyle = uni1;
      ctx.beginPath(); ctx.ellipse(-12, 16, 10, 9, -0.5, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(12, 16, 10, 9, 0.5, 0, TAU); ctx.fill();
    } else {
      ctx.fillStyle = uni1;
      ctx.beginPath(); ctx.ellipse(-11, 22, 9, 12, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(11, 22, 9, 12, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = ink;
      ctx.beginPath(); ctx.ellipse(-12, 34, 10, 5, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(12, 34, 10, 5, 0, 0, TAU); ctx.fill();
    }

    // 身体（圆滚滚的校服）
    const bdy = ctx.createLinearGradient(0, -22, 0, 32);
    bdy.addColorStop(0, uni0); bdy.addColorStop(1, uni1);
    ctx.fillStyle = bdy;
    ctx.beginPath(); ctx.ellipse(0, 4, 27, 30, 0, 0, TAU); ctx.fill();
    // 领口
    ctx.fillStyle = rest ? '#d3d7d8' : '#fdfbf3';
    ctx.beginPath();
    ctx.moveTo(-9, -20); ctx.lineTo(0, -6); ctx.lineTo(9, -20);
    ctx.quadraticCurveTo(0, -26, -9, -20);
    ctx.closePath(); ctx.fill();
    // 扣子
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.arc(0, 8, 2.2, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 18, 2.2, 0, TAU); ctx.fill();
    // 校服侧条纹（运动校服经典白边）
    ctx.fillStyle = rest ? 'rgba(255,255,255,.4)' : 'rgba(255,255,255,.8)';
    ctx.beginPath(); ctx.ellipse(-23, 8, 3.2, 20, 0.05, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(23, 8, 3.2, 20, -0.05, 0, TAU); ctx.fill();
    // 胸前名牌（左胸）
    ctx.fillStyle = '#fdfbf3';
    rr(-22, 0, 16, 9, 2.5); ctx.fill();
    ctx.strokeStyle = 'rgba(180,60,50,.8)'; ctx.lineWidth = 1.2;
    rr(-22, 0, 16, 9, 2.5); ctx.stroke();
    ctx.fillStyle = '#c23c30';
    ctx.font = 'bold 7px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('尻', -14, 4.5);

    // 手臂
    ctx.fillStyle = skin1;
    if (jump) {
      ctx.beginPath(); ctx.ellipse(-26, -6, 8, 10, -0.7, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(26, -6, 8, 10, 0.7, 0, TAU); ctx.fill();
    } else if (rest) {
      ctx.beginPath(); ctx.ellipse(-17, 16, 8, 7, 0.4, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(17, 16, 8, 7, -0.4, 0, TAU); ctx.fill();
    } else {
      ctx.beginPath(); ctx.ellipse(-24, 8, 8, 10, -0.3, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(24, 8, 8, 10, 0.3, 0, TAU); ctx.fill();
    }
    // 校服袖口白边
    ctx.strokeStyle = rest ? 'rgba(255,255,255,.45)' : 'rgba(255,255,255,.9)';
    ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    if (jump) {
      ctx.beginPath(); ctx.ellipse(-26, -6, 8, 10, -0.7, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(26, -6, 8, 10, 0.7, 0, TAU); ctx.stroke();
    } else if (rest) {
      ctx.beginPath(); ctx.ellipse(-17, 16, 8, 7, 0.4, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(17, 16, 8, 7, -0.4, 0, TAU); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.ellipse(-24, 8, 8, 10, -0.3, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(24, 8, 8, 10, 0.3, 0, TAU); ctx.stroke();
    }
    // 右手永远攥着一根辣条
    const latiao = (hx, hy, ang, L) => {
      ctx.save();
      ctx.translate(hx, hy);
      ctx.rotate(ang + Math.sin(t * 3.1) * 0.07);
      ctx.fillStyle = rest ? '#8e3328' : '#c22f1e';
      rr(-3.4, -L * 0.35, 6.8, L, 3.2); ctx.fill();
      ctx.fillStyle = rest ? '#a04a3a' : '#e8543a';
      rr(-1.7, -L * 0.35 + 2, 2.8, L - 4, 1.4); ctx.fill();
      ctx.strokeStyle = 'rgba(110,18,8,.55)'; ctx.lineWidth = 1.3;
      for (let k = 1; k <= 3; k++) {
        const yy = -L * 0.35 + (L / 4) * k;
        ctx.beginPath(); ctx.moveTo(-3.4, yy); ctx.lineTo(3.4, yy); ctx.stroke();
      }
      ctx.restore();
    };
    if (jump) latiao(30, -13, -0.7, 27);
    else if (rest) latiao(23, 19, 1.75, 23);
    else latiao(28, 6, 0.42, 27);

    // 头
    const hy = rest ? -34 : -38;
    const hg = ctx.createRadialGradient(-6, hy - 6, 4, 0, hy, 22);
    hg.addColorStop(0, skin0); hg.addColorStop(1, skin1);
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(0, hy, 20, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(-19, hy + 2, 4.6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(19, hy + 2, 4.6, 0, TAU); ctx.fill();
    // 头发
    ctx.fillStyle = hair;
    ctx.beginPath();
    ctx.ellipse(0, hy - 12, 19, 10, 0, 0, TAU); ctx.fill();
    ctx.beginPath();
    ctx.arc(0, hy - 2, 20, Math.PI * 1.04, Math.PI * 1.96);
    ctx.closePath(); ctx.fill();

    // 眼睛
    if (rest) {
      ctx.strokeStyle = ink; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(-7, hy + 2, 5.6, 0.25, Math.PI - 0.25); ctx.stroke();
      ctx.beginPath(); ctx.arc(7, hy + 2, 5.6, 0.25, Math.PI - 0.25); ctx.stroke();
    } else {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(-7, hy + 1, 5.4, 6, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(7, hy + 1, 5.4, 6, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = ink;
      ctx.beginPath(); ctx.arc(-6, hy + 2, 2.6, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(8, hy + 2, 2.6, 0, TAU); ctx.fill();
    }
    // 腮红
    ctx.fillStyle = rest ? 'rgba(160,150,150,.35)' : 'rgba(240,140,130,.45)';
    ctx.beginPath(); ctx.ellipse(-14, hy + 9, 5, 3.2, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(14, hy + 9, 5, 3.2, 0, 0, TAU); ctx.fill();
    // 嘴
    ctx.fillStyle = ink;
    if (rest) {
      ctx.beginPath(); ctx.ellipse(0, hy + 12, 4, 3 + Math.sin(t * 2) * 1.6, 0, 0, TAU); ctx.fill();
    } else {
      ctx.strokeStyle = ink; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, hy + 8, 5, 0.35, Math.PI - 0.35); ctx.stroke();
    }

    // 睡觉：Zzz + 快醒时越来越急的闪白
    if (rest) {
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.font = 'bold 13px sans-serif';
      for (let i = 0; i < 3; i++) {
        const ph = (t * 0.9 + i * 0.33) % 1;
        ctx.globalAlpha = 1 - ph;
        ctx.fillText('Z', 16 + ph * 12, hy - 26 - ph * 22);
      }
      ctx.globalAlpha = 1;
      if (p.rest < 3) {
        const freq = 5 + (3 - p.rest) * 9;
        if (Math.sin(t * freq) > 0.55) {
          ctx.globalAlpha = 0.3;
          ctx.fillStyle = '#fff';
          ctx.beginPath(); ctx.ellipse(0, -10, 30, 46, 0, 0, TAU); ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
    }
    // 跳跃冲击线
    if (jump) {
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(-32 - i * 6, 12 + i * 8);
        ctx.lineTo(-20 - i * 6, 8 + i * 8);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  /* ---- 超然：不戴眼镜的微胖学生 · 原地待命 · 前方一格 10 拳 ---- */
  function drawChaoranBody(t, bob, p) {
    const fighting = p.fistT > 0;
    const skin0 = '#f7d0a6', skin1 = '#e0ab7c';
    ctx.save();
    ctx.translate(0, bob * 0.35);
    if (fighting) { ctx.translate(2, 0); ctx.rotate(0.06); }   // 出拳时前倾

    // 腿 + 白球鞋
    ctx.strokeStyle = '#e8b98a'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-8, 24); ctx.lineTo(-9, 33); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8, 24); ctx.lineTo(9, 33); ctx.stroke();
    ctx.fillStyle = '#f2f2f0';
    ctx.beginPath(); ctx.ellipse(-10, 36, 8, 4.2, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(10, 36, 8, 4.2, 0, 0, TAU); ctx.fill();

    // 深蓝短裤（微胖学生便装）
    ctx.fillStyle = '#3a4b8f';
    ctx.beginPath(); ctx.ellipse(0, 19, 18, 10, 0, 0, TAU); ctx.fill();

    // 白 T 恤：微胖肚子
    const bd = ctx.createLinearGradient(-20, -16, 20, 20);
    bd.addColorStop(0, '#ffffff'); bd.addColorStop(1, '#dcdcd4');
    ctx.fillStyle = bd;
    ctx.beginPath(); ctx.ellipse(0, 2, 22, 20, 0, 0, TAU); ctx.fill();
    // T 恤领口
    ctx.strokeStyle = '#c8c8be'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, -14, 6.5, 0.25, Math.PI - 0.25); ctx.stroke();
    // 肚子轮廓线
    ctx.strokeStyle = 'rgba(190,190,178,.55)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(2, 8, 12, 0.5, Math.PI - 0.5); ctx.stroke();

    // 手臂
    ctx.fillStyle = skin1;
    if (fighting) {
      // 双臂交替向前出拳（2 秒 10 拳 → 每臂 5 次）
      for (const sgn of [0, Math.PI]) {
        const ph = t * 10 + sgn;
        const ext = Math.max(0, Math.sin(ph));         // 0~1 伸出
        const ax = 16 + ext * 20, ay = -4 + Math.sin(ph + 1.2) * 4;
        ctx.strokeStyle = skin1; ctx.lineWidth = 7; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(12 * (sgn ? 1 : 1), -8 + sgn * 3); ctx.lineTo(ax, ay); ctx.stroke();
        ctx.fillStyle = skin0;
        ctx.beginPath(); ctx.arc(ax + 3, ay, 5.5, 0, TAU); ctx.fill();
        ctx.fillStyle = skin1;
        if (ext > 0.75) {
          // 拳风
          ctx.strokeStyle = 'rgba(255,240,200,.8)'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(ax + 6, ay, 9, -0.8, 0.8); ctx.stroke();
          ctx.strokeStyle = skin1;
        }
      }
    } else {
      const sw = Math.sin(t * 2) * 2;
      ctx.strokeStyle = skin1; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-16, -8); ctx.lineTo(-19, 6 + sw); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(16, -8); ctx.lineTo(19, 6 - sw); ctx.stroke();
      ctx.fillStyle = skin0;
      ctx.beginPath(); ctx.arc(-19, 9 + sw, 5, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(19, 9 - sw, 5, 0, TAU); ctx.fill();
    }

    // 大圆脑袋（不戴眼镜）
    const hy = -26;
    const hg = ctx.createRadialGradient(-5, hy - 5, 4, 0, hy, 17);
    hg.addColorStop(0, skin0); hg.addColorStop(1, skin1);
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(0, hy, 16, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(-14.5, hy + 2, 3.6, 0, TAU); ctx.fill();   // 耳朵
    ctx.beginPath(); ctx.arc(14.5, hy + 2, 3.6, 0, TAU); ctx.fill();
    // 黑色短碎发 + 呆毛
    ctx.fillStyle = '#38291f';
    ctx.beginPath();
    ctx.ellipse(0, hy - 9, 15.5, 8.5, 0, 0, TAU); ctx.fill();
    ctx.beginPath();
    ctx.arc(0, hy - 1, 16, Math.PI * 1.02, Math.PI * 1.98);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-8, hy - 14);
    ctx.quadraticCurveTo(-5, hy - 21, 0, hy - 16);
    ctx.quadraticCurveTo(4, hy - 12, 8, hy - 13);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#38291f'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, hy - 15); ctx.quadraticCurveTo(3, hy - 22, 7, hy - 19); ctx.stroke();  // 一根呆毛

    // 眉毛、眼睛（无眼镜）、憨厚笑脸、腮红
    ctx.strokeStyle = '#4a3428'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-9, hy - 3); ctx.lineTo(-3.5, hy - 4.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(3.5, hy - 4.5); ctx.lineTo(9, hy - 3); ctx.stroke();
    ctx.fillStyle = '#2b2118';
    ctx.beginPath(); ctx.arc(-6, hy + 1, 2.4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(6, hy + 1, 2.4, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath(); ctx.arc(-6.7, hy + 0.3, 0.9, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(5.3, hy + 0.3, 0.9, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#4a3428'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(0, hy + 6, 5.5, 0.3, Math.PI - 0.3); ctx.stroke();
    ctx.fillStyle = 'rgba(240,140,120,.4)';
    ctx.beginPath(); ctx.ellipse(-11, hy + 6, 4, 2.6, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(11, hy + 6, 4, 2.6, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawPlantBody(type, t, bob, p) {
    switch (type) {
      case 'sunflower': drawInkBottleBody(t, bob, p); break;
      case 'peashooter': drawPencilBody(t, bob, p); break;
      case 'wallnut': drawEraserBody(t, bob, p); break;
      case 'snowpea': drawWindowBody(t, bob, p); break;
      case 'repeater': drawPenBody(t, bob, p); break;
      case 'cherry': drawYogurtBody(t, bob, p); break;
      case 'ruler': drawRulerBody(t, bob, p); break;
      case 'stapler': drawStaplerBody(t, bob, p); break;
      case 'kaka': drawKakaBody(t, bob, p); break;
      case 'chaoran': drawChaoranBody(t, bob, p); break;
    }
  }

  function drawPlant(p, alpha) {
    const bob = Math.sin(G.time * 2.2 + p.anim) * 2;
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.translate(p.x, p.y);
    // 阴影
    if (!(p.type === 'kaka' && p.jump > 0)) {
      ctx.fillStyle = 'rgba(0,0,0,0.16)';
      ctx.beginPath(); ctx.ellipse(0, 37, 27, 8, 0, 0, TAU); ctx.fill();
    }
    drawPlantBody(p.type, G.time, bob, p);
    // 受击闪白
    if (p.flash > 0) {
      ctx.globalAlpha = p.flash * 0.35 * (alpha == null ? 1 : alpha);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(0, -6, 26, 34, 0, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  /* ============================================================
     绘制：僵尸
  ============================================================ */
  /* ---- BOSS 吴红肠：一根巨大的香肠 ---- */
  /* ---- BOSS 吴红肠：贯穿五行的巨型女性香肠 ---- */
  function drawBoss(z) {
    const t = G.time;
    const ph = z.walkPhase;
    const dying = z.dying;
    const a = dying ? clamp(z.dieT / 3.0, 0, 1) : 1;

    // 身体贯穿整个课桌区（五行）：局部坐标上沿 ≈ 网格顶，下沿 ≈ 网格底
    const top = -(2 * cellH + 96);
    const bot = 2 * cellH - 10;
    const bh = bot - top;
    const fy = top + 128;           // 脸部中心

    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(z.x, z.y);
    if (z.enterT > 0) {
      const k = 1 + (z.enterT / 0.9) * 0.2;
      ctx.scale(k, k);
    }
    const sway = Math.sin(t * 2.2 + ph * 0.4);

    // 影子
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.beginPath(); ctx.ellipse(0, bot + 10, 62, 14, 0, 0, TAU); ctx.fill();

    // 小短腿 + 小皮鞋
    ctx.strokeStyle = '#a8322a'; ctx.lineWidth = 13; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-13, bot - 26); ctx.lineTo(-16, bot - 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(13, bot - 26); ctx.lineTo(16, bot - 4); ctx.stroke();
    ctx.fillStyle = '#4a2c30';
    ctx.beginPath(); ctx.ellipse(-19, bot, 13, 7, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(19, bot, 13, 7, 0, 0, TAU); ctx.fill();

    ctx.translate(0, sway * 2.4);

    // 身体：修长的香肠（胶囊形）
    const bg = ctx.createLinearGradient(-56, 0, 56, 0);
    bg.addColorStop(0, '#8f241d');
    bg.addColorStop(0.28, '#d8503c');
    bg.addColorStop(0.52, '#f58a70');
    bg.addColorStop(0.78, '#cf4634');
    bg.addColorStop(1, '#8a2019');
    ctx.fillStyle = bg;
    rr(-56, top, 112, bh, 54); ctx.fill();
    ctx.strokeStyle = 'rgba(90,20,14,.55)'; ctx.lineWidth = 2.5;
    rr(-56, top, 112, bh, 54); ctx.stroke();

    // 顶端扎口
    ctx.fillStyle = 'rgba(255,205,185,.55)';
    ctx.beginPath(); ctx.ellipse(0, top + 7, 32, 9, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(120,40,30,.5)'; ctx.lineWidth = 2;
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(k * 14 - 5, top - 2); ctx.lineTo(k * 14 + 5, top + 14);
      ctx.stroke();
    }

    // 头顶蝴蝶结（粉色，女性化标志）
    ctx.save();
    ctx.translate(-20, top + 2);
    ctx.rotate(Math.sin(t * 3) * 0.06 - 0.18);
    ctx.fillStyle = '#ff7fb2';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-30, -20, -34, 2); ctx.quadraticCurveTo(-30, 22, 0, 6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(26, -22, 32, 0); ctx.quadraticCurveTo(26, 20, 0, 6); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(190,60,110,.55)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-30, -20, -34, 2); ctx.quadraticCurveTo(-30, 22, 0, 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(26, -22, 32, 0); ctx.quadraticCurveTo(26, 20, 0, 6); ctx.stroke();
    ctx.fillStyle = '#e2548e';
    ctx.beginPath(); ctx.arc(0, 2, 8, 0, TAU); ctx.fill();
    ctx.restore();

    // 高光
    ctx.fillStyle = 'rgba(255,255,255,.26)';
    rr(-40, top + 30, 14, bh - 90, 7); ctx.fill();
    // 肉粒斑点
    ctx.fillStyle = 'rgba(120,30,24,.32)';
    for (let k = 0; k < 9; k++) {
      const sx = -44 + (k * 47) % 88, sy = top + 40 + (k * 71) % (bh - 120);
      ctx.beginPath(); ctx.arc(sx, sy, 3.4, 0, TAU); ctx.fill();
    }

    // 眼睛（更大更妩媚 + 睫毛）
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-19, fy, 15, 18, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(19, fy, 15, 18, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(90,25,18,.55)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(-19, fy, 15, 18, 0, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(19, fy, 15, 18, 0, 0, TAU); ctx.stroke();
    // 睫毛（上翘三根）
    ctx.strokeStyle = '#3a1210'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    for (const sgn of [-1, 1]) {
      for (let k = 0; k < 3; k++) {
        const lx = sgn * (10 + k * 6), ly = fy - 14 + k * 2.5;
        ctx.beginPath();
        ctx.moveTo(lx, ly);
        ctx.lineTo(lx + sgn * 6, ly - 7 - k);
        ctx.stroke();
      }
    }
    ctx.fillStyle = '#2b1512';
    ctx.beginPath(); ctx.arc(-15, fy + 4, 6.6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(15, fy + 4, 6.6, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.beginPath(); ctx.arc(-17, fy + 1, 2.6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(13, fy + 1, 2.6, 0, TAU); ctx.fill();
    // 眉毛（细弯眉）
    ctx.strokeStyle = '#6e2018'; ctx.lineWidth = 3.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-32, fy - 27); ctx.quadraticCurveTo(-20, fy - 33, -7, fy - 25); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(32, fy - 27); ctx.quadraticCurveTo(20, fy - 33, 7, fy - 25); ctx.stroke();

    // 嘴：饱满的红唇
    ctx.save();
    ctx.translate(0, fy + 36);
    ctx.fillStyle = '#e2334a';
    ctx.beginPath();
    ctx.moveTo(-15, -4);
    ctx.quadraticCurveTo(-7, -12, 0, -5);
    ctx.quadraticCurveTo(7, -12, 15, -4);
    ctx.quadraticCurveTo(7, 13, 0, 13);
    ctx.quadraticCurveTo(-7, 13, -15, -4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.4)';
    ctx.beginPath(); ctx.ellipse(-6, -4, 4, 2, -0.3, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(6, -4, 4, 2, 0.3, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(120,15,25,.7)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-15, -4); ctx.quadraticCurveTo(-7, -12, 0, -5); ctx.quadraticCurveTo(7, -12, 15, -4); ctx.stroke();
    ctx.restore();

    // 腮红
    ctx.fillStyle = 'rgba(255,120,110,.45)';
    ctx.beginPath(); ctx.ellipse(-38, fy + 26, 12, 7, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(38, fy + 26, 12, 7, 0, 0, TAU); ctx.fill();

    // 珍珠项链
    ctx.strokeStyle = 'rgba(255,240,220,.85)';
    ctx.lineWidth = 4; ctx.lineCap = 'round';
    for (let k = -3; k <= 3; k++) {
      const nx = k * 11, ny = fy + 62 + Math.abs(k) * 4;
      ctx.fillStyle = '#fdf4e4';
      ctx.beginPath(); ctx.arc(nx, ny, 4.6, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(150,120,90,.4)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(nx, ny, 4.6, 0, TAU); ctx.stroke();
    }

    // 手臂：一手叉腰，一手朝左优雅挥动
    ctx.strokeStyle = '#c8422f'; ctx.lineWidth = 15; ctx.lineCap = 'round';
    const arm = Math.sin(t * 3.2) * 6;
    ctx.beginPath(); ctx.moveTo(46, fy + 96); ctx.quadraticCurveTo(66, fy + 110, 52, fy + 132); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-46, fy + 92); ctx.lineTo(-74, fy + 74 - arm); ctx.stroke();
    ctx.fillStyle = '#e0674f';
    ctx.beginPath(); ctx.ellipse(-78, fy + 72 - arm, 11, 9, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(52, fy + 136, 10, 8, 0, 0, TAU); ctx.fill();

    // 蓄力发红光
    if (!dying) {
      const ch = 1 - clamp(z.fireTimer / 7, 0, 1);
      if (ch > 0.72) {
        ctx.globalAlpha = a * (0.22 + Math.sin(t * 22) * 0.16);
        ctx.fillStyle = '#ff5f42';
        rr(-64, top - 4, 128, bh + 8, 56); ctx.fill();
        ctx.globalAlpha = a;
      }
    }
    // 受击闪白
    if (z.flash > 0) {
      ctx.globalAlpha = a * z.flash * 0.45;
      ctx.fillStyle = '#fff';
      rr(-58, top + 2, 116, bh - 4, 54); ctx.fill();
      ctx.globalAlpha = a;
    }
    ctx.restore();
  }

  function drawZombie(z) {
    if (z.type === 'boss') { drawBoss(z); return; }
    const t = G.time;
    const ph = z.walkPhase;
    const slow = z.slowUntil > t;
    const ZC = ZCOLOR[z.type] || ZCOLOR.normal;

    ctx.save();
    ctx.translate(z.x, z.y);

    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath(); ctx.ellipse(0, 2, 24, 7, 0, 0, TAU); ctx.fill();

    // 小短腿（纸片腿）
    const swing = z.eating ? Math.sin(ph * 0.8) * 2 : Math.sin(ph) * 9;
    ctx.strokeStyle = slow ? '#c2d4de' : ZC.limb;
    ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-6, -30); ctx.lineTo(-6 + swing, -4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, -30); ctx.lineTo(6 - swing, -4); ctx.stroke();
    ctx.fillStyle = '#3a3730';
    ctx.beginPath(); ctx.ellipse(-7 + swing, -2, 8, 4, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7 - swing, -2, 8, 4, 0, 0, TAU); ctx.fill();

    // 作业纸身体（微微晃动）
    const wob = Math.sin(t * 3 + ph * 0.5) * 2;
    const pg = ctx.createLinearGradient(-18, -80, 18, -26);
    pg.addColorStop(0, slow ? '#dce9f2' : ZC.body0);
    pg.addColorStop(1, slow ? '#b9cfdd' : ZC.body1);
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.moveTo(-16, -28);
    ctx.lineTo(-17 + wob * 0.4, -70);
    ctx.quadraticCurveTo(0, -76 - wob * 0.5, 17 - wob * 0.4, -70);
    ctx.lineTo(16, -28);
    ctx.quadraticCurveTo(0, -22, -16, -28);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(110,100,70,.35)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // 横线
    ctx.strokeStyle = 'rgba(120,160,210,.5)';
    ctx.lineWidth = 1.2;
    for (let k = 0; k < 4; k++) {
      const ly = -56 + k * 7;
      ctx.beginPath(); ctx.moveTo(-12, ly); ctx.lineTo(12, ly); ctx.stroke();
    }
    // 字迹（波浪涂鸦）
    ctx.strokeStyle = 'rgba(90,90,110,.55)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(-10, -52);
    for (let k = 0; k < 6; k++) ctx.lineTo(-8 + k * 3.6, -52 + ((k % 2) ? -2.4 : 2.4));
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-10, -44.5);
    for (let k = 0; k < 5; k++) ctx.lineTo(-8 + k * 3.6, -44.5 + ((k % 2) ? -2.2 : 2.2));
    ctx.stroke();
    // 红笔叉与红圈（老师批改）
    ctx.strokeStyle = '#d84040'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(4, -55); ctx.lineTo(11, -48);
    ctx.moveTo(11, -55); ctx.lineTo(4, -48);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(-6, -52, 5.5, 0, TAU); ctx.stroke();

    // 手臂（纸片手朝左伸）
    ctx.strokeStyle = slow ? '#c2d4de' : ZC.limb;
    ctx.lineWidth = 7;
    const armSwing = z.eating ? Math.sin(ph * 3) * 3 : Math.sin(ph + 1) * 4;
    ctx.beginPath(); ctx.moveTo(-12, -62); ctx.lineTo(-27, -54 + armSwing); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(10, -58); ctx.lineTo(-12, -48 - armSwing * 0.6); ctx.stroke();
    ctx.fillStyle = slow ? '#c2d4de' : ZC.limb;
    ctx.beginPath(); ctx.ellipse(-28, -54 + armSwing, 5.5, 4.5, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-13, -48 - armSwing * 0.6, 5, 4.2, 0, 0, TAU); ctx.fill();

    // 眼睛
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-6, -74, 5.5, 6.2, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5, -74, 5, 5.8, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(110,100,70,.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(-6, -74, 5.5, 6.2, 0, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(5, -74, 5, 5.8, 0, 0, TAU); ctx.stroke();
    ctx.fillStyle = slow ? '#3a86ad' : '#c23a2e';
    ctx.beginPath(); ctx.arc(-5, -73.5, 2.2, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -73.5, 2, 0, TAU); ctx.fill();
    // 眉毛 + 嘴
    ctx.strokeStyle = '#5a5040'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-11, -79); ctx.lineTo(-2, -77); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(10, -79); ctx.lineTo(2, -77); ctx.stroke();
    ctx.fillStyle = '#6a5040';
    const mouthOpen = z.eating ? 3.5 + Math.sin(ph * 8) * 2 : 2.5;
    ctx.beginPath(); ctx.ellipse(-1, -66, 5.5, mouthOpen, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(-5, -68, 2.4, 2.6);
    ctx.fillRect(0, -68, 2.4, 2.6);

    // 旗帜：红笔"重做"
    if (z.type === 'flag') {
      ctx.strokeStyle = '#8a6a3f'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(6, -58); ctx.lineTo(16, -138); ctx.stroke();
      const wave = Math.sin(t * 6) * 5;
      ctx.fillStyle = '#fbf6e8';
      ctx.beginPath();
      ctx.moveTo(16, -138);
      ctx.quadraticCurveTo(46 + wave, -130, 54, -116);
      ctx.quadraticCurveTo(38, -110, 15, -110);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(120,110,80,.4)'; ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.fillStyle = '#d84040';
      ctx.font = 'bold 12px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('重做', 32, -123);
    }

    // 订正本专属：折角 + 批改条 + 冲刺拖影
    if (z.type === 'dash') {
      ctx.fillStyle = '#e2d8f7';
      ctx.beginPath();
      ctx.moveTo(-16, -30); ctx.lineTo(-16, -44); ctx.lineTo(-6, -30);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(120,100,170,.5)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-16, -44); ctx.lineTo(-6, -30); ctx.stroke();
      // 订书钉别住的批改条
      ctx.fillStyle = '#fbf6e8';
      rr(-13, -63, 26, 9, 2); ctx.fill();
      ctx.strokeStyle = '#d84040'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-9, -60); ctx.lineTo(8, -58); ctx.stroke();
      ctx.fillStyle = '#b9c2cf';
      rr(-2, -63, 5, 9, 1); ctx.fill();

      if (z.dashUntil > t) {
        ctx.globalAlpha = 0.4;
        ctx.strokeStyle = '#8e79cb'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        for (let k = 0; k < 3; k++) {
          const yy = -28 - k * 24;
          const len = 22 + (k % 2) * 12;
          ctx.beginPath(); ctx.moveTo(24, yy); ctx.lineTo(24 + len, yy); ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
    }

    // 冰冻覆层
    if (slow) {
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = '#9fe6ff';
      rr(-20, -110, 40, 84, 14); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // 受击闪白
    if (z.flash > 0) {
      ctx.globalAlpha = z.flash * 0.5;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.ellipse(0, -50, 26, 50, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // 踩到臭酸奶：头顶冒臭气
    if (z.onStink) {
      ctx.globalAlpha = 0.55 + Math.sin(t * 5) * 0.2;
      ctx.strokeStyle = '#a8b45e'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      for (let k = -1; k <= 1; k += 2) {
        ctx.beginPath();
        ctx.moveTo(k * 6, -112);
        ctx.quadraticCurveTo(k * 6 + 5, -120, k * 6, -128);
        ctx.quadraticCurveTo(k * 6 - 5, -136, k * 6 + 2, -142);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  /* ============================================================
     绘制：场景与 UI
  ============================================================ */
  // 预渲染背景（避免每帧随机草纹闪烁）
  const bgCanvas = document.createElement('canvas');
  bgCanvas.width = W * DPR; bgCanvas.height = H * DPR;
  function paintBackground(pc) {
    pc.setTransform(DPR, 0, 0, DPR, 0, 0);
    // 墙面底色
    const wallG = pc.createLinearGradient(0, 0, 0, H);
    wallG.addColorStop(0, '#e8dfc8'); wallG.addColorStop(1, '#cfc4a6');
    pc.fillStyle = wallG;
    pc.fillRect(0, 0, W, H);

    // 课桌区（米色方格地胶）
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const x = gx + c * cellW, y = gy + r * cellH;
        const light = (r % 2 === 0);
        const g = pc.createLinearGradient(x, y, x, y + cellH);
        if (light) { g.addColorStop(0, c % 2 ? '#e3d4b2' : '#ddd0ac'); g.addColorStop(1, c % 2 ? '#d6c69e' : '#d0c29a'); }
        else { g.addColorStop(0, c % 2 ? '#cfc09a' : '#c9ba92'); g.addColorStop(1, c % 2 ? '#c3b48a' : '#bdae86'); }
        pc.fillStyle = g;
        pc.fillRect(x, y, cellW + 0.6, cellH + 0.6);
      }
    }
    // 地面斑点纹理
    pc.save();
    pc.globalAlpha = 0.08;
    pc.fillStyle = '#6b5a3a';
    for (let i = 0; i < 240; i++) {
      const x = gx + Math.random() * gridW;
      const y = gy + Math.random() * gridH;
      pc.fillRect(x, y, 2, 2);
    }
    pc.restore();

    // 地胶拼缝
    pc.strokeStyle = 'rgba(90,70,40,0.16)';
    pc.lineWidth = 1.5;
    for (let c = 0; c <= cols; c++) {
      pc.beginPath(); pc.moveTo(gx + c * cellW, gy); pc.lineTo(gx + c * cellW, gy + gridH); pc.stroke();
    }
    for (let r = 0; r <= rows; r++) {
      pc.beginPath(); pc.moveTo(gx, gy + r * cellH); pc.lineTo(gx + gridW, gy + r * cellH); pc.stroke();
    }

    // 左侧黑板
    pc.fillStyle = '#8a6a45';
    pc.fillRect(0, gy - 10, 74, gridH + 20);
    const bb = pc.createLinearGradient(0, gy, 74, 0);
    bb.addColorStop(0, '#2e4a3a'); bb.addColorStop(1, '#24402f');
    pc.fillStyle = bb;
    pc.fillRect(6, gy - 4, 60, gridH + 8);
    pc.fillStyle = '#7a5c3c';
    pc.fillRect(6, gy + gridH + 2, 60, 6);
    // 粉笔板书
    pc.fillStyle = 'rgba(240,240,230,.8)';
    pc.textAlign = 'left'; pc.textBaseline = 'middle';
    pc.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
    pc.fillText('期末复习', 14, gy + 26);
    pc.font = '12px "Segoe Print","Comic Sans MS",cursive';
    pc.fillText('a\u00b2+b\u00b2=c\u00b2', 13, gy + 60);
    pc.fillText('x = ?', 14, gy + 96);
    pc.fillText('\u221a2 \u2248 1.41', 13, gy + 132);
    pc.fillText('9\u00d79 = 81', 13, gy + 168);
    pc.fillText('\u03c0 \u2248 3.14', 13, gy + 204);
    pc.fillText('\u2605 \u91cd\u70b9!', 13, gy + 240);
    pc.fillText('\u52a0\u6cb9!', 14, gy + 276);
    pc.strokeStyle = 'rgba(240,240,230,.45)'; pc.lineWidth = 1.5;
    pc.beginPath(); pc.moveTo(12, gy + 40); pc.lineTo(58, gy + 40); pc.stroke();
    pc.beginPath(); pc.moveTo(12, gy + 220); pc.lineTo(58, gy + 220); pc.stroke();

    // 讲台木质过道
    const wood = pc.createLinearGradient(68, 0, gx, 0);
    wood.addColorStop(0, '#a87c4e'); wood.addColorStop(1, '#c09a68');
    pc.fillStyle = wood;
    pc.fillRect(68, gy - 10, gx - 68, gridH + 20);
    pc.strokeStyle = 'rgba(90,60,30,.35)'; pc.lineWidth = 1.5;
    for (let r = 0; r <= rows; r++) {
      const y = gy + r * cellH;
      pc.beginPath(); pc.moveTo(68, y); pc.lineTo(gx, y); pc.stroke();
    }
    pc.globalAlpha = 0.25;
    for (let r = 0; r < rows; r++) {
      for (let k = 0; k < 3; k++) {
        pc.beginPath();
        pc.moveTo(72, gy + r * cellH + 22 + k * 22);
        pc.bezierCurveTo(82, gy + r * cellH + 16 + k * 22, 95, gy + r * cellH + 28 + k * 22, gx - 4, gy + r * cellH + 22 + k * 22);
        pc.stroke();
      }
    }
    pc.globalAlpha = 1;
    pc.fillStyle = 'rgba(0,0,0,.22)';
    pc.fillRect(gx - 4, gy - 10, 4, gridH + 20);

    // 顶部阴影
    const topSh = pc.createLinearGradient(0, gy, 0, gy + 30);
    topSh.addColorStop(0, 'rgba(0,0,0,.14)'); topSh.addColorStop(1, 'rgba(0,0,0,0)');
    pc.fillStyle = topSh; pc.fillRect(gx, gy, gridW, 30);

    // 底部墙脚
    const bot = pc.createLinearGradient(0, gy + gridH, 0, H);
    bot.addColorStop(0, '#b3a37e'); bot.addColorStop(1, '#8a7c5c');
    pc.fillStyle = bot;
    pc.fillRect(0, gy + gridH, W, H - gy - gridH);
    pc.fillStyle = 'rgba(0,0,0,.22)';
    pc.fillRect(0, gy + gridH, W, 5);

    // 右侧教室后门（僵尸出没方向）
    const doorX = gx + gridW;
    const dw = W - doorX;
    pc.fillStyle = '#7a5c3c';
    pc.fillRect(doorX, gy - 10, dw, gridH + 20);
    const dk = pc.createLinearGradient(doorX, 0, W, 0);
    dk.addColorStop(0, '#15151c'); dk.addColorStop(1, '#26262e');
    pc.fillStyle = dk;
    pc.fillRect(doorX + 4, gy - 4, dw - 4, gridH + 8);
    pc.fillStyle = 'rgba(140,180,200,.25)';
    pc.fillRect(doorX + 7, gy + 60, dw - 11, 40);
    pc.strokeStyle = 'rgba(0,0,0,.4)';
    pc.strokeRect(doorX + 7, gy + 60, dw - 11, 40);
    pc.fillStyle = '#2e8b57';
    pc.fillRect(doorX + 2, gy + 20, dw - 4, 18);
    pc.fillStyle = '#eafff0';
    pc.font = 'bold 9px sans-serif';
    pc.textAlign = 'center'; pc.textBaseline = 'middle';
    pc.fillText('出口', doorX + dw / 2, gy + 30);
    pc.fillStyle = 'rgba(0,0,0,.35)';
    pc.fillRect(doorX, gy - 10, 6, gridH + 20);
  }
  function drawBackgroundToCanvas() {
    paintBackground(bgCanvas.getContext('2d'));
  }

  function drawMaggot(m) {
    const wig = m.eating ? Math.sin(m.walkPhase * 2) * 2 : Math.sin(m.walkPhase) * 2.5;
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.ellipse(0, 2, 15, 5, 0, 0, TAU); ctx.fill();
    const bodyG = ctx.createLinearGradient(0, -16, 0, 4);
    bodyG.addColorStop(0, '#f7f0d2'); bodyG.addColorStop(1, '#cdbd88');
    ctx.fillStyle = bodyG;
    ctx.strokeStyle = 'rgba(120,105,60,.55)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(-9, -5 + wig * 0.4, 9, 6.5, -0.15, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, -6 + wig * 0.7, 9.5, 7.5, -0.1, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(9, -8 + wig, 8.5, 7.5, -0.25, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(150,135,90,.45)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(-9, -11 + wig * 0.4); ctx.lineTo(-10, -1 + wig * 0.4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -12.5 + wig * 0.7); ctx.lineTo(-1.5, -1 + wig * 0.7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(9, -14.5 + wig); ctx.lineTo(8, -2 + wig); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(12, -10 + wig, 3.4, 4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2b2b2b';
    ctx.beginPath(); ctx.arc(13, -9.6 + wig, 1.7, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#8a7c4a'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    if (m.eating) ctx.arc(15, -4 + wig, 2.6, 0.2, Math.PI - 0.2);
    else ctx.arc(15, -5 + wig, 2.2, 0.35, Math.PI - 0.35);
    ctx.stroke();
    if (m.flash > 0) {
      ctx.globalAlpha = m.flash * 0.4;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(0, -6, 18, 10, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (m.hp < m.maxHp) {
      ctx.fillStyle = 'rgba(0,0,0,.4)';
      rr(-17, -24, 34, 5, 2.5); ctx.fill();
      ctx.fillStyle = clamp(m.hp / m.maxHp, 0, 1) > 0.4 ? '#8fd14f' : '#e05a4a';
      rr(-17, -24, 34 * clamp(m.hp / m.maxHp, 0, 1), 5, 2.5); ctx.fill();
    }
    ctx.restore();
  }

  /* ---- 超然亡语：倒地不起，脚肿得特别大（馒头！） ---- */
  function drawFlop(f) {
    const fade = clamp((f.until - G.time) / 2.5, 0, 1);
    const k = clamp((G.time - f.born) / 0.45, 0, 1);   // 倒下动画
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(f.x, f.y + 14 + Math.sin(Math.min(k * 3, 1) * Math.PI) * -4 * (1 - k));
    ctx.rotate((k - 1) * 0);           // 保持简洁：直接画躺姿
    // 倒地的身体（侧躺）
    ctx.fillStyle = 'rgba(0,0,0,.15)';
    ctx.beginPath(); ctx.ellipse(-4, 16, 30, 7, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#f6f6ef';                       // 白 T 恤
    ctx.beginPath(); ctx.ellipse(-8, 7, 17, 8.5, 0.08, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(160,160,150,.5)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(-8, 7, 17, 8.5, 0.08, 0, TAU); ctx.stroke();
    // 深蓝短裤
    ctx.fillStyle = '#3a4b8f';
    ctx.beginPath(); ctx.ellipse(7, 9, 8, 7, 0.15, 0, TAU); ctx.fill();
    // 肿得特别大的脚（馒头脚）
    const footX = 22, footY = 10;
    const fg = ctx.createRadialGradient(footX - 4, footY - 4, 3, footX, footY, 22);
    fg.addColorStop(0, '#f2c9a0'); fg.addColorStop(1, '#d99f68');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.ellipse(footX, footY, 20, 13, 0.12, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(160,100,55,.55)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(footX, footY, 20, 13, 0.12, 0, TAU); ctx.stroke();
    // 脚趾缝
    ctx.strokeStyle = 'rgba(150,90,50,.4)'; ctx.lineWidth = 1.4;
    for (let k2 = -1; k2 <= 1; k2++) {
      ctx.beginPath();
      ctx.moveTo(footX + 8 + k2 * 4, footY - 9);
      ctx.quadraticCurveTo(footX + 10 + k2 * 4, footY - 4, footX + 8 + k2 * 4, footY + 1);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,255,255,.3)';
    ctx.beginPath(); ctx.ellipse(footX - 6, footY - 6, 7, 3.6, -0.4, 0, TAU); ctx.fill();
    // 贴地的头（晕了）
    ctx.fillStyle = '#f7d0a6';
    ctx.beginPath(); ctx.arc(-25, 8, 9.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#3a2c22';
    ctx.beginPath(); ctx.ellipse(-25, 3, 9, 5, 0, 0, TAU); ctx.fill();   // 头发
    ctx.strokeStyle = '#4a3428'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-29, 10); ctx.lineTo(-25, 8); ctx.moveTo(-25, 8); ctx.lineTo(-21, 10); ctx.stroke();  // X 眼一条
    ctx.beginPath(); ctx.moveTo(-29, 13); ctx.lineTo(-21, 13); ctx.stroke();  // 眼花线
    ctx.restore();
  }

  function drawStink(st) {
    const remain = st.until - G.time;
    const fade = clamp(remain / 2.5, 0, 1);
    for (const c of st.cells) {
      const x = gx + c.col * cellW, y = gy + c.row * cellH;
      const cx = x + cellW / 2, cy = y + cellH / 2 + 26;
      ctx.save();
      if (st.kind === 'vomit') {
        /* ---- 超然亡语：呕吐物（肠胃炎！） ---- */
        ctx.globalAlpha = 0.85 * fade;
        const vg = ctx.createRadialGradient(cx - 5, cy - 4, 4, cx, cy, 32);
        vg.addColorStop(0, '#b8dd75'); vg.addColorStop(1, '#84ad3f');
        ctx.fillStyle = vg;
        ctx.beginPath();
        ctx.ellipse(cx, cy, 32, 14, 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#6d9331';
        for (let k = 0; k < 5; k++) {
          const a = c.seed * 2 + k * 1.9;
          ctx.beginPath();
          ctx.ellipse(cx + Math.cos(a) * 20, cy + Math.sin(a) * 7, 6 + (k % 2) * 3, 4, a, 0, TAU);
          ctx.fill();
        }
        ctx.fillStyle = 'rgba(225,245,180,.85)';
        ctx.beginPath(); ctx.ellipse(cx - 9 + Math.sin(c.seed) * 5, cy - 4, 8, 4, 0, 0, TAU); ctx.fill();
        // 上冒的气泡
        ctx.strokeStyle = 'rgba(235,255,205,.7)'; ctx.lineWidth = 1.6;
        for (let k = 0; k < 2; k++) {
          const ph = (G.time * 0.8 + c.seed + k * 0.5) % 1;
          ctx.globalAlpha = 0.85 * fade * (1 - ph);
          ctx.beginPath();
          ctx.arc(cx + (k ? 12 : -10) + Math.sin(ph * 6) * 4, cy - 8 - ph * 26, 3.5 - ph * 1.6, 0, TAU);
          ctx.stroke();
        }
        ctx.restore();
        continue;
      }
      ctx.globalAlpha = 0.75 * fade;
      ctx.fillStyle = '#dbca8e';
      ctx.beginPath();
      ctx.ellipse(cx, cy, 36, 15, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#c2a968';
      for (let k = 0; k < 4; k++) {
        const a = c.seed * 2 + k * 1.7;
        ctx.beginPath();
        ctx.ellipse(cx + Math.cos(a) * 26, cy + Math.sin(a) * 8, 8 + (k % 2) * 4, 5, a, 0, TAU);
        ctx.fill();
      }
      ctx.fillStyle = 'rgba(250,244,224,.8)';
      ctx.beginPath(); ctx.ellipse(cx - 8 + Math.sin(c.seed) * 6, cy - 3, 9, 5, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + 10, cy + 2, 7, 4, 0.4, 0, TAU); ctx.fill();
      ctx.globalAlpha = fade * (0.45 + 0.2 * Math.sin(G.time * 2.5 + c.seed * 3));
      ctx.strokeStyle = '#a3ad5a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      for (let k = 0; k < 2; k++) {
        const sx = cx + (k ? 14 : -12) + Math.sin(c.seed) * 4;
        const sway = Math.sin(G.time * 3 + c.seed * 5 + k) * 5;
        ctx.beginPath();
        ctx.moveTo(sx, cy - 12);
        ctx.quadraticCurveTo(sx + sway, cy - 26, sx, cy - 38);
        ctx.quadraticCurveTo(sx - sway, cy - 50, sx + sway * 0.5, cy - 60);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawRusher(m) {
    if (!m.alive) return;
    const run = m.running;
    const ph = m.spin;
    ctx.save();
    ctx.translate(m.x, m.y);
    if (run) ctx.translate(rand(-1.2, 1.2), 0);
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath(); ctx.ellipse(0, 4, 16, 5.5, 0, 0, TAU); ctx.fill();

    const idleBob = run ? 0 : Math.sin(G.time * 2.2) * 1.2;
    ctx.translate(0, idleBob);
    const sw = run ? Math.sin(ph) * 9 : 0;

    // 腿
    ctx.strokeStyle = '#2f3d66'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-3, -20);
    ctx.lineTo(-3 + sw * 0.7, -3 - Math.max(0, Math.sin(ph)) * 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(3, -20);
    ctx.lineTo(3 - sw * 0.7, -3 - Math.max(0, -Math.sin(ph)) * 6); ctx.stroke();
    ctx.fillStyle = '#f2f2f2';
    ctx.beginPath(); ctx.ellipse(-3 + sw * 0.7, -2, 6.5, 3.4, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(3 - sw * 0.7, -2, 6.5, 3.4, 0, 0, TAU); ctx.fill();

    // 书包
    ctx.fillStyle = '#e04a3f';
    rr(-19, -34, 9, 16, 3); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.15)';
    rr(-19, -28, 9, 3, 1.5); ctx.fill();

    // 身体（白校服）
    const bg = ctx.createLinearGradient(0, -36, 0, -18);
    bg.addColorStop(0, '#ffffff'); bg.addColorStop(1, '#d5dfe9');
    ctx.fillStyle = bg;
    rr(-10, -36, 19, 18, 6); ctx.fill();
    ctx.fillStyle = '#d8382f';
    ctx.beginPath();
    ctx.moveTo(4, -36); ctx.lineTo(9, -30); ctx.lineTo(4, -26);
    ctx.closePath(); ctx.fill();

    // 手臂
    ctx.strokeStyle = '#f0c8a0'; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-6, -32); ctx.lineTo(-13 - sw * 0.5, -24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(5, -32); ctx.lineTo(14 + sw * 0.5, -27); ctx.stroke();

    // 饭盒
    const bx = 14 + sw * 0.5;
    ctx.fillStyle = '#d86a4a';
    rr(bx - 2, -30, 13, 9, 3); ctx.fill();
    ctx.fillStyle = '#f7e3b0';
    rr(bx - 1, -29.4, 11, 4, 2); ctx.fill();
    if (run) {
      ctx.globalAlpha = 0.35 + Math.sin(G.time * 8) * 0.15;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(bx + 4, -34, 3.5, 5, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }

    // 头
    ctx.fillStyle = '#f0c8a0';
    ctx.beginPath(); ctx.arc(1, -44, 10, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2b2520';
    ctx.beginPath();
    ctx.moveTo(-9, -46);
    ctx.quadraticCurveTo(-8, -55, 2, -54.5);
    ctx.quadraticCurveTo(11, -54, 11, -45);
    ctx.quadraticCurveTo(5, -50, -2, -49);
    ctx.quadraticCurveTo(-7, -48, -9, -46);
    ctx.fill();
    ctx.strokeStyle = '#2b2520'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(1, -54); ctx.lineTo(4, -58); ctx.stroke();
    ctx.fillStyle = '#2b2520';
    ctx.beginPath(); ctx.arc(4, -44, 1.6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(9, -44, 1.6, 0, TAU); ctx.fill();
    ctx.fillStyle = '#a05a48';
    ctx.beginPath(); ctx.ellipse(7, -39, 3, 2.4, 0, 0, TAU); ctx.fill();

    // 跑动尘土
    if (run && Math.random() < 0.5) {
      G.parts.push({
        x: m.x - 14, y: m.y - 2,
        vx: rand(-50, -16), vy: rand(-24, -4),
        life: rand(0.25, 0.5), max: 0.5,
        color: 'rgba(190,175,150,.7)', size: rand(2.5, 5), grav: -20
      });
    }
    ctx.restore();
  }

  function drawInkDrop(s) {

  /* ---- 占课子弹：红色印章状，飞向左侧 ---- */
  function drawCkb(b) {

  function drawBullet(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    if (p.btype === 'wind') {
      const sp = p.trail || 0;
      ctx.globalAlpha = 0.85;
      const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 12);
      g.addColorStop(0, 'rgba(235,250,255,.9)');
      g.addColorStop(1, 'rgba(160,215,245,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#eaf7ff';
      ctx.lineWidth = 2; ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        const a = sp * 9 + i * TAU / 3;
        ctx.beginPath();
        ctx.arc(0, 0, 7 + i, a, a + 1.6);
        ctx.stroke();
      }
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(2, -2, 1.6, 0, TAU); ctx.fill();
    } else if (p.btype === 'ink') {
      ctx.fillStyle = '#22222c';
      rr(-10, -6, 14, 12, 4); ctx.fill();
      ctx.fillStyle = '#0c0c12';
      ctx.beginPath();
      ctx.moveTo(4, -6); ctx.lineTo(13, 0); ctx.lineTo(4, 6);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(150,170,255,.4)';
      ctx.beginPath(); ctx.ellipse(-5, -2.5, 4, 1.6, 0, 0, TAU); ctx.fill();
    } else if (p.btype === 'staple') {
      // 订书钉
      ctx.strokeStyle = '#d7dee8'; ctx.lineWidth = 3.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(10, -7); ctx.lineTo(-7, -7); ctx.lineTo(-7, 7); ctx.lineTo(10, 7);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(120,140,170,.55)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-5, -7); ctx.lineTo(-5, 7); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.beginPath(); ctx.arc(9, -7, 1.8, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(9, 7, 1.8, 0, TAU); ctx.fill();
    } else {
      ctx.fillStyle = '#ecd0a4';
      ctx.beginPath();
      ctx.moveTo(-9, -6); ctx.lineTo(6, -3.4); ctx.lineTo(6, 3.4); ctx.lineTo(-9, 6);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(150,110,50,.35)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-6, -3.4); ctx.lineTo(4, -1.6); ctx.stroke();
      ctx.fillStyle = '#2b2b33';
      ctx.beginPath();
      ctx.moveTo(6, -3.4); ctx.lineTo(13, 0); ctx.lineTo(6, 3.4);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.4)';
      ctx.beginPath(); ctx.ellipse(-6, -2.4, 2.4, 1.2, 0, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function roundBox(x, y, w, h, r, fill, stroke) {
    rr(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
  }

  function drawCard(key, i) {
    const def = PLANT_DEFS[key];
    const r = cardRect(i);
    const cdLeft = Math.max(0, (G.cd[key] || 0) - G.time);
    const cdFrac = cdLeft / def.cd;
    const afford = G.sun >= def.cost;
    const usable = afford && cdFrac <= 0;
    const sel = G.selected === key;

    ctx.save();
    // 底
    const bg = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
    bg.addColorStop(0, '#f6e6bd'); bg.addColorStop(1, '#d9bd85');
    roundBox(r.x, r.y, r.w, r.h, 10, bg, 'rgba(90,60,20,.55)');
    // 内框
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.5;
    rr(r.x + 3, r.y + 3, r.w - 6, r.h - 6, 8); ctx.stroke();

    // 迷你植物
    ctx.save();
    ctx.beginPath(); rr(r.x + 4, r.y + 4, r.w - 8, r.h - 30, 8); ctx.clip();
    ctx.translate(r.x + r.w / 2, r.y + r.h - 40);
    ctx.scale(0.66, 0.66);
    const fake = { hp: 1, maxHp: 1, recoil: 0, timer: 1.1, anim: 0 };
    drawPlantBody(key, G.time * 0.8, Math.sin(G.time * 2) * 1.5, fake);
    ctx.restore();

    // 墨水花费
    ctx.fillStyle = 'rgba(40,25,10,.9)';
    ctx.font = 'bold 17px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(def.cost, r.x + r.w / 2, r.y + r.h - 13);

    // 冷却遮罩
    if (cdFrac > 0) {
      ctx.save();
      ctx.beginPath(); rr(r.x, r.y, r.w, r.h, 10); ctx.clip();
      ctx.fillStyle = 'rgba(15,25,35,.62)';
      ctx.fillRect(r.x, r.y, r.w, r.h * cdFrac);
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(Math.ceil(cdLeft), r.x + r.w / 2, r.y + r.h / 2);
      ctx.restore();
    } else if (!afford) {
      ctx.save();
      ctx.beginPath(); rr(r.x, r.y, r.w, r.h, 10); ctx.clip();
      ctx.fillStyle = 'rgba(20,30,45,.45)';
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.restore();
    }

    // 选中框
    if (sel) {
      ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 3.5;
      ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 14;
      rr(r.x - 1, r.y - 1, r.w + 2, r.h + 2, 11); ctx.stroke();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

  function drawTopBarInfo() {
    const rx = CARD_X0 + G.availPlants.length * (CARD_W + CARD_GAP) + 74;
    const rw = W - rx - 16;
    ctx.save();
    ctx.fillStyle = 'rgba(10,25,16,.55)';
    rr(rx, 14, rw, 92, 10); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1.2;
    rr(rx, 14, rw, 92, 10); ctx.stroke();

    const cur = Math.min(G.waveIndex, G.waves.length);
    ctx.fillStyle = '#e8f5d8';
    ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (G.sandbox) {
      ctx.fillText('纸上谈兵 · 沙盒模式', rx + rw / 2, 34);
    } else if (G.tutorial && !G.tutorial.done) {
      ctx.fillText('第 ' + G.level + ' 关 · 新手教学', rx + rw / 2, 34);
    } else {
      ctx.fillText('第 ' + G.level + ' 关 · ' + (cur >= G.waves.length ? '撑住！最后一波' : ('第 ' + Math.max(1, cur) + ' / ' + G.waves.length + ' 波')), rx + rw / 2, 34);
    }

    // 进度条
    const bx = rx + 14, bw = rw - 28, by = 46, bh = 9;
    roundBox(bx, by, bw, bh, 4.5, 'rgba(0,0,0,.45)');
    const frac = G.waves.length ? clamp(G.waveIndex / G.waves.length, 0, 1) : 0;
    if (frac > 0) {
      const pg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
      pg.addColorStop(0, '#8fd14f'); pg.addColorStop(1, '#e33b3b');
      roundBox(bx, by, Math.max(4, bw * frac), bh, 4.5, pg);
    }
    // 波次刻度
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    for (let i = 1; i < G.waves.length; i++) {
      const px = bx + bw * (i / G.waves.length);
      ctx.fillRect(px, by - 1, 1, bh + 2);
    }
    if (G.waves.length === 0 && !G.sandbox) {
      ctx.fillStyle = 'rgba(255,224,102,.7)';
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('教 学 中', bx + bw / 2, by + bh / 2 + 1);
    }

    // 按钮组：静音 / 全神贯注 / 走神一下
    const btn = (r, label, active, icon) => {
      const g2 = ctx.createLinearGradient(0, r.y, 0, r.y + r.h);
      if (active) { g2.addColorStop(0, '#ffd45e'); g2.addColorStop(1, '#d99a1c'); }
      else { g2.addColorStop(0, '#2c3a28'); g2.addColorStop(1, '#1a241a'); }
      roundBox(r.x, r.y, r.w, r.h, 9, g2, active ? 'rgba(255,235,150,.9)' : 'rgba(255,255,255,.22)');
      ctx.fillStyle = active ? '#2a1e00' : '#dceccd';
      ctx.font = 'bold 12px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(icon ? icon : label, r.x + r.w / 2, r.y + r.h / 2 + 1);
    };

    btn(muteRect(), '', false, muted ? '🔇' : '🔊');
    btn(speedRect(), G.speed > 1 ? '全神贯注 ×2' : '全神贯注', G.speed > 1);
    btn(focusRect(), '走神一下', false);

    // 底部工具条：跳波 / 作弊
    const bbtn = (r, label, color) => {
      const g3 = ctx.createLinearGradient(0, r.y, 0, r.y + r.h);
      g3.addColorStop(0, color[0]); g3.addColorStop(1, color[1]);
      roundBox(r.x, r.y, r.w, r.h, 9, g3, 'rgba(255,255,255,.3)');
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + 1);
    };

      const skipReady = G.waveIndex < G.waves.length;

  function drawHoverGhost() {
    if (!G.selected && !G.shovel) return;
    if (!G.hover) return;
    const { col, row } = G.hover;
    const idx = row * cols + col;
    const x = gx + col * cellW, y = gy + row * cellH;

    if (G.shovel) {
      const p = G.grid[idx];
      if (p) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255,90,70,.9)'; ctx.lineWidth = 3;
        ctx.setLineDash([8, 6]);
        rr(x + 4, y + 4, cellW - 8, cellH - 8, 8); ctx.stroke();
        ctx.restore();
      }
      return;
    }
    const def = PLANT_DEFS[G.selected];
    const ok = !G.grid[idx] && G.sun >= def.cost && (G.cd[G.selected] || 0) <= G.time;
    ctx.save();
    if (ok) {
      ctx.fillStyle = 'rgba(255,255,255,.18)';
      rr(x + 3, y + 3, cellW - 6, cellH - 6, 10); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.65)'; ctx.lineWidth = 2;

      ctx.fillStyle = 'rgba(220,60,50,.16)';

  function drawBanner() {
    if (!G.banner) return;
    const b = G.banner;
    const life = b.t;
    let a = 1;
    if (life > 2.2) a = clamp((2.8 - life) / 0.6, 0, 1);
    if (life < 0.5) a = clamp(life / 0.5, 0, 1);
    const pop = life > 2.2 ? clamp((2.8 - life) / 0.6, 0, 1) : 1;
    const scale = 0.8 + pop * 0.2;

    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(W / 2, b.boss ? 236 : 250);
    if (b.boss) {
      const k = 1 + Math.sin(G.time * 6) * 0.02;
      ctx.scale(scale * k, scale * k);
    } else ctx.scale(scale, scale);
    // 背板
    const tw = b.boss ? 720 : 520;
    const g = ctx.createLinearGradient(-tw / 2, 0, tw / 2, 0);

  /* ---- 选关界面：关卡预览面板（可选文具 + 出没作业，跟随鼠标） ---- */
  function drawLevelPreview(lv, mx, my) {
    const cfg = levelCfg(lv);
    const pw = 520;
    let px0 = clamp(mx - pw / 2, 12, W - pw - 12);
    let py0 = my + 22;
    const eh = 70;
    const plants = cfg.plants ? cfg.plants.slice() : (lv >= 5 ? CARD_ORDER : BASE_POOL).slice();
    const pRows = Math.ceil(plants.length / 5);
    const types = [];
    buildWaveTable(lv).forEach(w => w.list.forEach(t => {
      if (types.indexOf(t) < 0) types.push(t);
    }));
    const ph = 82 + pRows * 88 + 22 + eh + 18;
    if (py0 + ph > H - 12) py0 = Math.max(56, my - ph - 22);

    ctx.save();
    const g = ctx.createLinearGradient(0, py0, 0, py0 + ph);
    g.addColorStop(0, 'rgba(30,46,66,.97)'); g.addColorStop(1, 'rgba(16,26,40,.97)');
    roundBox(px0, py0, pw, ph, 14, g, 'rgba(150,190,240,.5)');
    roundBox(px0 + 6, py0 + 6, pw - 12, ph - 12, 11, null, 'rgba(255,255,255,.08)');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    ctx.fillStyle = '#ffe9a8';
    ctx.font = 'bold 21px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('第 ' + lv + ' 关 · 关卡预览', W / 2, py0 + 24);
    ctx.font = '12px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(200,220,240,.75)';
    ctx.fillText(levelDesc(lv), W / 2, py0 + 46);

    // —— 本关文具 ——
    const gw = 88, gh = 78, ggap = 8;
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(150,220,140,.95)';
    ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(cfg.pick ? '本关文具（开局选 ' + PICK_LIMIT + ' 种）' : '本关全部文具', px0 + 28, py0 + 68);
    plants.forEach((k, i) => {
      const row = Math.floor(i / 5), col = i % 5;
      const nRow = Math.min(5, plants.length - row * 5);
      const x0 = px0 + (pw - nRow * gw - (nRow - 1) * ggap) / 2 + col * (gw + ggap);
      const y0 = py0 + 80 + row * (gh + 10);
      roundBox(x0, y0, gw, gh, 9, 'rgba(56,80,54,.88)', 'rgba(255,255,255,.25)');
      ctx.save();
      ctx.translate(x0 + gw / 2, y0 + gh / 2 - 5);
      ctx.scale(0.6, 0.6);
      drawPlantBody(k, G.time, 0, { hp: 1, maxHp: 1, recoil: 0, timer: 1.1, anim: i * 1.3 });
      ctx.restore();
      ctx.fillStyle = '#ffeecb';
      ctx.font = 'bold 12px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(PLANT_DEFS[k].name, x0 + gw / 2, y0 + gh - 11);
    });

    // —— 出没作业 ——
    const enemyY = py0 + 80 + pRows * (gh + 10) + 16;
    ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px0 + 28, enemyY - 16); ctx.lineTo(px0 + pw - 28, enemyY - 16); ctx.stroke();
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(244,150,138,.95)';
    ctx.font = 'bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('出没作业（' + types.length + ' 种）', px0 + 28, enemyY - 2);
    const ew = 74, egap = 8;
    const nE = Math.min(6, types.length);
    const ex0 = px0 + (pw - nE * ew - (nE - 1) * egap) / 2;
    types.forEach((t, i) => {
      const x0 = ex0 + i * (ew + egap), y0 = enemyY + 8;
      roundBox(x0, y0, ew, eh, 9, 'rgba(86,52,48,.85)', 'rgba(255,255,255,.22)');
      const cxx = x0 + ew / 2;
      if (t === 'boss') {
        const top = -(2 * cellH + 96), bot = 2 * cellH - 10;
        const bh = bot - top;
        // 巨型 BOSS 适配小格子：高度压入格内、宽度适当拉伸以免过瘦
        ctx.save();
        ctx.translate(cxx, y0 + eh / 2 - 2);
        ctx.scale(36 / 112, 58 / bh);
        ctx.translate(0, -(top + bot) / 2);
        drawBoss({ type: 'boss', x: 0, y: 0, walkPhase: G.time * 1.6, dying: false, dieT: 0, flash: 0, fireTimer: 7, enterT: 0, row: 2 });
        ctx.restore();
      } else {
        const def = ZOMBIE_DEFS[t];
        ctx.save();
        ctx.translate(cxx, y0 + eh / 2 + 2);

          walkPhase: G.time * 3, eating: false, slowUntil: 0, flash: 0, onStink: false

      const zinfo = CODEX_ZOMBIES.find(e => e.type === t);

      ctx.font = 'bold 11px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(zinfo ? zinfo.name : t, cxx, y0 + eh - 9);
    });
    ctx.restore();
  }

    ctx.fillText((G.sandbox ? '纸上谈兵 · ' : ('第 ' + G.level + ' 关 · ')) + '从 ' + (G.pickPool ? G.pickPool.length : CARD_ORDER.length) + ' 种文具中挑 ' + PICK_LIMIT + ' 种带进课堂（已选 ' + G.pickSel.length + ' / ' + PICK_LIMIT + '）',
      W / 2, 140);

    // 卡片
    const rects = pickCardRects();
    rects.forEach((r, i) => {
      const order = G.pickSel.indexOf(r.key);
      const on = order >= 0;
      const def = PLANT_DEFS[r.key];
      ctx.save();
      // 底板
      const pad = ctx.createLinearGradient(0, r.cy - r.h / 2, 0, r.cy + r.h / 2);
      if (on) { pad.addColorStop(0, '#8ede4f'); pad.addColorStop(1, '#3f8a2c'); }
      else { pad.addColorStop(0, 'rgba(38,52,40,.95)'); pad.addColorStop(1, 'rgba(22,32,24,.95)'); }
      ctx.shadowColor = on ? 'rgba(140,230,90,.5)' : 'rgba(0,0,0,.3)';
      ctx.shadowBlur = on ? 14 : 5;
      roundBox(r.cx - r.w / 2, r.cy - r.h / 2, r.w, r.h, 14, pad, on ? 'rgba(255,255,255,.7)' : 'rgba(160,190,160,.28)');
      ctx.shadowBlur = 0;

      // 立绘
      ctx.save();
      ctx.beginPath();
      rr(r.cx - r.w / 2 + 6, r.cy - r.h / 2 + 6, 86, r.h - 12, 10);
      ctx.clip();
      ctx.translate(r.cx - r.w / 2 + 49, r.cy + 30);
      ctx.scale(0.6, 0.6);
      drawPlantBody(r.key, G.time * 0.8, Math.sin(G.time * 2 + i) * 1.5,
        { hp: 1, maxHp: 1, recoil: 0, timer: 1.1, anim: i });
      ctx.restore();

      // 文本
      const tx = r.cx - r.w / 2 + 102;
      ctx.textAlign = 'left';
      ctx.fillStyle = on ? '#0e2a12' : '#eaf5dc';
      ctx.font = 'bold 19px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(def.name, tx, r.cy - 27);
      ctx.fillStyle = on ? 'rgba(14,42,18,.82)' : 'rgba(210,228,200,.8)';
      ctx.font = '12px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(CODEX_PLANTS.find(e => e.key === r.key).desc, tx, r.cy - 3);
      ctx.fillStyle = on ? 'rgba(20,50,20,.95)' : 'rgba(190,215,185,.75)';
      ctx.font = 'bold 11px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText('墨水 ' + def.cost + ' · 冷却 ' + def.cd + 's · 血量 ' + def.hp, tx, r.cy + 19);

      // 选中标记
      const bx = r.cx + r.w / 2 - 20, by = r.cy - r.h / 2 + 20;
      if (on) {
        ctx.fillStyle = '#ffe066';
        ctx.beginPath(); ctx.arc(bx, by, 13, 0, TAU); ctx.fill();
        ctx.fillStyle = '#2a1e00';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(String(order + 1), bx, by + 1);
      } else {
        ctx.strokeStyle = 'rgba(200,225,200,.35)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(bx, by, 12, 0, TAU); ctx.stroke();
      }
      ctx.restore();
    });

    // 按钮：开始上课 / 返回
    const ready = G.pickSel.length === PICK_LIMIT;
    const drawBtn = (r, label, colors, dim) => {
      ctx.save();
      ctx.translate(r.x + r.w / 2, r.y + r.h / 2);
      if (dim) ctx.globalAlpha = 0.45;
      const bg2 = ctx.createLinearGradient(0, -r.h / 2, 0, r.h / 2);
      bg2.addColorStop(0, colors[0]); bg2.addColorStop(1, colors[1]);
      roundBox(-r.w / 2, -r.h / 2, r.w, r.h, 22, bg2, 'rgba(255,255,255,.45)');
      ctx.fillStyle = colors[2];
      ctx.font = 'bold 24px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(label, 0, 1);
      ctx.restore();
    };
    drawBtn(PICK_BTNS.start, ready ? '开 始 上 课' : '还差 ' + (PICK_LIMIT - G.pickSel.length) + ' 张', ['#8ede4f', '#3f8a2c', '#0e2a12'], !ready);
    drawBtn(PICK_BTNS.back, '返 回', ['#6a7266', '#3d443c', '#eef2ea'], false);

    if (G.pickWarn > 0) {
      ctx.globalAlpha = clamp(G.pickWarn, 0, 1);
      ctx.fillStyle = '#ff9b7a';
      ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText('最多只能带 ' + PICK_LIMIT + ' 种文具，先取消一张再选', W / 2, 176);
    }
    ctx.restore();
  }

  function codexGridRects(tab) {
    if (tab === 'plants') {
      const n = CODEX_PLANTS.length, per = 5, w = 186, h = 132, gap = 12;
      const rects = [];
      for (let r = 0; r * per < n; r++) {
        const items = CODEX_PLANTS.slice(r * per, r * per + per);
        const totalW = items.length * w + (items.length - 1) * gap;
        const x0 = W / 2 - totalW / 2 + w / 2;
        items.forEach((e, j) => {
          rects.push({ cx: x0 + j * (w + gap), cy: 236 + r * 148, w, h });
        });
      }
      return rects;
    }
    // 作业卡：3 列 × 2 行，卡片加宽避免文字溢出
    const per = 3, zw = 240, zh = 206, zgap = 14;
    const rects = [];
    for (let r = 0; r * per < CODEX_ZOMBIES.length; r++) {
      const items = CODEX_ZOMBIES.slice(r * per, r * per + per);
      const totalW = items.length * zw + (items.length - 1) * zgap;
      const x0 = W / 2 - totalW / 2 + zw / 2;
      items.forEach((e, j) => {
        rects.push({ cx: x0 + j * (zw + zgap), cy: 268 + r * 224, w: zw, h: zh });
      });
    }
    return rects;
  }

  function wrapCodexText(text, x, y, maxW, lineH) {
    let line = '', yy = y;
    for (const ch of text.split('')) {
      if (ctx.measureText(line + ch).width > maxW) {
        ctx.fillText(line, x, yy);
        line = ch; yy += lineH;
      } else line += ch;
    }
    if (line) ctx.fillText(line, x, yy);
    return yy;
  }

  function drawCodexSprite(e, cx, cy, big) {
    ctx.save();
    if (e.key) {
      const sc = big ? 1.5 : 1.0;
      ctx.translate(cx, cy - 22);
      ctx.scale(sc, sc);
      drawPlantBody(e.key, G.time, Math.sin(G.time * 2) * 2,
        { hp: 1, maxHp: 1, recoil: 0, timer: 1.1, anim: cx % 7 });
    } else if (e.type === 'boss') {
      // BOSS 立绘巨大，按卡片空间整体缩放
      const top = -(2 * cellH + 96), bot = 2 * cellH - 10;
      const bh = bot - top;
      const sc = (big ? 330 : 148) / bh;
      const cy0 = big ? cy - 14 : cy - 16;
      ctx.translate(cx, cy0);
      ctx.scale(sc, sc);
      ctx.translate(0, -(top + bot) / 2);
      drawBoss({
        type: 'boss', x: 0, y: 0, walkPhase: G.time * 1.6,
        dying: false, dieT: 0, flash: 0, fireTimer: 7, enterT: 0, row: 2
      });
    } else {
      const sc = big ? 1.15 : 0.8;
      const py = big ? cy + 56 : cy + 46;
      ctx.translate(cx * (1 - sc), py * (1 - sc));
      ctx.scale(sc, sc);
      const def = ZOMBIE_DEFS[e.type];
      drawZombie({
        type: e.type, x: cx, y: py,
        hp: def.hp, armor: def.armor, armorMax: Math.max(def.armor, 1),
        walkPhase: G.time * 4, eating: false, slowUntil: 0, flash: 0, onStink: false
      });
    }
    ctx.restore();
  }

  function drawCodexDetail(sel) {
    const e = G.codexTab === 'plants' ? CODEX_PLANTS[sel] : CODEX_ZOMBIES[sel];
    const isPlants = G.codexTab === 'plants';

    // 半透明遮罩 + 详情面板
    ctx.fillStyle = 'rgba(4,10,18,.72)';
    ctx.fillRect(0, 0, W, H);
    const pw = 780, ph = 460, px0 = W / 2 - pw / 2, py0 = 108;
    const g = ctx.createLinearGradient(0, py0, 0, py0 + ph);
    g.addColorStop(0, 'rgba(32,50,72,.97)'); g.addColorStop(1, 'rgba(18,28,44,.97)');
    roundBox(px0, py0, pw, ph, 16, g, 'rgba(150,190,240,.45)');
    roundBox(px0 + 8, py0 + 8, pw - 16, ph - 16, 12, null, 'rgba(255,255,255,.08)');

    // 左侧大立绘
    drawCodexSprite(e, px0 + 185, py0 + 235, true);

    // 右侧信息
    const tx = px0 + 350;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffeecb';
    ctx.font = 'bold 32px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(e.name, tx, py0 + 62);
    ctx.strokeStyle = 'rgba(255,238,203,.4)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(tx, py0 + 88); ctx.lineTo(px0 + pw - 30, py0 + 88); ctx.stroke();

    ctx.font = '17px "PingFang SC","Microsoft YaHei",sans-serif';
    let ay = py0 + 118;
    const row = (label, val) => {
      ctx.fillStyle = 'rgba(150,190,235,.95)';
      ctx.font = 'bold 16px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(label, tx, ay);
      ctx.fillStyle = '#e8f0fa';
      ctx.font = '16px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(val, tx + 92, ay);
      ay += 30;
    };
    if (isPlants) {
      const d = PLANT_DEFS[e.key];
      row('费 用', d.cost + ' 墨水');
      row('冷 却', d.cd + ' 秒');
      row('血 量', String(d.hp));
      row('特 长', e.desc);
    } else if (e.type === 'boss') {
      const d = ZOMBIE_DEFS.boss;
      row('血 量', '普通作业 × 20（基础 ' + d.hp + '）');
      row('位 置', '最右侧 · 贯穿全部五行');
      row('技 能', '每 7 秒「占课」一发子弹');
      row('特 长', e.desc);
    } else {
      const d = ZOMBIE_DEFS[e.type];
      row('血 量', String(d.hp));
      row('护 甲', String(d.armor));
      row('速 度', d.speed + ' px/s');
      row('啃 食', d.dps + ' 伤害/秒');
    }

    // 简介
    ctx.fillStyle = 'rgba(255,238,203,.75)';
    ctx.font = 'bold 16px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('—— 简 介 ——', tx, ay + 12);
    ctx.fillStyle = 'rgba(225,235,250,.9)';
    ctx.font = '15px "PingFang SC","Microsoft YaHei",sans-serif';
    wrapCodexText(e.intro, tx, ay + 42, pw - 380 - 30, 26);
    ctx.textAlign = 'center';
  }

  function drawCodex() {
    ctx.save();
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(8,18,28,.94)'); g.addColorStop(1, 'rgba(8,18,28,.97)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffe9a8';
    ctx.font = 'bold 44px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('图  鉴', W / 2, 52);

    // 标签页
    [['plants', '文 具'], ['zombies', '作 业']].forEach(([key, label]) => {
      const r = CODEX_TABS[key];
      const active = G.codexTab === key;
      const tg = ctx.createLinearGradient(0, r.y, 0, r.y + r.h);
      if (active) { tg.addColorStop(0, '#5b8fd6'); tg.addColorStop(1, '#2c5a9e'); }
      else { tg.addColorStop(0, 'rgba(60,80,110,.6)'); tg.addColorStop(1, 'rgba(36,50,72,.6)'); }
      roundBox(r.x, r.y, r.w, r.h, 20, tg, active ? 'rgba(255,255,255,.5)' : 'rgba(255,255,255,.2)');
      ctx.fillStyle = active ? '#fff' : 'rgba(200,220,240,.7)';
      ctx.font = 'bold 20px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + 1);
    });

    if (G.codexSel != null) {
      drawCodexDetail(G.codexSel);
    } else {
      // 提示
      ctx.fillStyle = 'rgba(200,220,240,.5)';
      ctx.font = '14px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText('点击单位卡片查看属性与简介', W / 2, 158);

      // 卡片列表
      const isPlants = G.codexTab === 'plants';
      const list = isPlants ? CODEX_PLANTS : CODEX_ZOMBIES;
      const rects = codexGridRects(G.codexTab);
      list.forEach((e, idx) => {
        const { cx, cy, w, h } = rects[idx];
        const cg = ctx.createLinearGradient(0, cy - h / 2, 0, cy + h / 2);
        cg.addColorStop(0, 'rgba(30,46,66,.92)'); cg.addColorStop(1, 'rgba(18,28,42,.92)');
        roundBox(cx - w / 2, cy - h / 2, w, h, 12, cg, 'rgba(140,180,230,.3)');
        drawCodexSprite(e, cx, cy, false);
        ctx.fillStyle = '#ffeecb';
        ctx.font = 'bold 18px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillText(e.name, cx, cy + h / 2 - 56);
        ctx.fillStyle = 'rgba(210,225,245,.85)';
        ctx.font = '12px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillText(e.desc, cx, cy + h / 2 - 34);
        let stat = '';
        if (isPlants) {
          const d = PLANT_DEFS[e.key];
          stat = '费 ' + d.cost + ' · 冷却 ' + d.cd + 's · 血 ' + d.hp;
        } else {
          const d = ZOMBIE_DEFS[e.type];
          stat = '血量 ' + d.hp + ' · 护甲 ' + d.armor + ' · 速度 ' + d.speed;
        }
        ctx.fillStyle = 'rgba(150,190,235,.9)';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(stat, cx, cy + h / 2 - 14);
      });
    }

    // 返回按钮
    const r = CODEX_BACK;
    const bg = ctx.createLinearGradient(0, r.y, 0, r.y + r.h);
    bg.addColorStop(0, '#6a7585'); bg.addColorStop(1, '#3c4553');
    roundBox(r.x, r.y, r.w, r.h, 23, bg, 'rgba(255,255,255,.4)');
    ctx.fillStyle = '#f0f4fa';
    ctx.font = 'bold 22px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText(G.codexSel != null ? '返 回 列 表' : '返 回 主 菜 单', W / 2, r.y + r.h / 2 + 1);
    ctx.restore();
  }

  function drawOverlayEnd() {
    const win = G.mode === 'win';
    ctx.save();
    ctx.fillStyle = win ? 'rgba(8,26,14,.84)' : 'rgba(26,4,4,.86)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    const a = clamp(G.endTimer / 0.6, 0, 1);
    ctx.globalAlpha = a;
    ctx.save();
    ctx.translate(W / 2, win ? H / 2 - 54 : H / 2 - 46);
    const sc = 0.86 + a * 0.14;
    ctx.scale(sc, sc);
    if (win) {
      // 巨大白字
      ctx.font = 'bold 116px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.lineWidth = 16; ctx.strokeStyle = 'rgba(0,0,0,.62)';
      ctx.strokeText('下课咯！', 0, 0);
      ctx.shadowColor = 'rgba(190,255,150,.55)'; ctx.shadowBlur = 34;
      ctx.fillStyle = '#ffffff';
      ctx.fillText('下课咯！', 0, 0);
      ctx.shadowBlur = 0;
    } else {
      // 巨大红字
      ctx.font = 'bold 200px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.lineWidth = 18; ctx.strokeStyle = 'rgba(70,0,0,.8)';
      ctx.strokeText('逊', 0, 0);
      ctx.shadowColor = 'rgba(255,50,30,.6)'; ctx.shadowBlur = 34;
      ctx.fillStyle = '#ff2f1e';
      ctx.fillText('逊', 0, 0);
      ctx.shadowBlur = 0;
    }
    ctx.restore();

    ctx.globalAlpha = a;
    ctx.font = 'bold 22px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = win ? 'rgba(255,255,255,.9)' : 'rgba(255,220,215,.9)';
    ctx.fillText('撑过波次 ' + Math.min(G.waveIndex, G.waves.length) + ' / ' + G.waves.length,
      W / 2, win ? H / 2 + 68 : H / 2 + 112);

    if (G.endTimer > 0.9) {
      const pulse = 0.6 + Math.sin(G.time * 4) * 0.35;
      ctx.globalAlpha = pulse;
      ctx.font = 'bold 24px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillStyle = '#ffe066';
      ctx.fillText(win ? ('点击任意位置 进入第 ' + (G.level + 1) + ' 关') : '点击任意位置 重试本关', W / 2, win ? H / 2 + 130 : H / 2 + 176);
    }
    ctx.restore();
  }

  function drawPauseOverlay() {

    ctx.fillStyle = 'rgba(5,15,10,.72)';
    ctx.fillRect(0, 0, W, H);

    ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(0,0,0,.6)';
    ctx.strokeText('走 神 一 下', W / 2, H / 2 - 92);
    ctx.fillStyle = '#eaffb0';
    ctx.fillText('走 神 一 下', W / 2, H / 2 - 92);

    ctx.font = '18px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.72)';

    ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillStyle = 'rgba(200,215,195,.5)';
    ctx.fillText('逃课会直接离开本关，进度不保留', W / 2, H / 2 + 140);
    ctx.restore();
  }

  /* ============================================================
     主绘制
  ============================================================ */
  function render() {
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    if (G.shake > 0.4) {
      ctx.translate(rand(-G.shake, G.shake) * 0.6, rand(-G.shake, G.shake) * 0.6);
    }
    ctx.drawImage(bgCanvas, 0, 0, W, H);

    // 小推车
    G.mowers.forEach(drawRusher);
    G.stinks.forEach(drawStink);
    G.flops.forEach(drawFlop);

    // 植物
    const plants = G.plants.slice().sort((a, b) => a.row - b.row);
    plants.forEach(p => drawPlant(p));

    // 僵尸
    const zs = G.zombies.slice().sort((a, b) => (a.row - b.row) || (b.x - a.x));
    zs.forEach(drawZombie);

    // 豌豆
    G.maggots.forEach(drawMaggot);
    G.peas.forEach(drawBullet);
    G.ckbs.forEach(drawCkb);

    // 阳光
    G.suns.forEach(drawInkDrop);

    // 冲击波
    G.rings.forEach(r => {
      const f = 1 - r.life / r.max;
      ctx.save();
      ctx.globalAlpha = (1 - f) * 0.85;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = 10 * (1 - f) + 2;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * f, 0, TAU);
      ctx.stroke();
      ctx.restore();
    });

    // 浮动小字（占课！）
    G.floats.forEach(f => {
      const k = clamp(f.life / f.max, 0, 1);
      ctx.save();
      ctx.globalAlpha = Math.min(1, k * 1.6);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold 22px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(60,10,6,.85)';
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = '#ff5a3c';
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    });

    // 粒子
    G.parts.forEach(p => {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, TAU);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    ctx.restore(); // 结束震动

    // UI
    if (G.mode !== 'menu' && G.mode !== 'select' && G.mode !== 'pick' && G.mode !== 'codex') {
      drawHoverGhost();
      ctx.save();
      ctx.fillStyle = 'rgba(12,30,18,.82)';
      ctx.fillRect(0, 0, W, 116);
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.fillRect(0, 112, W, 4);
      ctx.restore();

      drawSunCounter();
      G.availPlants.forEach((k, i) => drawCard(k, i));
      if (G.tutorial && !G.tutorial.done) drawTutorial();
      drawShovelBtn();
      drawTopBarInfo();
      if (G.sandbox) drawSandboxBar();
      drawBossBar();
      drawBanner();
    }

    if (G.mode === 'menu') drawMenu();
    if (G.mode === 'select') drawSelect();
    if (G.mode === 'pick') drawPick();
    if (G.mode === 'codex') drawCodex();
    if (G.mode === 'paused') drawPauseOverlay();
    if (G.mode === 'win' || G.mode === 'lose') drawOverlayEnd();
  }

  /* ============================================================
     循环
  ============================================================ */
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt * (G.mode === 'playing' ? (G.speed || 1) : 1));
    render();
    requestAnimationFrame(loop);
  }
  applyLayout();
  resetGame();
  loadProgress();
  drawBackgroundToCanvas();
  requestAnimationFrame(loop);

  // 调试句柄（不影响正常游戏）
  window.__PVZ = { G, startGame, startLevel, resetGame, PLANT_DEFS, ZOMBIE_DEFS, beginLevel, levelCfg, makePlant, spawnZombie,
    startSandbox, beginSandbox,
    place: (k, c, r) => { const p = makePlant(k, c, r); G.plants.push(p); G.grid[r * cols + c] = p; return p; } };
})();
</script>
</body>
</html>
