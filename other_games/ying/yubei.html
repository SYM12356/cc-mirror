<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>这是预备铃</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    background: radial-gradient(circle at 50% 15%, #1d4432 0%, #0c1a13 60%, #050a08 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: relative;
    width: min(97vw, calc(97vh * 1000 / 700));
    max-width: 1180px;
  }
  #cheatPanel {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: none; z-index: 30; width: 320px;
    background: linear-gradient(180deg, rgba(28,20,44,.97), rgba(14,10,26,.97));
    border: 1px solid rgba(190,150,255,.4); border-radius: 14px;
    box-shadow: 0 18px 50px rgba(0,0,0,.7);
    padding: 16px 18px; color: #e8ddff; text-align: center;
    font-family: "PingFang SC","Microsoft YaHei",sans-serif;
  }
  #cheatPanel .cheat-title { font-weight: bold; font-size: 20px; color: #d9baff; margin-bottom: 10px; }
  #cheatPanel .cheat-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 10px 0; }
  #cheatPanel input {
    width: 76px; padding: 6px 8px; border-radius: 8px; border: 1px solid rgba(190,150,255,.5);
    background: rgba(10,6,20,.9); color: #fff; font-size: 15px; text-align: center; outline: none;
  }
  #cheatPanel button {
    padding: 7px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,.3);
    background: linear-gradient(180deg, #7c5cd6, #4b3391); color: #fff; font-size: 14px;
    cursor: pointer; font-family: inherit;
  }
  #cheatPanel button.cheat-toggle { background: linear-gradient(180deg, #3a3350, #241f38); }
  #cheatPanel button.on { background: linear-gradient(180deg, #e8b23c, #a8741a); color: #2a1e00; font-weight: bold; }
  #cheatPanel button:hover { filter: brightness(1.15); }
  canvas {
    display: block; width: 100%; height: auto;
    border-radius: 16px;
    box-shadow: 0 30px 70px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.07), inset 0 0 0 1px rgba(0,0,0,.3);
    cursor: pointer;
    touch-action: none;
  }
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
<svg id="gameLogo" xmlns="http://www.w3.org/2000/svg" style="display:none" width="512" height="512" viewBox="0 0 512 512">

    <path d="M170 256 L102 256 M116 245 L102 256 L116 267"/>
    <path d="M342 256 L410 256 M396 245 L410 256 L396 267"/>
    <path d="M256 170 L256 102 M245 116 L256 102 L267 116"/>
    <path d="M256 342 L256 410 M245 396 L256 410 L267 396"/>

    <rect x="250" y="214" width="12" height="12"/><rect x="262" y="214" width="12" height="12"/>
    <rect x="274" y="214" width="12" height="12"/><rect x="286" y="214" width="12" height="12"/>
    <rect x="214" y="226" width="12" height="12"/>
    <rect x="214" y="238" width="12" height="12"/>
    <rect x="226" y="250" width="12" height="12"/><rect x="238" y="250" width="12" height="12"/>
    <rect x="250" y="250" width="12" height="12"/><rect x="262" y="250" width="12" height="12"/>
    <rect x="274" y="250" width="12" height="12"/>
    <rect x="286" y="262" width="12" height="12"/>
    <rect x="286" y="274" width="12" height="12"/>
    <rect x="214" y="286" width="12" height="12"/><rect x="226" y="286" width="12" height="12"/>
    <rect x="238" y="286" width="12" height="12"/><rect x="250" y="286" width="12" height="12"/>

<div id="cheatPanel">
  <div class="cheat-title">作弊菜单</div>
  <div class="cheat-row">
    <span>跳到第</span>
    <input id="cheatWaveInput" type="number" min="1" value="1">
    <span>波</span>
    <button id="cheatJumpBtn">跳 转</button>
  </div>
  <div class="cheat-row">
    <button id="cheatSunBtn" class="cheat-toggle">无限墨水：关</button>
    <button id="cheatCdBtn" class="cheat-toggle">无冷却：关</button>
  </div>
  <div class="cheat-row"><button id="cheatCloseBtn">关闭菜单（Esc）</button></div>
</div>
</div>
<script>
(() => {
  'use strict';

  /* ============================================================
     基础常量与工具
  ============================================================ */
  const W = 1000, H = 700;
  let cols = 9, rows = 5;
  const cellW = 95, cellH = 106;
  let gx = 115, gy = 118;
  let gridW = cols * cellW, gridH = rows * cellH;
  function applyLayout() {
    gridW = cols * cellW;
    gridH = rows * cellH;
    gy = Math.round((H - gridH) / 2) + 33;
    gx = 115;
  }

  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');

  /* ---- 主菜单 Logo（内嵌 SVG → data URI） ---- */
  const logoImg = new Image();
  try {
    logoImg.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(document.getElementById('gameLogo').outerHTML);
  } catch (e) {}

  /* ---- 开场动画：黑屏大 logo → 1 秒后渐隐显示游戏内容 ---- */
  (function () {
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:#04060b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;z-index:9999;opacity:1;transition:opacity 1.2s ease;pointer-events:auto;cursor:pointer;';
    const img = document.createElement('img');
    img.src = logoImg.src;
    img.alt = '';
    img.style.cssText = 'width:min(36vmin,300px);height:auto;filter:drop-shadow(0 14px 48px rgba(225,29,72,.5));animation:introPulse 1.6s ease-in-out infinite;';
    const tip = document.createElement('div');
    tip.textContent = '这是预备铃！';
    tip.style.cssText = 'color:#ffe9a8;font:700 22px "PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:8px;text-indent:8px;opacity:.9;';
    ov.appendChild(img);
    ov.appendChild(tip);
    const st = document.createElement('style');
    st.textContent = '@keyframes introPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}';
    document.head.appendChild(st);
    document.body.appendChild(ov);
    let done = false;
    const hide = () => {
      if (done) return; done = true;
      ov.style.opacity = '0';
      ov.style.pointerEvents = 'none';
      setTimeout(() => ov.remove(), 1300);
    };
    setTimeout(hide, 1000);
    ov.addEventListener('click', hide);
  })();

  const DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = W * DPR;
  cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const randi = (a, b) => Math.floor(rand(a, b + 1));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const cellCX = c => gx + c * cellW + cellW / 2;
  const cellCY = r => gy + r * cellH + cellH / 2;
  const cellRect = (c, r) => ({ x: gx + c * cellW, y: gy + r * cellH, w: cellW, h: cellH });

  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  /* ============================================================
     音效（WebAudio 合成，无需外部资源）
  ============================================================ */
  let actx = null, master = null, muted = false;
  function AC() {
    if (!actx) {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      actx = new Ctor();
      master = actx.createGain();
      master.gain.value = 0.5;
      master.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, dur, type = 'sine', vol = 0.07, slideTo = null) {
    if (muted) return;
    const c = AC(); if (!c) return;
    try {
      const o = c.createOscillator(), g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, c.currentTime);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), c.currentTime + dur);
      g.gain.setValueAtTime(vol, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      o.connect(g); g.connect(master);
      o.start(); o.stop(c.currentTime + dur + 0.02);
    } catch (e) { /* ignore */ }
  }
  function noise(dur = 0.2, vol = 0.12, freq = 900) {
    if (muted) return;
    const c = AC(); if (!c) return;
    try {
      const len = Math.floor(c.sampleRate * dur);
      const buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = c.createBufferSource(); src.buffer = buf;
      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
      const g = c.createGain();
      g.gain.setValueAtTime(vol, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start();
    } catch (e) { /* ignore */ }
  }
  const SFX = {
    plant: () => { tone(300, 0.12, 'triangle', 0.10, 520); },
    shoot: () => { tone(760, 0.06, 'square', 0.035, 420); },
    hit: () => { tone(180, 0.05, 'square', 0.03, 110); },
    collect: () => { tone(880, 0.10, 'sine', 0.08, 1320); setTimeout(() => tone(1320, 0.10, 'sine', 0.05), 60); },
    boom: () => { noise(0.45, 0.22, 700); tone(90, 0.4, 'sawtooth', 0.10, 40); },
    mower: () => { tone(120, 0.6, 'sawtooth', 0.09, 320); },
    groan: () => { tone(rand(70, 100), 0.5, 'sawtooth', 0.035, rand(50, 70)); },
    lose: () => { tone(220, 0.7, 'sawtooth', 0.10, 60); },
    win: () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.22, 'triangle', 0.09), i * 130)); },
    click: () => { tone(520, 0.05, 'square', 0.04); }
  };

  /* ============================================================
     数据定义
  ============================================================ */
  const PLANT_DEFS = {
    sunflower:  { name: '墨水瓶',   cost: 50,  cd: 5,  hp: 130 },
    peashooter: { name: '铅笔',     cost: 100, cd: 5,  hp: 130 },
    wallnut:    { name: '橡皮',     cost: 50,  cd: 18, hp: 900 },
    snowpea:    { name: '窗户',     cost: 175, cd: 8,  hp: 130 },
    repeater:   { name: '黑笔炮',   cost: 200, cd: 10, hp: 130 },
    cherry:     { name: '发酵酸奶', cost: 150, cd: 22, hp: 9999 },
    ruler:      { name: '直尺',     cost: 200, cd: 8,  hp: 320 },
    stapler:    { name: '订书机',   cost: 175, cd: 12, hp: 130 },
    kaka:       { name: '尻尻',     cost: 150, cd: 25, hp: 130 },
    chaoran:    { name: '超然',     cost: 150, cd: 22, hp: 1 }
  };
  // 全部文具池（第 4 关起从中选 6 张；第 5 关起解锁超然）
  const CARD_ORDER = ['sunflower', 'peashooter', 'wallnut', 'snowpea', 'repeater', 'cherry', 'ruler', 'stapler', 'kaka', 'chaoran'];
  const BASE_POOL = CARD_ORDER.slice(0, 9);
  // 前三关固定卡组
  const BASE6 = ['sunflower', 'peashooter', 'wallnut', 'snowpea', 'repeater', 'cherry'];
  const PICK_LIMIT = 6;

  const ZOMBIE_DEFS = {
    normal: { hp: 200, armor: 0,   speed: 24, dps: 38 },
    cone:   { hp: 200, armor: 220, speed: 24, dps: 38 },
    bucket: { hp: 200, armor: 600, speed: 22, dps: 40 },
    flag:   { hp: 230, armor: 0,   speed: 36, dps: 42 },
    dash:   { hp: 150, armor: 0,   speed: 28, dps: 46 },
    // BOSS 吴红肠：血量按「普通作业 20 倍」设定（基础 200 → 4000），不走动
    boss:   { hp: 4000, armor: 0,  speed: 0,  dps: 0 }
  };

  // 各类型作业纸的配色（路障→橙色、铁桶→红色，均不再戴头具）
  const ZCOLOR = {
    normal: { limb: '#efe9d6', body0: '#faf6ea', body1: '#e6dfc9' },
    cone:   { limb: '#f2a35f', body0: '#ffbe76', body1: '#ef9340' },
    bucket: { limb: '#ee8478', body0: '#f4705f', body1: '#d24334' },
    flag:   { limb: '#efe9d6', body0: '#faf6ea', body1: '#e6dfc9' },
    dash:   { limb: '#cdc2ee', body0: '#bcaae9', body1: '#8e79cb' }
  };

  const MENU_BTNS = {
    start:   { x: W / 2 - 140, y: 596, w: 280, h: 72 },
    codex:   { x: 172, y: 606, w: 160, h: 56 },
    sandbox: { x: 668, y: 606, w: 168, h: 56 }
  };
  const CODEX_BACK = { x: W / 2 - 110, y: 636, w: 220, h: 46 };
  const SELECT_BACK = { x: W / 2 - 110, y: 648, w: 220, h: 46 };
  const LEVEL_DESC = {
    1: '一条通路 · 新手教学',
    2: '三条通路 · 解锁橡皮'
  };
  function levelDesc(lv) {
    if (lv === 3) return '五条通路 · 六种文具上阵';
    if (lv === 4) return '五条通路 · 选 6 种 · 订正本';
    return LEVEL_DESC[lv] || ('五条通路 · 选 6 种 · 难度 ' + (lv - 2));
  }
  function loadProgress() {
    // 全部关卡默认解锁
    G.maxLevel = Math.max(12, G.maxLevel || 1);
    try {
      const v = parseInt(localStorage.getItem('ybl_maxLevel') || '1', 10);
      if (v >= 1 && v <= 999) G.maxLevel = Math.max(12, v);
    } catch (e) {}
  }
  function saveProgress() {
    try { localStorage.setItem('ybl_maxLevel', String(G.maxLevel)); } catch (e) {}
  }
  function selectLevelRects() {
    const total = Math.min(12, Math.max(12, G.maxLevel));
    const colX = [W / 2 - 330, W / 2 - 110, W / 2 + 110, W / 2 + 330];
    const rowY0 = 262, dh = 128;
    const rects = [];
    for (let lv = 1; lv <= total; lv++) {
      rects.push({
        lv,
        cx: colX[(lv - 1) % 4],
        cy: rowY0 + Math.floor((lv - 1) / 4) * dh,
        w: 196, h: 106
      });
    }
    return rects;
  }
  const CODEX_TABS = {
    plants:  { x: W / 2 - 190, y: 100, w: 180, h: 40 },
    zombies: { x: W / 2 + 10, y: 100, w: 180, h: 40 }
  };

  const CODEX_PLANTS = [
    { key: 'sunflower',  name: '墨水瓶',   desc: '定期产出墨水',
      intro: '墨水瓶常常思考瓶生："它是不是生不逢时？"虽然淡出了学习生涯，但它仍坚守防线！' },
    { key: 'peashooter', name: '铅笔',     desc: '发射铅笔头子弹',
      intro: '铅笔泡了一杯墨水茶，缓缓说道："我只有小学有用？"它抿了一口茶，"那你画图别叫我。"' },
    { key: 'wallnut',    name: '橡皮',     desc: '坚硬的前排盾牌',
      intro: '橡皮一向是最聪明的文具。"咕噜噜噜噜，"它说，"噜噜噜噜噜噜呼呼！"它总结道。' },
    { key: 'snowpea',    name: '窗户',     desc: '吹冷风减速敌人',
      intro: '窗户渴望自由，可它总是被捂住嘴巴。人们总是对它夏天漏冷气、冬天放冷气这点不待见。' },
    { key: 'repeater',   name: '黑笔炮',   desc: '连续发射两发墨弹',
      intro: '黑笔炮总是皱着眉："不要抱怨我没水！我漏起墨水来作业都挡不住！"' },
    { key: 'cherry',     name: '发酵酸奶', desc: '大爆炸+臭酸奶+蛆虫',
      intro: '超然同学精心培育的佳肴。里面真的只是一些发酵的酸奶……应该吧？' },
    { key: 'ruler',      name: '直尺',     desc: '近身横扫贴脸的作业',
      intro: '直尺一辈子只做两件事：量别人，和敲桌子。它说这叫"有刻度的人生"。至于打作业，那只是顺手——真的只是顺手。' },
    { key: 'stapler',    name: '订书机',   desc: '钉子穿透一整排作业',
      intro: '订书机相信所有问题都能靠"啪"一下解决。订不住的，就再"啪"一下。老师们的抽屉里都藏着它。' },
    { key: 'kaka',       name: '尻尻',     desc: '全图索敌 · 跳坐 · 睡 10 秒',
      intro: '坐！坐！坐！' },
    { key: 'chaoran',    name: '超然',     desc: '前方一格 · 10 拳 · 打完阵亡',
      intro: '在另一个平行时空，超然块头不小，下手却专挑软肋。但现在他只想和敌人堂堂正正地决斗——虽说他真的很脆。' }
  ];
  const CODEX_ZOMBIES = [
    { type: 'normal', name: '作业',     desc: '普通的作业纸',
      intro: '它原本只是一颗茂盛的大树，却被人们残暴地做成折磨学生的傀儡，别想逃过它的追击！' },
    { type: 'cone',   name: '橙色作业', desc: '重要作业 · 橙纸',
      intro: '更难更烦的作业，它们最喜欢的事情是折磨学生，以及吃番茄！' },
    { type: 'bucket', name: '红色作业', desc: '期末作业 · 红纸',
      intro: '容易生气的作业，它们太喜欢观查火星了，这也让它们更加生气：‘为啥我去不了火星？’久而久之，它也变成了红色。' },
    { type: 'flag',   name: '旗手作业', desc: '领跑一大波作业',
      intro: '它其实只是普通作业，但它们扛上了大旗，就成了光荣的旗手' },
    { type: 'dash',   name: '订正本',   desc: '冲刺型 · 紫纸覆改',
      intro: '被红笔改过三遍的作业本，翻脸就不认人。它会突然提速冲过防线——毕竟订正这种事，拖到最后都会变成冲刺。' },
    { type: 'boss',   name: '吴红肠',   desc: '期末 BOSS · 全行可打 · 占课',
      intro: '喜欢占课的红肠。她的观察力极其敏锐，酸奶酸奶什么都会被她扔掉，就连尻尻也不例外。' }
  ];

  const WAVE_TABLE = [
    { d: 18, list: ['normal'] },
    { d: 22, list: ['normal', 'normal'] },
    { d: 20, list: ['normal', 'cone'] },
    { d: 20, list: ['normal', 'normal', 'cone'] },
    { d: 18, list: ['cone', 'cone', 'normal'] },
    { d: 32, list: ['flag', 'normal', 'normal', 'cone', 'cone', 'bucket'], big: true },
    { d: 24, list: ['normal', 'cone', 'bucket'] },
    { d: 20, list: ['normal', 'normal', 'cone', 'bucket'] },
    { d: 18, list: ['cone', 'cone', 'bucket', 'normal'] },
    { d: 18, list: ['bucket', 'bucket', 'cone', 'normal', 'normal'] },
    { d: 16, list: ['normal', 'cone', 'bucket', 'bucket', 'cone', 'normal'] },
    { d: 20, list: ['flag', 'bucket', 'bucket', 'cone', 'cone', 'normal', 'normal', 'bucket'], big: true, final: true }
  ];

  /* ============================================================
     关卡系统
  ============================================================ */
  function buildWaveTable(lv) {
    let table;
    if (lv === 1) table = [                     // 第一关：一条路，只有普通/橙色作业
      { d: 18, list: ['normal'] },
      { d: 24, list: ['normal', 'normal'] },
      { d: 20, list: ['normal', 'cone'] },
      { d: 16, list: ['flag', 'normal', 'normal', 'cone'], big: true, final: true }
    ];
    else if (lv === 2) table = [                // 第二关：三条路
      { d: 14, list: ['normal', 'normal'] },
      { d: 18, list: ['normal', 'cone'] },
      { d: 16, list: ['cone', 'normal', 'normal'] },
      { d: 18, list: ['cone', 'cone', 'normal'] },
      { d: 16, list: ['bucket', 'normal'] },
      { d: 18, list: ['cone', 'cone', 'bucket'] },
      { d: 16, list: ['bucket', 'cone', 'normal', 'normal'] },
      { d: 16, list: ['flag', 'bucket', 'cone', 'cone', 'normal', 'normal'], big: true, final: true }
    ];
    else {
      // 第三关起：12 波基础表，每关增加波次并强化作业属性
      const extraN = Math.min((lv - 3) * 2, 6);
      const extra = [];
      for (let i = 0; i < extraN; i++) extra.push(WAVE_TABLE[3 + (i % 8)]);
      table = WAVE_TABLE.slice(0, 11).concat(extra, [WAVE_TABLE[11]]);
      if (lv >= 4) {
        // 订正本登场：从第 3 波起，每隔一波混入冲刺作业
        table = table.map((w, i) => {
          const list = w.list.slice();
          if (i >= 2 && i % 2 === 0) {
            const k = Math.min(1 + Math.floor((lv - 4) / 2), list.length - 1);
            for (let j = 0; j < k; j++) list[list.length - 1 - j] = 'dash';
          }
          return Object.assign({}, w, { list });
        });
      }
      // 第 4 关：最终波压轴登场 BOSS 吴红肠
      if (lv === 4) {
        const last = table.length - 1;
        table[last] = Object.assign({}, table[last], {
          list: table[last].list.concat(['boss']),
          bossFinal: true
        });
      }
    }
    // 通用强化：除第一波外，每波额外刷怪（随关卡递增，最多 +4）
    const addN = Math.min(1 + Math.floor((lv - 1) / 2), 4);
    table = table.map((w, i) => {
      if (i === 0) return w;
      const list = w.list.slice();
      const pool = list.filter(t => t !== 'boss');   // 额外刷怪不复制 BOSS
      for (let j = 0; j < addN; j++) list.push(pool[(i + j) % pool.length]);
      return Object.assign({}, w, { list });
    });
    return table;
  }

  function levelCfg(lv) {
    if (lv === 1) return { rows: 1, plants: ['sunflower', 'peashooter'], tutorial: true, pick: false };
    if (lv === 2) return { rows: 3, plants: ['sunflower', 'peashooter', 'wallnut'], tutorial: false, pick: false };
    if (lv === 3) return { rows: 5, plants: BASE6.slice(), tutorial: false, pick: false };
    return { rows: 5, plants: null, tutorial: false, pick: true };
  }

  function startLevel(keepCards) {
    const lv = G.level;

    rows = cfg.rows;

    // 第 4 关起：先选卡（重开本关时沿用上一套卡组）；第 5 关起解锁超然
    const pool = lv >= 5 ? CARD_ORDER : BASE_POOL;
    if (cfg.pick && !(keepCards && G.availPlants.length === PICK_LIMIT && G.availPlants.every(k => pool.indexOf(k) >= 0))) {
      G.pickPool = pool.slice();
      const saved = G.availPlants.filter(k => pool.indexOf(k) >= 0);
      G.pickSel = saved.length === PICK_LIMIT ? saved.slice() : [];
      resetGame();
      drawBackgroundToCanvas();
      G.mode = 'pick';
      SFX.click();
      return;
    }
    G.availPlants = cfg.pick ? G.availPlants.slice(0, PICK_LIMIT) : cfg.plants.slice();
    beginLevel(cfg);
  }

  function updateTutorial() {
    const T = G.tutorial;

    else if (T.step === 1 && G.plants.some(pl => pl.type === 'sunflower')) {

      T.step = 3;
      G.sun = Math.max(G.sun, PLANT_DEFS.peashooter.cost);  // 兜底墨水，保证教学不卡关
    }
    else if (T.step === 3 && G.selected === 'peashooter') T.step = 4;
    else if (T.step === 4 && G.plants.some(pl => pl.type === 'peashooter')) {
      T.step = 5; T.doneAt = G.time;
    } else if (T.step === 5 && G.time > T.doneAt + 2.4) finishTutorial();
  }

  const TUT_HINTS = [

  /* ============================================================

  // 一次性植物（BOSS 在场时放置会被直接变成作业）

  function resetGame() {
    G.time = 0;

  function buildWaves() {
    let t = G.time;
    G.waves = G.waveRaw.map(w => {
      t += w.d;
      return {
        due: t,
        big: !!w.big,
        final: !!w.final,
        list: w.list.map(type => ({ type, row: type === 'boss' ? Math.floor(rows / 2) : randi(0, rows - 1) }))
      };
    });
    G.waveIndex = 0;
    G.pending = [];
  }

  /* ============================================================
     粒子与特效
  ============================================================ */
  function burst(x, y, n, color, spd = 120, size = 4, life = 0.6) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), s = rand(spd * 0.3, spd);
      G.parts.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40,
        life: rand(life * 0.6, life), max: life, color,
        size: rand(size * 0.5, size), grav: 420
      });
    }
  }
  function ring(x, y, r0, r1, color, life = 0.45) {
    G.rings.push({ x, y, r0, r1, color, life, max: life });
  }

  /* ============================================================
     植物 / 僵尸 生成
  ============================================================ */
  function makePlant(type, col, row) {
    const def = PLANT_DEFS[type];
    return {
      type, col, row,
      x: cellCX(col), y: cellCY(row) + 10,
      hp: def.hp, maxHp: def.hp,
      timer: type === 'sunflower' ? 4.5 : (type === 'cherry' ? 1.1 : 0),
      recoil: 0, anim: rand(0, 10), flash: 0, sweep: 0,
      rest: 0, restMax: 0, jump: 0, jumpT: 0.45,
      jx0: 0, jy0: 0, jx1: 0, jy1: 0, jumpTo: null
    };
  }

  let zidSeq = 0;

  function spawnZombie(type, row) {
    const def = ZOMBIE_DEFS[type];
    const m = Math.max(0, G.level - 3);           // 第 3 关起逐关强化
    const hpMul = 1 + m * 0.35;
    const spMul = 1 + Math.min(0.4, m * 0.08);
    const isBoss = type === 'boss';
    const z = {
      id: ++zidSeq,
      type, row,
      x: isBoss ? W - 76 : W + rand(40, 130),
      y: cellCY(row) + 44,
      hp: Math.round(def.hp * hpMul), maxHp: Math.round(def.hp * hpMul),
      armor: Math.round(def.armor * hpMul), armorMax: Math.round(def.armor * hpMul),
      speed: def.speed * spMul * rand(0.92, 1.08),
      dps: def.dps,
      walkPhase: rand(0, TAU),
      eating: false,
      slowUntil: 0,
      dashTimer: rand(1.4, 3), dashUntil: 0,
      flash: 0,
      groanTimer: rand(2, 8),
      dead: false
    };
    if (isBoss) {
      z.fireTimer = 4;          // 首次占课略快，之后固定 7 秒
      z.dying = false;
      z.dieT = 0;
      z.enterT = 0.9;           // 登场推入动画
      G.banner = { text: '这节课我要了！', sub: '期末 BOSS · 吴红肠', t: 3.4, danger: true, boss: true };
      G.shake = Math.max(G.shake, 10);
      SFX.boom();
    }
    G.zombies.push(z);
    return z;
  }

  /* ============================================================
     交互
  ============================================================ */
  const CARD_W = 84, CARD_H = 96, CARD_Y = 12, CARD_GAP = 8, CARD_X0 = 118;

  function cardRect(i) {
    return { x: CARD_X0 + i * (CARD_W + CARD_GAP), y: CARD_Y, w: CARD_W, h: CARD_H };
  }
  function shovelRect() { return { x: CARD_X0 + G.availPlants.length * (CARD_W + CARD_GAP) + 6, y: 22, w: 56, h: 62 }; }
  function skipRect()  { return { x: 18, y: 654, w: 100, h: 36 }; }
  function cheatRect() { return { x: 126, y: 654, w: 100, h: 36 }; }
  function muteRect()  { return { x: 766, y: 62, w: 36, h: 36 }; }
  function speedRect() { return { x: 810, y: 62, w: 82, h: 36 }; }
  function focusRect() { return { x: 898, y: 62, w: 86, h: 36 }; }
  const PAUSE_BTNS = {
    back:  { x: W / 2 - 212, y: H / 2 + 62, w: 196, h: 58 },
    leave: { x: W / 2 + 16,  y: H / 2 + 62, w: 196, h: 58 }
  };
  const PICK_BTNS = {
    start: { x: W / 2 - 240, y: 606, w: 232, h: 58 },
    back:  { x: W / 2 + 20,  y: 606, w: 190, h: 58 }
  };
  function pickCardRects() {
    const pool = G.pickPool && G.pickPool.length ? G.pickPool : CARD_ORDER;
    const n = pool.length, per = 3, w = 276, h = 98, gap = 14;
    const rects = [];
    for (let r = 0; r * per < n; r++) {
      const items = pool.slice(r * per, r * per + per);
      const totalW = items.length * w + (items.length - 1) * gap;
      const x0 = W / 2 - totalW / 2 + w / 2;
      items.forEach((key, j) => {
        rects.push({ key, cx: x0 + j * (w + gap), cy: 228 + r * 106, w, h });
      });
    }
    return rects;
  }

  function inRect(px, py, r) {
    return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
  }

  function cellFromPoint(px, py) {
    if (px < gx || px >= gx + gridW || py < gy || py >= gy + gridH) return null;
    return { col: Math.floor((px - gx) / cellW), row: Math.floor((py - gy) / cellH) };
  }

  function onPointerDown(e) {
    e.preventDefault();
    const rect = cv.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width * W;
    const py = (e.clientY - rect.top) / rect.height * H;
    handleClick(px, py);
  }

  function handleClick(px, py) {
    AC();
    if (G.mode === 'menu') {
      if (inRect(px, py, MENU_BTNS.start)) { G.mode = 'select'; SFX.click(); }
      else if (inRect(px, py, MENU_BTNS.codex)) { G.mode = 'codex'; G.codexTab = 'plants'; SFX.click(); }
      else if (inRect(px, py, MENU_BTNS.sandbox)) startSandbox();
      return;
    }
    if (G.mode === 'select') {
      if (inRect(px, py, SELECT_BACK)) { G.mode = 'menu'; SFX.click(); return; }
      const rects = selectLevelRects();
      for (let i = 0; i < rects.length; i++) {
        const r = rects[i];
        const lv = r.lv;
        if (lv > G.maxLevel) continue;
        if (px > r.cx - r.w / 2 && px < r.cx + r.w / 2 && py > r.cy - r.h / 2 && py < r.cy + r.h / 2) {
          G.level = lv;
          startLevel();
          return;
        }
      }
      return;
    }
    if (G.mode === 'pick') {
      if (inRect(px, py, PICK_BTNS.back)) { G.mode = G.sandbox ? 'menu' : 'select'; SFX.click(); return; }
      if (inRect(px, py, PICK_BTNS.start)) {
        if (G.pickSel.length === PICK_LIMIT) {
          G.availPlants = G.pickSel.slice();
          if (G.sandbox) beginSandbox();
          else beginLevel(levelCfg(G.level));
        } else {
          tone(180, 0.12, 'square', 0.05);
          G.pickWarn = 1.2;
        }
        return;
      }
      const prects = pickCardRects();
      for (let i = 0; i < prects.length; i++) {
        const r = prects[i];
        if (px > r.cx - r.w / 2 && px < r.cx + r.w / 2 && py > r.cy - r.h / 2 && py < r.cy + r.h / 2) {
          togglePick(r.key);
          return;
        }
      }
      return;
    }
    if (G.mode === 'codex') {
      if (G.codexSel != null) {
        if (inRect(px, py, CODEX_BACK)) { G.codexSel = null; SFX.click(); }
        return;
      }
      if (inRect(px, py, CODEX_BACK)) { G.mode = 'menu'; SFX.click(); return; }
      if (inRect(px, py, CODEX_TABS.plants)) { G.codexTab = 'plants'; SFX.click(); return; }
      if (inRect(px, py, CODEX_TABS.zombies)) { G.codexTab = 'zombies'; SFX.click(); return; }
      const rects = codexGridRects(G.codexTab);
      for (let i = 0; i < rects.length; i++) {
        const r = rects[i];
        if (px > r.cx - r.w / 2 && px < r.cx + r.w / 2 && py > r.cy - r.h / 2 && py < r.cy + r.h / 2) {
          G.codexSel = i; SFX.click(); return;
        }
      }
      return;
    }
    if (G.mode === 'win' || G.mode === 'lose') {
      if (G.endTimer > 0.9) {
        SFX.click();
        if (G.mode === 'win') {
          G.level++;
          G.maxLevel = Math.max(G.maxLevel, G.level);
          saveProgress();
        }
        startLevel();
      }
      return;
    }
    if (G.mode === 'paused') {
      if (inRect(px, py, PAUSE_BTNS.back)) { G.mode = 'playing'; SFX.click(); return; }
      if (inRect(px, py, PAUSE_BTNS.leave)) {
        G.selected = null; G.shovel = false;
        G.mode = G.sandbox ? 'menu' : 'select';
        SFX.click();
        return;
      }
      return;
    }
    if (G.mode !== 'playing') return;

    // 沙盒投放栏
    if (G.sandbox) {
      for (let i = 0; i < SAND_BTNS.length; i++) {
        if (!inRect(px, py, sandBtnRect(i))) continue;
        const bd = SAND_BTNS[i];
        if (bd.type === 'clear') {
          G.zombies.length = 0; G.pending.length = 0;
          SFX.click();
        } else {
          spawnZombie(bd.type, bd.type === 'boss' ? Math.floor(rows / 2) : Math.floor(Math.random() * rows));
          tone(300, 0.06, 'square', 0.04);
        }
        return;
      }
    }

    // 收集墨水：点任意一滴即可收走全场墨水
    let hitSun = -1;
    for (let i = G.suns.length - 1; i >= 0; i--) {
      const s = G.suns[i];
      if (Math.hypot(px - s.x, py - s.y) < 40) { hitSun = i; break; }
    }
    if (hitSun >= 0) { collectAllSuns(); return; }

    // 跳过教程按钮
    if (G.tutorial && !G.tutorial.done && inRect(px, py, TUT_SKIP)) { finishTutorial(); return; }

    // 静音按钮
    if (inRect(px, py, muteRect())) { muted = !muted; SFX.click(); return; }

    // 全神贯注（加速）
    if (inRect(px, py, speedRect())) {
      G.speed = G.speed === 1 ? 2 : 1;
      if (G.speed > 1) SFX.click(); else tone(220, 0.08, 'square', 0.04);
      G.banner = { text: G.speed > 1 ? '全神贯注 ×2' : '恢复正常速度', sub: '', t: 1.1 };
      return;
    }

    // 走神一下（暂停菜单）
    if (inRect(px, py, focusRect())) { G.mode = 'paused'; SFX.click(); return; }

    // 跳过波次：立即刷出下一波
    if (!G.sandbox && inRect(px, py, skipRect())) {
      if (G.waveIndex < G.waves.length) {
        G.waves[G.waveIndex].due = G.time;
        SFX.click();
        G.banner = { text: '已提前召唤下一波！', sub: '', t: 1.2, danger: true };
      } else tone(180, 0.1, 'square', 0.05);
      return;
    }

    // 作弊菜单
    if (!G.sandbox && inRect(px, py, cheatRect())) { toggleCheat(true); SFX.click(); return; }

    // 卡片
    for (let i = 0; i < G.availPlants.length; i++) {
      if (inRect(px, py, cardRect(i))) {
        const key = G.availPlants[i];
        const def = PLANT_DEFS[key];
        if (!G.sandbox && !G.cheat.noCd && (G.cd[key] || 0) > G.time) { tone(180, 0.12, 'square', 0.05); return; }
        if (!G.sandbox && !G.cheat.infSun && G.sun < def.cost) { tone(160, 0.14, 'square', 0.05); return; }
        G.selected = (G.selected === key) ? null : key;
        G.shovel = false;
        SFX.click();
        return;
      }
    }

    // 铲子
    if (inRect(px, py, shovelRect())) {
      G.shovel = !G.shovel;
      G.selected = null;
      SFX.click();
      return;
    }

    // 格子
    const cell = cellFromPoint(px, py);
    if (!cell) { G.selected = null; G.shovel = false; return; }
    const idx = cell.row * cols + cell.col;

    if (G.shovel) {
      const p = G.grid[idx];
      if (p) {
        removePlant(p);
        burst(p.x, p.y, 10, '#b5a88e', 110, 4, 0.5);
        tone(320, 0.14, 'triangle', 0.07, 200);
      } else {
        tone(200, 0.1, 'square', 0.04);
      }
      G.shovel = false;
      return;
    }

    if (!G.selected) return;
    const key = G.selected;
    const def = PLANT_DEFS[key];
    const existing = G.grid[idx];
    if (existing) {
      if (existing.type === 'cherry') return;
      tone(200, 0.1, 'square', 0.05);
      return;
    }
    if (!G.sandbox && !G.cheat.infSun && G.sun < def.cost) { tone(160, 0.14, 'square', 0.05); return; }
    if (!G.sandbox && !G.cheat.noCd && (G.cd[key] || 0) > G.time) { tone(180, 0.12, 'square', 0.05); return; }

    // 吴红肠在场：一次性植物放置即被她占课，直接变成一份普通作业
    if (ONE_SHOT.indexOf(key) >= 0 && G.zombies.some(z => z.type === 'boss' && !z.dead && !z.dying)) {
      if (!G.sandbox) {
        if (!G.cheat.infSun) G.sun -= def.cost;
        if (!G.cheat.noCd) G.cd[key] = G.time + def.cd;
      }
      G.selected = null;
      G.shake = Math.max(G.shake, 6);
      tone(150, 0.2, 'sawtooth', 0.08, 90);
      occupyCell(cellCX(cell.col), cell.row);
      return;
    }

    const p = makePlant(key, cell.col, cell.row);
    G.plants.push(p);
    G.grid[idx] = p;
    if (!G.sandbox) {
      if (!G.cheat.infSun) G.sun -= def.cost;
      if (!G.cheat.noCd) G.cd[key] = G.time + def.cd;
    }
    G.selected = null;
    SFX.plant();
    burst(p.x, p.y + 30, 8, '#d8cfc0', 90, 3, 0.45);
  }

  function collectSun(s, i) {
    G.sun += s.value;
    if (G.tutorial) G.tutorial.collected++;
    G.suns.splice(i, 1);
    G.sunPulse = 1;
    burst(s.x, s.y, 10, '#6f93c9', 150, 4, 0.55);
  }

  // 一次收走场上所有墨水
  function collectAllSuns() {
    if (!G.suns.length) return;
    let total = 0;
    G.suns.forEach(s => {
      total += s.value;
      burst(s.x, s.y, 8, '#6f93c9', 150, 4, 0.55);
      ring(s.x, s.y, 6, 26, '#9dbde8');
    });
    G.sun += total;
    if (G.tutorial) G.tutorial.collected += G.suns.length;
    G.suns.length = 0;
    G.sunPulse = 1;
    SFX.collect();
    if (total > 25) tone(760, 0.12, 'sine', 0.05, 980);
  }

  function togglePick(key) {
    const i = G.pickSel.indexOf(key);
    if (i >= 0) { G.pickSel.splice(i, 1); G.pickWarn = 0; SFX.click(); return; }
    if (G.pickSel.length >= PICK_LIMIT) {
      G.pickWarn = 1.2;
      tone(180, 0.12, 'square', 0.05);
      return;
    }
    G.pickSel.push(key);
    SFX.click();
  }

  /* ---- 尻尻：跳坐 ---- */
  function kakaJump(p, z) {
    const col = clamp(Math.floor((z.x - gx) / cellW), 0, cols - 1);
    p.jx0 = p.x; p.jy0 = p.y;
    p.jx1 = cellCX(col);
    p.jy1 = cellCY(z.row) + 10;
    p.jumpTo = { col, row: z.row };
    p.jumpTarget = z;
    p.jump = p.jumpT;
    const oldIdx = p.row * cols + p.col;
    if (G.grid[oldIdx] === p) G.grid[oldIdx] = null;
    tone(430, 0.1, 'sine', 0.05, 720);
  }

  function kakaLand(p) {
    const to = p.jumpTo || { col: p.col, row: p.row };
    const cx = p.jx1, cy = p.jy1;
    // 锁定的目标直接被坐扁
    const tz = p.jumpTarget;
    if (tz && !tz.dead && !tz.dying && tz.type !== 'boss') {
      tz.armor = 0;
      tz.hp -= 1500;
      tz.flash = 1;
      if (tz.hp <= 0) killZombie(tz);
    }
    for (const z of G.zombies) {
      if (z.dead || z.dying || z.row !== to.row || z.type === 'boss') continue;
      if (Math.abs(z.x - cx) < cellW * 0.8) {
        z.armor = 0;
        z.hp -= 1500;
        z.flash = 1;
        if (z.hp <= 0) killZombie(z);
      }
    }
    ring(cx, cy + 16, 8, cellW * 0.82, '#efdcbb', 0.5);
    burst(cx, cy + 24, 20, '#e8dfc9', 240, 5, 0.6);
    burst(cx, cy + 10, 10, '#d9c8a6', 180, 4, 0.5);
    G.shake = Math.max(G.shake, 9);
    tone(110, 0.2, 'sawtooth', 0.09, 60);

    const idx = to.row * cols + to.col;
    const occupant = G.grid[idx];
    const maggotThere = G.maggots.some(m => m.row === to.row && Math.abs(m.x - cx) < cellW * 0.5);
    if ((occupant && occupant !== p) || maggotThere) {
      // 目标格已有友方单位：回到原来那格
      p.x = cellCX(p.col); p.y = cellCY(p.row) + 10;
      G.grid[p.row * cols + p.col] = p;
    } else {
      p.col = to.col; p.row = to.row;
      p.x = cellCX(to.col); p.y = cellCY(to.row) + 10;
      G.grid[idx] = p;
    }
    p.rest = 10;
    p.restMax = 10;
    p.jump = 0;
    p.jumpTo = null;
    p.jumpTarget = null;
    p.flash = 0.5;
  }

  function removePlant(p) {
    const i = G.plants.indexOf(p);
    if (i >= 0) G.plants.splice(i, 1);
    const idx = p.row * cols + p.col;
    if (G.grid[idx] === p) G.grid[idx] = null;
  }

  cv.addEventListener('pointerdown', onPointerDown, { passive: false });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('pointermove', e => {
    const rect = cv.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width * W;
    const py = (e.clientY - rect.top) / rect.height * H;
    G.hover = cellFromPoint(px, py);
    // 选关界面：记录悬停的关卡，用于关卡预览（跟随鼠标）
    G.selPrev = null;
    if (G.mode === 'select') {
      G.selPrevPos = { x: px, y: py };
      for (const r of selectLevelRects()) {
        if (Math.abs(px - r.cx) <= r.w / 2 && Math.abs(py - r.cy) <= r.h / 2) { G.selPrev = r.lv; break; }
      }
    } else {
      G.selPrevPos = null;
    }
  });
  cv.addEventListener('pointerleave', () => { G.hover = null; G.selPrev = null; G.selPrevPos = null; });

  window.addEventListener('keydown', e => {
    if (cheatOpen) { if (e.key === 'Escape') toggleCheat(false); return; }
    if (e.key === 'Escape') {
      if (G.mode === 'playing') { G.selected = null; G.shovel = false; }
      else if (G.mode === 'paused') G.mode = 'playing';
      else if (G.mode === 'select') G.mode = 'menu';
      else if (G.mode === 'pick') G.mode = G.sandbox ? 'menu' : 'select';
      else if (G.mode === 'codex') { if (G.codexSel != null) G.codexSel = null; else G.mode = 'menu'; }
    }
    if (e.key === 'p' || e.key === 'P') {
      if (G.mode === 'playing') G.mode = 'paused';
      else if (G.mode === 'paused') G.mode = 'playing';
    }
    if (e.key === 'r' || e.key === 'R') {
      if (G.mode === 'playing' || G.mode === 'paused' || G.mode === 'win' || G.mode === 'lose') {
        if (G.sandbox) beginSandbox(); else startLevel(true);
      }
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && G.mode === 'playing') G.mode = 'paused';
  });

  /* ============================================================
     作弊菜单（DOM 面板）
  ============================================================ */
  const cheatPanel = document.getElementById('cheatPanel');
  const cheatWaveInput = document.getElementById('cheatWaveInput');
  const cheatSunBtn = document.getElementById('cheatSunBtn');
  const cheatCdBtn = document.getElementById('cheatCdBtn');
  let cheatOpen = false;

  function refreshCheatUI() {
    cheatSunBtn.textContent = '无限墨水：' + (G.cheat.infSun ? '开' : '关');
    cheatSunBtn.classList.toggle('on', G.cheat.infSun);
    cheatCdBtn.textContent = '无冷却：' + (G.cheat.noCd ? '开' : '关');
    cheatCdBtn.classList.toggle('on', G.cheat.noCd);
  }

  function toggleCheat(open) {
    cheatOpen = open;
    cheatPanel.style.display = open ? 'block' : 'none';
    if (open) {
      refreshCheatUI();
      const maxW = Math.max(1, G.waves.length);
      cheatWaveInput.value = clamp(Math.min(G.waveIndex + 1, maxW), 1, maxW);
    }
  }

  function cheatJumpWave() {
    if (!G.waves.length) { tone(180, 0.12, 'square', 0.05); return; }
    const n = clamp(parseInt(cheatWaveInput.value, 10) || 1, 1, G.waves.length);
    G.waveIndex = n - 1;          // 跳到第 n 波，前面的波次一律视为已通关
    G.pending.length = 0;
    toggleCheat(false);
    G.banner = { text: '已跳至第 ' + n + ' / ' + G.waves.length + ' 波', sub: '', t: 1.6 };
    tone(660, 0.1, 'sine', 0.05, 880);
  }

  document.getElementById('cheatJumpBtn').addEventListener('click', cheatJumpWave);
  document.getElementById('cheatCloseBtn').addEventListener('click', () => toggleCheat(false));
  cheatSunBtn.addEventListener('click', () => { G.cheat.infSun = !G.cheat.infSun; refreshCheatUI(); });
  cheatCdBtn.addEventListener('click', () => { G.cheat.noCd = !G.cheat.noCd; refreshCheatUI(); });
  cheatWaveInput.addEventListener('keydown', e => { if (e.key === 'Enter') cheatJumpWave(); });

  function startGame() {
    G.level = 1;
    startLevel();
  }

  /* ============================================================
     更新逻辑
  ============================================================ */
  function update(dt) {
    G.time += dt;
    G.sunPulse = Math.max(0, G.sunPulse - dt * 3);
    G.pickWarn = Math.max(0, (G.pickWarn || 0) - dt);
    G.shake = Math.max(0, G.shake - dt * 26);
    if (G.banner) { G.banner.t -= dt; if (G.banner.t <= 0) G.banner = null; }

    if (G.mode === 'win' || G.mode === 'lose') { G.endTimer += dt; updateFx(dt); return; }
    if (G.tutorial && !G.tutorial.done) updateTutorial();
    if (G.mode !== 'playing') { updateFx(dt); return; }

    /* --- 天降墨水滴 --- */
    if (!G.sandbox) {
      G.sunTimer -= dt;
      if (G.sunTimer <= 0) {
        G.sunTimer = rand(7.5, 11);
        G.suns.push({
          x: rand(gx + 40, gx + gridW - 40),
          y: gy - 40,
          targetY: rand(gy + 70, gy + gridH - 50),
          value: 25, life: 15, fall: true, scale: 0.5, spin: rand(0, TAU), born: G.time
        });
      }
    }

    /* --- 波次调度 --- */
    while (G.waveIndex < G.waves.length && G.time >= G.waves[G.waveIndex].due) {
      const w = G.waves[G.waveIndex];
      const stagger = w.big ? 0.55 : 0.9;
      w.list.forEach((z, i) => {
        G.pending.push({ t: G.time + i * stagger, type: z.type, row: z.row });
      });
      if (w.big) {
        G.banner = { text: w.final ? '最后一波作业来袭！' : '一大波作业正在接近！', sub: '', t: 2.8, danger: true };
        tone(140, 0.5, 'sawtooth', 0.08, 90);
        G.shake = 8;
      } else if (G.waveIndex > 0) {
        G.banner = { text: '第 ' + (G.waveIndex + 1) + ' 波', sub: '', t: 1.6 };
      }
      G.waveIndex++;
    }
    for (let i = G.pending.length - 1; i >= 0; i--) {
      if (G.time >= G.pending[i].t) {
        spawnZombie(G.pending[i].type, G.pending[i].row);
        G.pending.splice(i, 1);
      }
    }

    /* --- 植物 --- */
    for (let i = G.plants.length - 1; i >= 0; i--) {
      const p = G.plants[i];
      p.anim += dt;
      p.recoil = Math.max(0, p.recoil - dt * (p.type === 'snowpea' ? 3.2 : 5));
      p.flash = Math.max(0, p.flash - dt * 3);

      if (p.type === 'sunflower') {
        p.timer -= dt;
        if (p.timer <= 0) {
          p.timer = 7;
          G.suns.push({
            x: p.x + rand(-8, 8), y: p.y - 4,
            targetY: p.y + 34, value: 25, life: 13,
            fall: false, scale: 0.15, spin: rand(0, TAU), born: G.time
          });
          burst(p.x, p.y - 12, 6, '#6f93c9', 70, 3, 0.5);
        }
      }

      if (p.type === 'peashooter' || p.type === 'snowpea' || p.type === 'repeater' || p.type === 'stapler') {
        const hasTarget = G.zombies.some(z => !z.dead && !z.dying &&
          (z.type === 'boss' || z.row === p.row) && z.x > p.x - 6 && z.x < W + 150);
        if (hasTarget) {
          if (p.timer <= 0) {
            p.timer = p.type === 'repeater' ? 1.5 : (p.type === 'stapler' ? 1.7 : 1.3);
            fire(p);
            if (p.type === 'repeater') setTimeout(() => { if (G.plants.includes(p)) fire(p); }, 150);
          } else p.timer -= dt;
        } else {
          p.timer = Math.min(p.timer, 0.35);
        }
      }

      // 直尺：近身横扫
      if (p.type === 'ruler') {
        p.sweep = Math.max(0, p.sweep - dt * 3.4);
        const reach = cellW * 1.15;
        let tgt = null;
        for (const z of G.zombies) {
          if (z.dead || z.row !== p.row) continue;
          if (z.x > p.x - 18 && z.x < p.x + reach) { if (!tgt || z.x < tgt.x) tgt = z; }
        }
        if (tgt) {
          if (p.timer <= 0) {
            p.timer = 0.85;
            p.sweep = 1;
            damageZombie(tgt, 55);
            burst(tgt.x - 4, tgt.y - 34, 8, '#f2ddb0', 140, 4, 0.42);
            tone(320, 0.05, 'square', 0.05);
          } else p.timer -= dt;
        } else p.timer = Math.min(p.timer, 0.2);
      }

      // 尻尻：全图索敌 → 跳起坐过去 → 休息 10 秒
      if (p.type === 'kaka') {
        if (p.rest > 0) {
          p.rest -= dt;
          if (p.rest <= 0) { p.rest = 0; p.timer = 0.6; }
        } else if (p.jump > 0) {
          p.jump -= dt;
          const k = 1 - Math.max(0, p.jump) / p.jumpT;
          p.x = p.jx0 + (p.jx1 - p.jx0) * k;
          p.y = p.jy0 + (p.jy1 - p.jy0) * k - Math.sin(Math.PI * k) * 96;
          if (p.jump <= 0) kakaLand(p);
        } else if (p.timer > 0) {
          p.timer -= dt;
        } else {
          let tgt = null;
          for (const z of G.zombies) {
            if (z.dead || z.dying || z.type === 'boss') continue;   // 尻尻锁不住吴红肠
            if (!tgt || z.x < tgt.x) tgt = z;
          }
          if (tgt) kakaJump(p, tgt);
        }
      }

      // 超然：前方一格有目标 → 2 秒挥出 10 拳 → 打完自动阵亡（带亡语）
      if (p.type === 'chaoran') {
        if (!(p.fistT > 0)) {
          if (chaoranTargets(p).length > 0) { p.fistT = 2; p.fistN = 0; p.fistT0 = G.time; }
        }
        if (p.fistT > 0) {
          p.fistT -= dt;
          const n = Math.min(10, Math.floor((2 - Math.max(0, p.fistT)) / 0.2) + 1);
          while (p.fistN < n) {           // 目标死了也继续挥拳，直到 2 秒结束
            p.fistN++;
            chaoranPunch(p);
          }
          if (p.fistT <= 0) {
            chaoranLastWord(p);           // 挥拳结束自动阵亡
            continue;
          }
        }
      }

      if (p.type === 'cherry') {
        p.timer -= dt;
        if (p.timer <= 0) {
          explode(p.x, p.y, 1.55, 1900, p.row);
          removePlant(p);
          SFX.boom();
          G.shake = 16;
        }
      }

      if (p.hp <= 0 && p.type !== 'cherry') {
        burst(p.x, p.y, 14, '#cfc4ae', 130, 4, 0.6);
        if (p.type === 'chaoran') { chaoranLastWord(p); continue; }   // 被咬死也触发亡语
        removePlant(p);
      }
    }

    /* --- 豌豆 --- */
    for (let i = G.peas.length - 1; i >= 0; i--) {
      const pea = G.peas[i];
      pea.x += pea.speed * dt;
      pea.trail = (pea.trail || 0) + dt;
      if (pea.x > W + 60) { G.peas.splice(i, 1); continue; }

      let hit = null;
      for (const z of G.zombies) {
        if (z.dead || z.dying) continue;
        const isBoss = z.type === 'boss';               // BOSS 体型巨大：任一行都能打到
        if (!isBoss && z.row !== pea.row) continue;
        if (pea.hitIds && pea.hitIds.indexOf(z.id) >= 0) continue;
        const hw = isBoss ? 54 : 26;
        if (pea.x > z.x - hw && pea.x < z.x + hw) {
          if (!hit || z.x < hit.x) hit = z;
        }
      }
      if (hit) {
        damageZombie(hit, pea.dmg, pea.ice);
        burst(pea.x + 6, pea.y, 5, pea.btype === 'wind' ? '#cfeaff' : (pea.btype === 'ink' ? '#4a4a5e' : (pea.btype === 'staple' ? '#b9c2cf' : '#e2c288')), 90, 3, 0.32);
        if (pea.pierce > 0) {
          pea.hitIds = pea.hitIds || [];
          pea.hitIds.push(hit.id);
          pea.pierce--;
          if (pea.pierce <= 0) G.peas.splice(i, 1);
        } else {
          G.peas.splice(i, 1);
        }
      }
    }

    /* --- 僵尸 --- */
    for (let i = G.zombies.length - 1; i >= 0; i--) {
      const z = G.zombies[i];
      if (z.dead) { G.zombies.splice(i, 1); continue; }
      z.flash = Math.max(0, z.flash - dt * 6);

      // BOSS 吴红肠：站在最右侧不动，每 7 秒发射占课子弹；死亡后缓缓退场
      if (z.type === 'boss') {
        if (z.dying) {
          z.dieT -= dt;
          z.x += 34 * dt;
          if (z.dieT <= 0) G.zombies.splice(i, 1);
          continue;
        }
        if (z.enterT > 0) z.enterT = Math.max(0, z.enterT - dt);
        z.walkPhase += dt * 1.6;
        z.fireTimer -= dt;
        if (z.fireTimer <= 0) { z.fireTimer = 7; fireOccupy(z); }
        continue;
      }

      z.groanTimer -= dt;
      if (z.groanTimer <= 0) { z.groanTimer = rand(6, 14); if (Math.random() < 0.5) SFX.groan(); }

      const slowIce = z.slowUntil > G.time ? 0.45 : 1;
      const onStink = stinkAt(z.row, z.x);
      z.onStink = onStink;
      const slow = slowIce * (onStink ? 0.55 : 1);

      // 订正本：周期性冲刺
      let dashMul = 1;
      if (z.type === 'dash') {
        z.dashTimer -= dt;
        if (z.dashTimer <= 0) {
          z.dashTimer = rand(2.4, 3.6);
          z.dashUntil = G.time + 0.8;
          tone(520, 0.07, 'sawtooth', 0.05, 300);
        }
        if (z.dashUntil > G.time) dashMul = 2.5;
      }
      const target = plantAhead(z);
      let mag = null;
      if (!target) {
        for (const m of G.maggots) {
          if (m.row !== z.row) continue;
          const d = m.x - z.x;
          if (d > -26 && d < 26) { mag = m; break; }
        }
      }
      if (target) {
        z.eating = true;
        z.walkPhase += dt * 6;
        target.hp -= z.dps * dt;
        target.flash = 1;
        if (Math.random() < dt * 6) {
          burst(target.x + rand(-10, 10), target.y + rand(-10, 14), 1, '#e8e0c8', 60, 3, 0.4);
        }
      } else if (mag) {
        // 前方是友方蛆虫：啃它
        z.eating = true;
        z.walkPhase += dt * 6;
        mag.hp -= z.dps * dt;
        mag.flash = 1;
        if (Math.random() < dt * 6) {
          burst(mag.x + rand(-8, 8), mag.y + rand(-8, 2), 1, '#e8e4c8', 60, 3, 0.4);
        }
      } else {
        z.eating = false;
        z.walkPhase += dt * 6 * slow;
        z.x -= z.speed * slow * dashMul * dt;
      }

      // 触发小推车
      if (z.x < gx + 16) {
        const m = G.mowers.find(mm => mm.row === z.row && mm.alive && !mm.running);
        if (m) { m.running = true; SFX.mower(); }
      }
      // 失败判定
      if (z.x < gx - 34) {
        const m = G.mowers.find(mm => mm.row === z.row && mm.alive);
        if (!m && !G.sandbox) { gameOver(); }
      }
    }

    /* --- 占课子弹（BOSS 吴红肠） --- */
    for (let i = G.ckbs.length - 1; i >= 0; i--) {
      const b = G.ckbs[i];
      b.x -= b.speed * dt;
      b.spin += dt * 7;
      if (b.x < gx - 40) { G.ckbs.splice(i, 1); continue; }

      let hp = null;
      for (const p of G.plants) {
        if (p.row !== b.row) continue;
        if (Math.abs(p.x - b.x) < 30) { if (!hp || p.x > hp.x) hp = p; }
      }
      let hm = null;
      if (!hp) {
        for (const m of G.maggots) {
          if (m.row !== b.row) continue;
          if (Math.abs(m.x - b.x) < 28) { hm = m; break; }
        }
      }
      if (hp || hm) {
        let x;
        if (hp) { x = hp.x; removePlant(hp); }
        else {
          x = hm.x;
          burst(hm.x, hm.y - 6, 12, '#efe8cc', 130, 4, 0.5);
          G.maggots.splice(G.maggots.indexOf(hm), 1);
        }
        occupyCell(x, b.row);
        G.ckbs.splice(i, 1);
      }
    }

    /* --- 蛆虫（友方单位） --- */
    G.stinks = G.stinks.filter(st => st.until > G.time);
    G.flops = G.flops.filter(f => f.until > G.time);
    for (let i = G.maggots.length - 1; i >= 0; i--) {
      const m = G.maggots[i];
      m.flash = Math.max(0, m.flash - dt * 5);
      m.walkPhase += dt * (m.eating ? 10 : 7);
      let foe = null;
      for (const z of G.zombies) {
        if (z.dead || z.row !== m.row) continue;
        const d = z.x - m.x;
        if (d > 4 && d < 42) { if (!foe || z.x < foe.x) foe = z; }
      }
      if (foe) {
        // 前方有敌人：暂停爬动，开啃
        m.eating = true;
        damageZombie(foe, 30 * dt, false, true);
      } else {
        m.eating = false;
        m.x += 30 * dt;
        if (m.x > W + 40) { G.maggots.splice(i, 1); continue; }
      }
      if (m.hp <= 0) {
        burst(m.x, m.y - 6, 14, '#efe8cc', 130, 4, 0.55);
        burst(m.x, m.y - 10, 6, '#c9bd90', 90, 3, 0.5);
        G.maggots.splice(i, 1);
      }
    }

    /* --- 小推车 --- */
    for (const m of G.mowers) {
      if (!m.alive) continue;
      if (m.running) {
        m.x += 620 * dt;
        m.spin += dt * 26;
        for (const z of G.zombies) {
          if (!z.dead && !z.dying && z.type !== 'boss' && z.row === m.row && Math.abs(z.x - m.x) < 52) {
            z.hp = 0;
            killZombie(z);
            burst(z.x, z.y - 40, 12, '#e8e0c8', 160, 4, 0.5);
          }
        }
        if (m.x > W + 70) m.alive = false;
      }
    }

    /* --- 墨水滴 --- */
    for (let i = G.suns.length - 1; i >= 0; i--) {
      const s = G.suns[i];
      s.spin += dt * 0.9;
      if (s.fall && s.y < s.targetY) {
        s.y += 72 * dt;
        if (s.y >= s.targetY) s.y = s.targetY;
      } else {
        s.life -= dt;
      }
      s.scale = Math.min(1, s.scale + dt * 4.5);
      if (s.life <= 0) G.suns.splice(i, 1);
    }

    updateFx(dt);

    /* --- 胜利 --- */
    if (G.waves.length > 0 && G.waveIndex >= G.waves.length && G.pending.length === 0 && G.zombies.length === 0 && G.mode === 'playing') {
      G.mode = 'win';
      G.endTimer = 0;
      SFX.win();
    }
  }

  function updateFx(dt) {
    for (let i = G.parts.length - 1; i >= 0; i--) {
      const p = G.parts[i];
      p.life -= dt;
      if (p.life <= 0) { G.parts.splice(i, 1); continue; }
      p.vy += p.grav * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
    for (let i = G.rings.length - 1; i >= 0; i--) {
      G.rings[i].life -= dt;
      if (G.rings[i].life <= 0) G.rings.splice(i, 1);
    }
    for (let i = G.floats.length - 1; i >= 0; i--) {
      const f = G.floats[i];
      f.life -= dt;
      f.y -= dt * 26;
      if (f.life <= 0) G.floats.splice(i, 1);
    }
  }

  function plantAhead(z) {
    const front = z.x - 22;
    const col = Math.floor((front - gx) / cellW);
    if (col < 0 || col >= cols) return null;
    const p = G.grid[z.row * cols + col];
    if (!p) return null;
    if (front <= p.x + 26) return p;
    return null;
  }

  function stinkAt(row, x) {
    const col = Math.floor((x - gx) / cellW);
    for (const st of G.stinks) {
      if (st.until <= G.time) continue;
      for (const c of st.cells) {
        if (c.col === col && c.row === row) return true;
      }
    }
    return false;
  }

  /* ---- 超然：前方一格索敌 / 出拳 / 亡语 ---- */
  const CHAORAN_PUNCH_DMG = 13;           // 铅笔子弹(26)的一半
  function chaoranTargets(p) {
    const col = p.col + 1;
    if (col >= cols) return [];
    const cxc = gx + col * cellW + cellW / 2;
    const out = [];
    for (const z of G.zombies) {
      if (z.dead || z.dying) continue;
      const isBoss = z.type === 'boss';   // BOSS 贯穿五行，同样会被拳头招呼
      if (!isBoss && z.row !== p.row) continue;
      const hw = isBoss ? 54 : 26;
      if (z.x + hw > cxc - cellW / 2 && z.x - hw < cxc + cellW / 2) out.push(z);
    }
    return out;
  }
  function chaoranPunch(p) {
    const ts = chaoranTargets(p);
    const fx = p.x + cellW * 0.62, fy = p.y - 4;
    for (const z of ts) {
      damageZombie(z, CHAORAN_PUNCH_DMG);
      if (z.type !== 'boss' || z.hp > 0) burst(fx + 10, fy, 6, '#ffe3b0', 150, 3.5, 0.3);
    }
    ring(fx, fy, 4, 22, 'rgba(255,220,150,.8)', 0.18);
    tone(rand(200, 260), 0.05, 'square', 0.05, 130);
  }
  function chaoranLastWord(p) {
    removePlant(p);
    const roll = Math.random();
    if (roll < 1 / 3) {
      // 亡语一：往原地吐呕吐物（踩上去减速）
      G.stinks.push({ cells: [{ col: p.col, row: p.row, seed: rand(0, 10) }], until: G.time + 12, kind: 'vomit' });
      G.floats.push({ x: p.x, y: p.y - 34, text: '肠胃炎！', life: 1.7, max: 1.7 });
      burst(p.x, p.y + 14, 20, '#9fc557', 140, 5, 0.7);
      tone(150, 0.32, 'sawtooth', 0.07, 70);
    } else {
      // 亡语二：倒地不起，脚肿得特别大
      G.flops.push({ col: p.col, row: p.row, x: p.x, y: p.y, born: G.time, until: G.time + 12, seed: rand(0, 10) });
      G.floats.push({ x: p.x, y: p.y - 34, text: '馒头！', life: 1.7, max: 1.7 });
      tone(110, 0.28, 'triangle', 0.08, 60);
    }
  }

  function fire(p) {
    const ice = p.type === 'snowpea';
    const staple = p.type === 'stapler';
    const btype = ice ? 'wind' : (p.type === 'repeater' ? 'ink' : (staple ? 'staple' : 'pencil'));
    G.peas.push({
      x: p.x + 24, y: p.y - 16, row: p.row,
      speed: staple ? 640 : (ice ? 420 : 400),
      dmg: staple ? 16 : (ice ? 22 : 26),
      ice, btype,
      pierce: staple ? 3 : 0,
      hitIds: null
    });
    p.recoil = 1;
    SFX.shoot();
  }

  /* ---- BOSS 吴红肠：占课子弹与占课结算 ---- */
  function fireOccupy(z) {
    const row = randi(0, rows - 1);
    const y = cellCY(row) + 24;
    G.ckbs.push({ x: z.x - 54, y, row, speed: 330, spin: rand(0, TAU) });
    burst(z.x - 54, y, 10, '#ff6a4d', 130, 4, 0.45);
    ring(z.x - 54, y, 6, 30, '#ff8a70', 0.35);
    tone(210, 0.16, 'sawtooth', 0.06, 110);
  }

  // 被占课的格子：友方单位消失，原地长出一份普通作业
  function occupyCell(x, row) {
    const col = clamp(Math.round((x - gx - cellW / 2) / cellW), 0, cols - 1);
    const zz = spawnZombie('normal', row);
    zz.x = cellCX(col) + 8;
    zz.y = cellCY(row) + 44;
    zz.walkPhase = rand(0, TAU);
    zz.flash = 1;
    G.floats.push({ x: cellCX(col), y: cellCY(row) - 26, text: '占课！', life: 1.4, max: 1.4 });
    burst(zz.x, cellCY(row) + 6, 16, '#ffe9a8', 170, 5, 0.6);
    ring(zz.x, cellCY(row) + 18, 8, cellW * 0.62, '#ffd166', 0.5);
    tone(240, 0.16, 'square', 0.07, 150);
  }

  // 统一死亡处理：BOSS 不立刻消失，而是缓缓退场
  function killZombie(z) {
    if (z.dead || z.dying) return;
    if (z.type === 'boss') {
      z.hp = 0;
      z.dying = true;
      z.dieT = 3.0;
      G.killed++;
      burst(z.x, z.y - 80, 26, '#c8402f', 220, 7, 1.0);
      burst(z.x, z.y - 60, 16, '#f0a08c', 180, 5, 0.9);
      ring(z.x, z.y - 60, 20, cellW * 1.6, '#ff8a70', 0.8);
      G.shake = Math.max(G.shake, 14);
      SFX.boom();
      return;
    }
    z.dead = true;
    G.killed++;
  }

  function damageZombie(z, dmg, ice, silent) {
    if (z.dead || z.dying) return;
    if (ice && z.type !== 'boss') z.slowUntil = G.time + 5;
    if (z.armor > 0) {
      z.armor -= dmg;
      if (z.armor < 0) { z.hp += z.armor; z.armor = 0; }
    } else {
      z.hp -= dmg;
    }
    z.flash = 0.6;
    if (!silent && Math.random() < 0.4) SFX.hit();
    if (z.hp <= 0) {
      killZombie(z);
      burst(z.x, z.y - 40, 14, '#f0ead8', 150, 4, 0.6);
      burst(z.x, z.y - 50, 6, '#d8d2c0', 110, 3, 0.5);
      if (!silent) G.shake = Math.max(G.shake, 3);
    }
  }

  function explode(x, y, radiusCells, dmg, row) {
    const rad = radiusCells * cellW;
    ring(x, y, 10, rad * 1.15, '#f5e7cf', 0.55);
    ring(x, y, 10, rad * 0.8, '#eec9d8', 0.45);
    burst(x, y, 40, '#fdf3df', 320, 7, 0.8);
    burst(x, y, 24, '#f3ddb0', 260, 6, 0.7);
    burst(x, y, 14, '#e89bc3', 200, 5, 0.7);
    for (const z of G.zombies) {
      if (z.dead || z.dying) continue;
      if (Math.hypot(z.x - x, z.y - 40 - y) < rad) {
        z.armor = 0;
        z.hp -= dmg;
        z.flash = 1;
        if (z.hp <= 0) killZombie(z);
      }
    }
    // 爆炸范围 3x3 格子留下臭酸奶（持续 12 秒）
    const cc = clamp(Math.round((x - gx - cellW / 2) / cellW), 0, cols - 1);
    const rr0 = clamp(row == null ? Math.round((y - gy - cellH / 2) / cellH) : row, 0, rows - 1);
    const cells = [];
    for (let dc = -1; dc <= 1; dc++) {
      for (let dr = -1; dr <= 1; dr++) {
        const col = cc + dc, rw = rr0 + dr;
        if (col >= 0 && col < cols && rw >= 0 && rw < rows) {
          cells.push({ col, row: rw, seed: Math.random() * 10 });
        }
      }
    }
    G.stinks.push({ cells, until: G.time + 12 });
    // 在放置地点生成一只友方蛆虫（血量与墨水瓶相当）
    G.maggots.push({
      row: rr0, x: x, y: cellCY(rr0) + 26,
      hp: 130, maxHp: 130,
      walkPhase: rand(0, TAU), eating: false, flash: 0
    });
  }

  function gameOver() {
    if (G.mode !== 'playing') return;
    G.mode = 'lose';
    G.endTimer = 0;
    SFX.lose();
    G.shake = 20;
  }

  /* ============================================================
     绘制：植物
  ============================================================ */
  function drawInkBottleBody(t, bob, p) {
    ctx.save();
    ctx.translate(0, bob * 0.5);
    ctx.rotate(Math.sin(t * 1.8 + p.anim) * 0.045);
    // 瓶身
    const bg = ctx.createLinearGradient(-17, 0, 17, 0);
    bg.addColorStop(0, '#4a6ea8'); bg.addColorStop(0.45, '#2b3f66'); bg.addColorStop(1, '#18243c');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(-7, -34); ctx.lineTo(-7, -22);
    ctx.quadraticCurveTo(-17, -15, -17, -4);
    ctx.lineTo(-17, 26);
    ctx.quadraticCurveTo(-17, 34, -9, 34);
    ctx.lineTo(9, 34);
    ctx.quadraticCurveTo(17, 34, 17, 26);
    ctx.lineTo(17, -4);
    ctx.quadraticCurveTo(17, -15, 7, -22);
    ctx.lineTo(7, -34);
    ctx.closePath(); ctx.fill();
    // 瓶口墨面（随时间晃动）
    ctx.fillStyle = '#101b30';
    ctx.beginPath(); ctx.ellipse(0, -34, 7, 3, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(120,160,220,.7)';
    ctx.beginPath(); ctx.ellipse(-2, -33.4, 4, 1.5, 0, 0, TAU); ctx.fill();
    // 玻璃高光
    ctx.fillStyle = 'rgba(255,255,255,.28)';
    ctx.beginPath();
    ctx.moveTo(-12, -10);
    ctx.quadraticCurveTo(-14, 6, -9, 24);
    ctx.lineTo(-5, 24);
    ctx.quadraticCurveTo(-9, 4, -8, -11);
    ctx.closePath(); ctx.fill();
    // 标签
    ctx.fillStyle = '#f3ecd8';
    rr(-12, 0, 24, 24, 4); ctx.fill();
    ctx.strokeStyle = 'rgba(60,40,20,.35)'; ctx.lineWidth = 1.2;
    rr(-12, 0, 24, 24, 4); ctx.stroke();
    ctx.fillStyle = '#20304f';
    ctx.font = 'bold 10px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('墨水', 0, 8);
    // 表情（玻璃上）
    ctx.fillStyle = '#eaf2ff';
    ctx.beginPath(); ctx.ellipse(-5.5, -13, 3.2, 4, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(5.5, -13, 3.2, 4, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#16233f';
    ctx.beginPath(); ctx.arc(-4.5, -12.5, 1.7, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(6.5, -12.5, 1.7, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#eaf2ff'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, -8, 4, 0.3, Math.PI - 0.3); ctx.stroke();
    ctx.restore();
  }

  function drawPencilBody(t, bob, p) {
    ctx.save();
    ctx.translate(-2, 10 + bob * 0.6);
    ctx.rotate(-0.62 + Math.sin(t * 2 + p.anim) * 0.03);
    const rec = (p.recoil || 0) * 5;
    // 橡皮头（粉）
    ctx.fillStyle = '#ef8fa4';
    rr(-27, -7.5, 10, 15, 5); ctx.fill();
    // 金属箍
    const fg = ctx.createLinearGradient(0, -7.5, 0, 7.5);
    fg.addColorStop(0, '#e8ecf2'); fg.addColorStop(1, '#9aa3b0');
    ctx.fillStyle = fg;
    rr(-18, -8, 9, 16, 2); ctx.fill();
    ctx.strokeStyle = 'rgba(80,90,105,.6)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-14, -8); ctx.lineTo(-14, 8); ctx.stroke();
    // 笔杆（黄色六棱）
    const sg = ctx.createLinearGradient(0, -7.5, 0, 7.5);
    sg.addColorStop(0, '#f6ca46'); sg.addColorStop(1, '#d5991f');
    ctx.fillStyle = sg;
    rr(-9, -7.5, 34, 15, 3); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-7, -3.2); ctx.lineTo(22, -3.2); ctx.stroke();
    ctx.strokeStyle = 'rgba(130,88,12,.4)';
    ctx.beginPath(); ctx.moveTo(-7, 3.2); ctx.lineTo(22, 3.2); ctx.stroke();
    // 木质笔尖
    ctx.fillStyle = '#ecd0a4';
    ctx.beginPath();
    ctx.moveTo(25, -7.5); ctx.lineTo(38 - rec, -2.4); ctx.lineTo(38 - rec, 2.4); ctx.lineTo(25, 7.5);
    ctx.closePath(); ctx.fill();
    // 笔芯
    ctx.fillStyle = '#2b2b33';
    ctx.beginPath();
    ctx.moveTo(38 - rec, -2.4); ctx.lineTo(44 - rec, 0); ctx.lineTo(38 - rec, 2.4);
    ctx.closePath(); ctx.fill();
    // 眼睛（笔杆上）
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(2, -2.8, 4.2, 4.8, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2b2b2b';
    ctx.beginPath(); ctx.arc(4, -2.6, 2.2, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(5, -3.6, 0.8, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawEraserBody(t, bob, p) {
    const frac = p.hp / p.maxHp;
    ctx.save();
    ctx.translate(0, bob * 0.5);
    // 白色橡皮主体（竖放）
    const eg = ctx.createLinearGradient(-20, 0, 20, 0);
    eg.addColorStop(0, '#ffffff'); eg.addColorStop(1, '#ddd6c6');
    ctx.fillStyle = eg;
    rr(-20, -34, 40, 64, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(120,110,90,.35)'; ctx.lineWidth = 1.5;
    rr(-20, -34, 40, 64, 8); ctx.stroke();
    // 纸套（中段蓝色）
    const sg = ctx.createLinearGradient(0, -14, 0, 16);
    sg.addColorStop(0, '#7fa8e8'); sg.addColorStop(1, '#4a6fa8');
    ctx.fillStyle = sg;
    rr(-20, -14, 40, 30, 4); ctx.fill();
    ctx.fillStyle = '#4a6fa8';
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.moveTo(-20 + i * 8, -14);
      ctx.lineTo(-16 + i * 8, -19);
      ctx.lineTo(-12 + i * 8, -14);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.font = 'bold 9px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('橡皮', 0, 1);
    // 表情（上部白色区）
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-8, -24, 6, 7, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8, -24, 6, 7, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(120,110,90,.5)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(-8, -24, 6, 7, 0, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(8, -24, 6, 7, 0, 0, TAU); ctx.stroke();
    ctx.fillStyle = '#31200d';
    ctx.beginPath(); ctx.arc(-7, -23, 3, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(9, -23, 3, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#31200d'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.beginPath();
    if (frac > 0.5) ctx.arc(0, -14, 7, 0.35, Math.PI - 0.35);
    else ctx.arc(0, -6, 7, 0.35, Math.PI - 0.35);
    ctx.stroke();
    // 磨损：碎屑与缺口
    if (frac < 0.66) {
      ctx.fillStyle = '#e8e2d4';

      ctx.fillStyle = 'rgba(200,190,170,.9)';

      ctx.fillStyle = 'rgba(200,190,170,.9)';
      ctx.beginPath(); ctx.moveTo(20, 30); ctx.lineTo(12, 30); ctx.lineTo(17, 22); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-20, 8); ctx.lineTo(-13, 12); ctx.lineTo(-20, 18); ctx.closePath(); ctx.fill();

  function drawWindowBody(t, bob, p) {
    ctx.save();
    ctx.translate(0, 2 + bob * 0.5);
    // 开窗幅度：射击瞬间 recoil=1，随后衰减 -> 窗扇打开再合上
    const op = p.recoil || 0;
    const open = Math.pow(op, 0.7);
    const ang = open * 1.2;

    // 木外框
    const fg = ctx.createLinearGradient(0, -44, 0, 30);
    fg.addColorStop(0, '#9a7a50'); fg.addColorStop(1, '#6f5233');
    ctx.fillStyle = fg;
    rr(-27, -44, 54, 70, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(60,40,20,.4)'; ctx.lineWidth = 1.5;
    rr(-27, -44, 54, 70, 7); ctx.stroke();

    // 右半：室内（开窗时露出，带暖灯光）
    const ig = ctx.createLinearGradient(0, -39, 0, 21);
    ig.addColorStop(0, '#4a3826'); ig.addColorStop(1, '#1c130a');
    ctx.fillStyle = ig;
    ctx.fillRect(0, -39, 22, 60);
    if (open > 0.05) {
      ctx.globalAlpha = 0.35 + open * 0.35;
      const lamp = ctx.createRadialGradient(12, -4, 2, 12, -4, 20);
      lamp.addColorStop(0, 'rgba(255,205,130,.6)'); lamp.addColorStop(1, 'rgba(255,205,130,0)');
      ctx.fillStyle = lamp;
      ctx.fillRect(0, -39, 22, 60);
      ctx.globalAlpha = 1;
    }

    // ---- 左窗扇（固定） ----
    const gg = ctx.createLinearGradient(0, -40, 0, 22);
    gg.addColorStop(0, '#d6f1fc'); gg.addColorStop(1, '#7fc4e8');
    ctx.fillStyle = gg;
    rr(-22, -39, 22, 60, 4); ctx.fill();
    ctx.save();
    ctx.beginPath(); rr(-22, -39, 22, 60, 4); ctx.clip();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = '#fff';
    ctx.save(); ctx.rotate(-0.5);
    ctx.fillRect(-40, -14, 14, 90);
    ctx.restore();
    ctx.globalAlpha = 0.4 + Math.sin(t * 2.2 + p.anim) * 0.2;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4;
    [[-14, -30], [-10, 6]].forEach(([fx, fy], i) => {
      const r = 4 + i;
      for (let k = 0; k < 3; k++) {
        const a = k / 3 * Math.PI + t * 0.3;
        ctx.beginPath();
        ctx.moveTo(fx - Math.cos(a) * r, fy - Math.sin(a) * r);
        ctx.lineTo(fx + Math.cos(a) * r, fy + Math.sin(a) * r);
        ctx.stroke();
      }
    });
    ctx.restore();
    ctx.fillStyle = '#8a6a45';
    ctx.fillRect(-22, -9, 22, 5);           // 左扇横棂
    ctx.strokeStyle = '#8a6a45'; ctx.lineWidth = 3;
    rr(-22, -39, 22, 60, 4); ctx.stroke();  // 左扇边框

    // ---- 右窗扇（绕中央竖直铰链向外打开） ----
    ctx.save();
    ctx.translate(open * 6, 0);              // 向外飘出一点
    ctx.scale(Math.max(Math.cos(ang), 0.08), 1);  // 3D 开合的透视压缩
    ctx.fillStyle = gg;
    rr(0, -39, 22, 60, 4); ctx.fill();
    ctx.save();
    ctx.beginPath(); rr(0, -39, 22, 60, 4); ctx.clip();
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#fff';
    ctx.save(); ctx.rotate(-0.5);
    ctx.fillRect(0, -20, 12, 90);
    ctx.restore();
    ctx.restore();
    ctx.fillStyle = '#8a6a45';
    ctx.fillRect(0, -9, 22, 5);              // 右扇横棂
    ctx.strokeStyle = '#8a6a45'; ctx.lineWidth = 3;
    rr(0, -39, 22, 60, 4); ctx.stroke();     // 右扇边框
    ctx.fillStyle = '#5c452c';
    ctx.fillRect(17.5, -37, 3.5, 56);        // 扇外侧边（厚度感）
    // 扇把手
    ctx.fillStyle = '#cfd6dd';
    ctx.beginPath(); ctx.arc(4, -2, 2.4, 0, TAU); ctx.fill();
    ctx.restore();
    // 铰链侧阴影（开窗时）
    if (open > 0.05) {
      ctx.globalAlpha = open * 0.4;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, -39, 4, 60);
      ctx.globalAlpha = 1;
    }

    // 冷风从打开的窗口涌出
    if (open > 0.22) {
      ctx.globalAlpha = open * 0.85;
      ctx.strokeStyle = '#eaf7ff'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      for (let k = 0; k < 3; k++) {
        const ph2 = t * 8 + k * 2.1;
        const r2 = 3.5 + k * 2.5;
        ctx.beginPath();
        ctx.arc(25 + k * 10, -16 - k * 7 + Math.sin(ph2) * 2.5, r2, -1.1 + Math.sin(ph2) * 0.4, 1.3 + Math.sin(ph2) * 0.4);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // 中缝窗棂
    ctx.fillStyle = '#8a6a45';
    ctx.fillRect(-2, -39, 4, 60);
    // 窗台
    ctx.fillStyle = '#a3805a';
    rr(-32, 26, 64, 9, 4); ctx.fill();
    // 顶部寒气
    ctx.globalAlpha = 0.30 + Math.sin(t * 2.6 + p.anim) * 0.12;
    ctx.fillStyle = '#eaf7ff';
    ctx.beginPath(); ctx.ellipse(-16, -48, 9, 4, -0.3, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8, -50, 11, 5, 0.2, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    // 眼睛（左扇玻璃上）
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-14, -24, 4.4, 5.2, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-5, -24, 4.4, 5.2, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#274a63';
    ctx.beginPath(); ctx.arc(-12.5, -23, 2.2, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(-3.5, -23, 2.2, 0, TAU); ctx.fill();
    ctx.restore();
  }

    ctx.restore();

  function drawYogurtBody(t, bob, p) {
    const fuse = p.timer / 1.1;
    const pulse = 1 + Math.sin(t * (16 + (1 - fuse) * 26)) * 0.07 * (1 - fuse * 0.4);
    ctx.save();
    ctx.translate(0, 4 + bob * 0.4);
    ctx.scale(pulse, pulse);
    // 杯体
    const cg = ctx.createLinearGradient(-16, 0, 16, 0);
    cg.addColorStop(0, '#fff8ef'); cg.addColorStop(0.5, '#f7e6d2'); cg.addColorStop(1, '#e9cdb2');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.moveTo(-16, -16); ctx.lineTo(16, -16);
    ctx.lineTo(12, 30); ctx.lineTo(-12, 30);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(160,110,70,.3)'; ctx.lineWidth = 1.4;
    ctx.stroke();
    // 果酱横带
    ctx.fillStyle = '#f2a7c3';
    ctx.beginPath();
    ctx.moveTo(-15.2, 0); ctx.lineTo(15.2, 0); ctx.lineTo(14, 14); ctx.lineTo(-14, 14);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.font = 'bold 9px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('酸奶', 0, 7);
    // 锡箔盖（发酵鼓起）
    const bulge = (1 - fuse) * 7 + Math.sin(t * 20) * 1.6;
    ctx.fillStyle = '#d9dee8';
    ctx.beginPath(); ctx.ellipse(0, -17 - bulge * 0.5, 17, 7 + bulge, 0, Math.PI, TAU); ctx.fill();
    ctx.fillStyle = '#c3cad6';
    ctx.beginPath(); ctx.ellipse(0, -17, 17, 4, 0, 0, Math.PI); ctx.fill();
    // 冒出的气泡
    for (let i = 0; i < 3; i++) {
      const bt = (t * (1.5 + i * 0.4) + i * 2.1) % 1;
      ctx.globalAlpha = (1 - bt) * 0.7;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(Math.sin(i * 5 + t * 2) * 6, -22 - bulge - bt * 14, 2.2 + i * 0.5, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // 表情（气鼓鼓）
    ctx.strokeStyle = '#8a4a3a'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-11, -9); ctx.lineTo(-3, -5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(11, -9); ctx.lineTo(3, -5); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-6, -3, 3.4, 3.8, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(6, -3, 3.4, 3.8, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5a2a20';
    ctx.beginPath(); ctx.arc(-6, -2.4, 1.7, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -2.4, 1.7, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawRulerBody(t, bob, p) {
    const sw = p.sweep || 0;
    ctx.save();
    ctx.translate(0, bob * 0.5);
    ctx.rotate(sw * Math.sin(t * 22) * 0.4);
    // 尺身（半透明黄色塑料）
    const rg = ctx.createLinearGradient(-16, 0, 16, 0);
    rg.addColorStop(0, 'rgba(255,241,186,.96)');
    rg.addColorStop(0.5, 'rgba(255,214,116,.96)');
    rg.addColorStop(1, 'rgba(206,158,50,.96)');
    ctx.fillStyle = rg;
    rr(-16, -42, 32, 76, 5); ctx.fill();
    ctx.strokeStyle = 'rgba(140,100,20,.45)'; ctx.lineWidth = 1.4;
    rr(-16, -42, 32, 76, 5); ctx.stroke();
    // 刻度
    ctx.strokeStyle = 'rgba(120,85,10,.6)'; ctx.lineWidth = 1.2;
    for (let i = 0; i < 9; i++) {
      const yy = -38 + i * 8;
      const len = i % 2 === 0 ? 10 : 5;
      ctx.beginPath(); ctx.moveTo(-13, yy); ctx.lineTo(-13 + len, yy); ctx.stroke();
    }
    // 眼睛
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-6, -24, 5.2, 6, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(6, -24, 5.2, 6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#3a2a08';
    ctx.beginPath(); ctx.arc(-5, -23, 2.4, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(7, -23, 2.4, 0, TAU); ctx.fill();
    // 嘴（认真抿着）
    ctx.strokeStyle = '#3a2a08'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-6, -6); ctx.lineTo(6, -6); ctx.stroke();
    ctx.restore();
  }

    ctx.beginPath(); ctx.ellipse(7, -10, 5.4, 6.2, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#16222e';
