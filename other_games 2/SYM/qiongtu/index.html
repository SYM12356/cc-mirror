/* ============================================================
   核心引擎：状态、牌组、检定、效果、营地、终局、存档、模拟
   ============================================================ */

const Game = (() => {

  const SAVE_KEY = 'qiongtu.save.v1';
  const BEST_KEY = 'qiongtu.best.v1';
  const SETTINGS_KEY = 'qiongtu.settings.v1';
  const ENDING_RANK = { extinguish:0, ember:1, spark:2, dawn:3 };

  let S = null;
  let simMode = false;
  let demoMode = false;
  let uidSeq = 1;

  /* ---------------- 基础工具 ---------------- */

  function rand(){
    S.rng = (S.rng + 0x6D2B79F5) | 0;
    let t = S.rng;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  function randDie(){ return 1 + Math.floor(rand() * 6); }
  function pick(arr){ return arr[Math.floor(rand() * arr.length)]; }
  function uid(prefix){ return (prefix || 'c') + (uidSeq++); }

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(rand() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function sample(arr, n){
    if(n >= arr.length) return shuffle(arr);
    return shuffle(arr).slice(0, n);
  }

  function cardOf(inst){ return CARD_BY_ID[inst.id]; }
  function isUpgraded(inst){ return !!inst.up; }
  function cardData(inst){
    const base = CARD_BY_ID[inst.id];
    if(!base) return null;
    if(inst.up && base.up){
      return Object.assign({}, base, base.up, { baseId:base.id, upgraded:true });
    }
    return Object.assign({}, base, { upgraded:false });
  }
  function cardEffects(inst, key){
    const d = cardData(inst);
    if(!d) return [];
    if(key) return d[key] || [];
    return d.effects || [];
  }

  function log(text, type, stamp){
    if(!S) return;
    S.log.push({ seg:S.seg, text, type:type||'info', stamp:stamp||'', t:Date.now() });
    if(S.log.length > 120) S.log.shift();
  }

  function clampRes(key, val){
    const r = S.res;
    if(key === 'seeds') return Math.max(0, val);
    const maxKey = key + 'Max';
    const max = r[maxKey] != null ? r[maxKey] : 99;
    return Math.max(0, Math.min(max, val));
  }

  function addRes(key, n){
    if(!(key in S.res)) return 0;
    const before = S.res[key];
    const next = clampRes(key, before + n);
    S.res[key] = next;
    return next - before;
  }

  function actOfSeg(seg){
    if(seg <= 6) return 1;
    if(seg <= 13) return 2;
    return 3;
  }

  function actMeta(act){
    return BALANCE.acts.find(a => a.no === act) || BALANCE.acts[0];
  }

  function isClimaxSeg(seg){ return BALANCE.climaxSegs.indexOf(seg) >= 0; }

  function aliveCrew(){ return S.crew.filter(c => c.alive); }
  function injuredCrew(){ return S.crew.filter(c => c.alive && c.injured); }

  /* ---------------- 初始状态 / 牌组 ---------------- */

  function createState(seed, crewIds){
    const res = Object.assign({}, BALANCE.start);
    return {
      v: 1,
      seed: seed >>> 0,
      rng: seed >>> 0,
      phase: 'route',
      act: 1,
      seg: 0,
      maxSeg: BALANCE.segments,
      res,
      crew: crewIds.map(id => ({ id, injured:false, alive:true })),
      deck: [],
      hand: [],
      discard: [],
      exhausted: [],
      ap: BALANCE.ap,
      apMax: BALANCE.ap,
      selected: null,
      routeOptions: [],
      route: null,
      crisis: null,
      approach: null,
      played: [],
      roll: null,
      rerolled: false,
      freeReroll: false,
      crisisEase: 0,
      scoutNext: false,
      rewardOptions: [],
      camp: null,
      finale: { active:false, stage:0, successes:0, results:[] },
      settle: { built:[] },
      endingId: null,
      endingReason: '',
      log: [],
      flags: { emergencyUsed:false, tutorialSeen:false },
      stats: { checks:0, success:0, great:0, fail:0, crit:0, damage:0, cardsPlayed:0 },
      weather: '',
      radio: '',
      lastCrisisIds: [],
      bestEnding: getBestEnding(),
      startedAt: Date.now(),
      savedAt: 0
    };
  }

  function buildDeck(){
    const ids = [];
    BASIC_CARD_IDS.forEach(id => {
      for(let i = 0; i < BALANCE.deckBasicsCopies; i++) ids.push(id);
    });
    S.crew.forEach(c => {
      const crew = CREW_BY_ID[c.id];
      if(crew && crew.sig) ids.push(crew.sig);
    });
    S.deck = shuffle(ids.map(id => ({ uid:uid('k'), id, up:false })));
  }

  function newRun(crewIds, seed, opts){
    const chosen = (crewIds && crewIds.length === 2) ? crewIds : ['ahe','tiepi'];
    const s = (seed == null)
      ? ((Date.now() ^ Math.floor(Math.random() * 0xFFFFFFFF)) >>> 0)
      : (seed >>> 0);
    S = createState(s, chosen);
    uidSeq = 1;
    buildDeck();
    if(!opts || !opts.silent) log('出发。老骡的发动机响了一声，又响了一声。', 'info');
    beginSegment();
    return S;
  }

  function beginSegment(){
    if(!S) return;
    if(S.seg >= S.maxSeg){ enterFinale(); return; }
    S.seg += 1;
    const newAct = actOfSeg(S.seg);
    const oldAct = S.act;
    S.act = newAct;
    S.phase = 'route';
    S.route = null;
    S.crisis = null;
    S.approach = null;
    S.played = [];
    S.roll = null;
    S.ap = BALANCE.ap;
    S.rewardOptions = [];
    const pool = ROUTES.filter(r => r.act === newAct);
    S.routeOptions = sample(pool, 2);
    S.weather = pick(WEATHER[newAct] || WEATHER[1]);
    S.radio = pick(RADIO[newAct] || RADIO[1]);
    if(oldAct !== newAct){
      log(`进入第${['','一','二','三'][newAct]}幕：${actMeta(newAct).name}。`, 'info');
    }
    log(`第 ${S.seg} 段。${S.weather}。${S.radio}。`, 'info');
    save();
  }

  /* ---------------- 路线 / 前进 ---------------- */

  function chooseRoute(routeId){
    if(!S || S.phase !== 'route') return { ok:false, reason:'phase' };
    const route = S.routeOptions.find(r => r.id === routeId);
    if(!route) return { ok:false, reason:'route' };
    if(S.res.fuel < route.fuel) return { ok:false, reason:'fuel' };
    S.res.fuel = clampRes('fuel', S.res.fuel - route.fuel);
    // 口粮
    if(S.res.food >= BALANCE.foodPerSeg){
      S.res.food = clampRes('food', S.res.food - BALANCE.foodPerSeg);
    } else {
      S.res.food = 0;
      S.res.hull = clampRes('hull', S.res.hull - 1);
      S.res.morale = clampRes('morale', S.res.morale - 1);
      log('车上没有吃的了。饿着肚子赶路，车和人都抖得厉害。', 'bad');
    }
    S.route = route;
    log(`走上${route.name}。${route.desc}`, 'info');
    startCrisis();
    save();
    return { ok:true };
  }

  function emergencyFuel(){
    if(!S || S.flags.emergencyUsed) return { ok:false, reason:'used' };
    if(S.res.hull <= BALANCE.emergencyHullCost) return { ok:false, reason:'hull' };
    S.flags.emergencyUsed = true;
    S.res.hull = clampRes('hull', S.res.hull - BALANCE.emergencyHullCost);
    S.res.fuel = clampRes('fuel', S.res.fuel + BALANCE.emergencyFuelGain);
    log('拆东墙：从车身上拆下能烧的东西，换了两个油。', 'bad');
    save();
    return { ok:true };
  }

  function chooseCrisisForSegment(){
    const act = S.act;
    if(isClimaxSeg(S.seg)){
      const c = CRISES.find(x => x.act === act && x.climax);
      if(c) return c;
    }
    const pool = CRISES.filter(c => c.act === act && !c.climax);
    const recent = S.lastCrisisIds.slice(-4);
    const fresh = pool.filter(c => recent.indexOf(c.id) < 0);
    const list = fresh.length ? fresh : pool;
    const bias = (S.route && S.route.bias) ? S.route.bias : [];
    const weights = list.map(c => {
      const hit = c.approaches.some(a => bias.indexOf(a.disc) >= 0);
      return hit ? 2.2 : 1;
    });
    return pickWeighted(rand, list, weights);
  }

  function startCrisis(){
    const c = chooseCrisisForSegment();
    S.crisis = c;
    S.lastCrisisIds.push(c.id);
    if(S.lastCrisisIds.length > 12) S.lastCrisisIds.shift();
    S.phase = 'crisis';
    S.approach = null;
    S.played = [];
    S.roll = null;
    S.rerolled = false;
    S.freeReroll = false;
    S.ap = BALANCE.ap;
    S.selected = null;
    S.crisisEase = S.scoutNext ? 1 : 0;
    S.scoutNext = false;
    drawCards(BALANCE.hand - S.hand.length);
    log(`危机：${c.title}。${c.text}`, 'info');
    save();
  }

  function drawCards(n){
    if(!S || n <= 0) return 0;
    let drawn = 0;
    for(let i = 0; i < n; i++){
      if(!S.deck.length){
        if(!S.discard.length) break;
        S.deck = shuffle(S.discard);
        S.discard = [];
      }
      const card = S.deck.pop();
      if(card){ S.hand.push(card); drawn++; }
    }
    return drawn;
  }

  /* ---------------- 出牌 ---------------- */

  function chooseApproach(index){
    if(!S || S.phase !== 'crisis' || S.approach) return { ok:false };
    const a = S.crisis && S.crisis.approaches[index];
    if(!a) return { ok:false };
    S.approach = a;
    log(`选择应对：${a.label}（${DISC[a.disc].name} ${a.diff}）。`, 'info');
    save();
    return { ok:true };
  }

  function canPlay(uidValue){
    if(!S || S.phase !== 'crisis') return { ok:false, reason:'现在不能出牌' };
    if(!S.approach) return { ok:false, reason:'先选择应对方式' };
    const inst = S.hand.find(c => c.uid === uidValue);
    if(!inst) return { ok:false, reason:'这张牌不在手里' };
    const d = cardData(inst);
    if(!d) return { ok:false, reason:'未知卡牌' };
    if(d.cost > S.ap) return { ok:false, reason:'行动点不足' };
    if(d.resCost){
      for(const k in d.resCost){
        if((S.res[k] || 0) < d.resCost[k]) return { ok:false, reason:`${RES_META[k] ? RES_META[k].name : k}不足` };
      }
    }
    return { ok:true };
  }

  function playCard(uidValue){
    const id = uidValue || S.selected;
    const check = canPlay(id);
    if(!check.ok) return check;
    const idx = S.hand.findIndex(c => c.uid === id);
    const inst = S.hand[idx];
    const d = cardData(inst);
    // 费用
    S.ap -= d.cost;
    if(d.resCost){
      for(const k in d.resCost){
        S.res[k] = clampRes(k, S.res[k] - d.resCost[k]);
      }
    }
    S.hand.splice(idx, 1);
    S.selected = null;
    // 打出即生效的效果
    const instantFx = [];
    (d.effects || []).forEach(fx => {
      if(['bonus','anyBonus','preventDamage','extraDie','ease'].indexOf(fx.type) >= 0) return;
      if(fx.type === 'reroll'){ S.freeReroll = true; return; }
      instantFx.push(fx);
    });
    const summary = applyEffects(instantFx, { source:'card' });
    S.played.push(inst);
    S.stats.cardsPlayed++;
    log(`打出「${d.name}」${summary ? '：' + summary : ''}。`, 'info');
    if(checkDefeat()) return { ok:true, defeat:true };
    save();
    return { ok:true };
  }

  function selectCard(uidValue){
    if(!S || S.phase !== 'crisis') return false;
    if(S.selected === uidValue){
      return playCard(uidValue).ok;
    }
    S.selected = uidValue;
    save();
    return true;
  }

  /* ---------------- 检定 ---------------- */

  function effectActive(fx){
    if(!fx.cond) return true;
    if(fx.cond.moraleMin != null && S.res.morale < fx.cond.moraleMin) return false;
    return true;
  }

  function computeCheck(){
    const a = S.approach;
    const dice = [randDie(), randDie()];
    let extraDice = 0;
    let bonus = 0;
    let ease = 0;
    let prevent = 0;
    let freeReroll = false;
    const breakdown = [];
    S.played.forEach(inst => {
      const d = cardData(inst);
      if(!d) return;
      if(d.sig){
        const owner = S.crew.find(c => c.id === d.sig);
        if(owner && (!owner.alive || owner.injured)) return;
      }
      (d.effects || []).forEach(fx => {
        if(!effectActive(fx)) return;
        if(fx.type === 'bonus'){
          if(fx.disc === a.disc){ bonus += fx.n; breakdown.push(`${d.name} +${fx.n}`); }
        } else if(fx.type === 'anyBonus'){
          bonus += fx.n; breakdown.push(`${d.name} +${fx.n}`);
        } else if(fx.type === 'extraDie'){
          extraDice += 1;
        } else if(fx.type === 'ease'){
          ease += fx.n;
        } else if(fx.type === 'preventDamage'){
          prevent += fx.n;
        } else if(fx.type === 'reroll'){
          freeReroll = true;
        }
      });
    });
    for(let i = 0; i < extraDice; i++){
      dice.push(randDie());
      breakdown.push('额外骰');
    }
    const companion = S.crew.find(c => c.alive && !c.injured && CREW_BY_ID[c.id] && CREW_BY_ID[c.id].bonusDisc === a.disc);
    if(companion){
      const cb = CREW_BY_ID[companion.id].bonus || 1;
      bonus += cb;
      breakdown.push(`${CREW_BY_ID[companion.id].name} +${cb}`);
    }
    const diceSum = dice.reduce((x,y) => x + y, 0);
    const dc = Math.max(2, a.diff - S.crisisEase - ease);
    const total = diceSum + bonus;
    const margin = total - dc;
    let tier = 'success';
    if(margin >= BALANCE.greatMargin) tier = 'great';
    else if(margin >= 0) tier = 'success';
    else if(margin > -BALANCE.critMargin) tier = 'fail';
    else tier = 'crit';
    return {
      dice, diceSum, bonus, breakdown, dc, total, margin, tier,
      prevent, freeReroll, ease, crisisEase:S.crisisEase,
      natural:dice.length === 2 ? dice[0] + dice[1] : null
    };
  }

  function rollDice(){
    if(!S || S.phase !== 'crisis' || !S.approach) return { ok:false };
    S.roll = computeCheck();
    S.freeReroll = S.roll.freeReroll;
    S.phase = 'rolling';
    const r = S.roll;
    log(`掷骰：${r.dice.join(' + ')}${r.bonus ? ' + 加值 ' + r.bonus : ''} = ${r.total}，对抗 ${r.dc}。`, 'info');
    save();
    return { ok:true, roll:r };
  }

  function reroll(){
    if(!S || S.phase !== 'rolling' || S.rerolled) return { ok:false, reason:'不能重掷' };
    if(S.freeReroll){
      S.freeReroll = false;
    } else {
      if(S.res.morale < BALANCE.rerollMoraleCost) return { ok:false, reason:'人心不足' };
      S.res.morale = clampRes('morale', S.res.morale - BALANCE.rerollMoraleCost);
    }
    S.freeReroll = false;
    S.roll = computeCheck();
    S.roll.rerolled = true;
    S.rerolled = true;
    log(`重掷：${S.roll.dice.join(' + ')}${S.roll.bonus ? ' + 加值 ' + S.roll.bonus : ''} = ${S.roll.total}，对抗 ${S.roll.dc}。`, 'info');
    save();
    return { ok:true, roll:S.roll };
  }

  function resolveRoll(){
    if(!S || S.phase !== 'rolling' || !S.roll) return { ok:false };
    const r = S.roll;
    const a = S.approach;
    const successLike = r.tier === 'success' || r.tier === 'great';
    const base = successLike ? a.success : a.fail;
    const fx = [];
    if(successLike){
      (base.fx || []).forEach(x => fx.push(x));
      S.played.forEach(inst => {
        (cardEffects(inst, 'onSuccess') || []).forEach(x => fx.push(x));
        if(r.tier === 'great'){
          (cardEffects(inst, 'onGreat') || []).forEach(x => fx.push(x));
        }
      });
      if(r.tier === 'great') fx.push(FX.morale(1));
    } else {
      S.played.forEach(inst => {
        (cardEffects(inst, 'onFail') || []).forEach(x => fx.push(x));
      });
      (base.fx || []).forEach(x => fx.push(x));
      if(r.tier === 'crit') fx.push(FX.hull(-1));
    }
    const summary = applyEffects(fx, { shield:r.prevent, critical:r.tier === 'crit' });
    S.stats.checks++;
    if(r.tier === 'great'){ S.stats.success++; S.stats.great++; }
    else if(r.tier === 'success'){ S.stats.success++; }
    else if(r.tier === 'crit'){ S.stats.fail++; S.stats.crit++; }
    else { S.stats.fail++; }
    // 牌进弃牌 / 消耗
    S.played.forEach(inst => {
      const d = cardData(inst);
      const exhaust = d && (d.effects || []).some(x => x.type === 'exhaustSelf');
      if(exhaust) S.exhausted.push(inst);
      else S.discard.push(inst);
    });
    const playedNames = S.played.map(inst => cardData(inst) ? cardData(inst).name : '?');
    S.played = [];
    S.discard = S.discard.concat(S.hand);
    S.hand = [];
    S.phase = 'resolve';
    const stamp = r.tier === 'great' ? '大成功' : r.tier === 'success' ? '成功' : r.tier === 'crit' ? '大失败' : '失败';
    S.resolve = {
      tier:r.tier, stamp, text:base.text, summary,
      dice:r.dice, total:r.total, dc:r.dc, margin:r.margin,
      playedNames, rerolled:!!r.rerolled,
      finale:!!(S.finale && S.finale.active)
    };
    log(`${stamp}。${base.text}${summary ? '（' + summary + '）' : ''}`, successLike ? 'good' : 'bad', stamp);
    checkDefeat();
    save();
    return { ok:true, resolve:S.resolve };
  }

  /* ---------------- 效果应用 ---------------- */

  function applyEffects(effects, opts){
    if(!S) return '';
    const o = opts || {};
    let shield = o.shield || 0;
    const parts = [];
    (effects || []).forEach(fx => {
      if(!fx || !fx.type) return;
      switch(fx.type){
        case 'gain': {
          if(!(fx.res in S.res)) break;
          const changed = addRes(fx.res, fx.n);
          if(changed !== 0){
            const meta = RES_META[fx.res] || { name:fx.res };
            parts.push(`${meta.name} ${changed > 0 ? '+' : ''}${changed}`);
          }
          break;
        }
        case 'hull': {
          if(fx.n < 0){
            const want = -fx.n;
            const blocked = Math.min(shield, want);
            shield -= blocked;
            const dmg = want - blocked;
            if(dmg > 0){
              S.res.hull = clampRes('hull', S.res.hull - dmg);
              S.stats.damage += dmg;
              parts.push(`车况 -${dmg}`);
            }
            if(blocked > 0) parts.push(`挡下 ${blocked} 点车损`);
          } else if(fx.n > 0){
            const changed = addRes('hull', fx.n);
            if(changed) parts.push(`车况 +${changed}`);
          }
          break;
        }
        case 'morale': {
          const changed = addRes('morale', fx.n);
          if(changed) parts.push(`人心 ${changed > 0 ? '+' : ''}${changed}`);
          break;
        }
        case 'seed': {
          const changed = addRes('seeds', fx.n);
          if(changed) parts.push(`火种 ${changed > 0 ? '+' : ''}${changed}`);
          break;
        }
        case 'cure': {
          const target = pick(injuredCrew());
          if(target){
            target.injured = false;
            parts.push(`治愈了${CREW_BY_ID[target.id].name}`);
          } else {
            parts.push('没有人需要治疗');
          }
          break;
        }
        case 'injury': {
          const elig = S.crew.filter(c => c.alive && !c.injured);
          if(!elig.length){
            S.res.morale = clampRes('morale', S.res.morale - 1);
            parts.push('无人可伤，人心 -1');
          } else {
            const target = pick(elig);
            target.injured = true;
            parts.push(`${CREW_BY_ID[target.id].name}受伤`);
          }
          break;
        }
        case 'death': {
          const alive = S.crew.filter(c => c.alive);
          if(!o.critical){
            const elig = alive.filter(c => !c.injured);
            if(elig.length){
              const target = pick(elig);
              target.injured = true;
              parts.push(`${CREW_BY_ID[target.id].name}受了重伤`);
            } else {
              S.res.morale = clampRes('morale', S.res.morale - 1);
              parts.push('人心 -1');
            }
          } else if(alive.length <= 1){
            S.res.morale = clampRes('morale', S.res.morale - 2);
            parts.push('人心 -2');
          } else {
            const target = pick(alive);
            target.alive = false;
            target.injured = false;
            S.res.morale = clampRes('morale', S.res.morale - 2);
            const sig = CREW_BY_ID[target.id].sig;
            if(sig){
              S.deck = S.deck.filter(c => c.id !== sig);
              S.hand = S.hand.filter(c => c.id !== sig);
              S.discard = S.discard.filter(c => c.id !== sig);
              S.played = S.played.filter(c => c.id !== sig);
            }
            parts.push(`${CREW_BY_ID[target.id].name}没能活下来`);
          }
          break;
        }
        case 'draw': {
          const n = drawCards(fx.n);
          if(n) parts.push(`抽 ${n} 张牌`);
          break;
        }
        case 'max': {
          const maxKey = fx.res + 'Max';
          if(maxKey in S.res){
            S.res[maxKey] += fx.n;
            parts.push(`${RES_META[fx.res] ? RES_META[fx.res].name : fx.res}上限 +${fx.n}`);
          }
          break;
        }
        case 'fuelNext': {
          S.flags.fuelNext = (S.flags.fuelNext || 0) + fx.n;
          parts.push('下一段更省油');
          break;
        }
        case 'discount': {
          S.flags.discount = (S.flags.discount || 0) + fx.n;
          parts.push('下一张牌更便宜');
          break;
        }
        case 'scout': {
          S.scoutNext = true;
          parts.push('看清了下一段路');
          break;
        }
        default:
          break;
      }
    });
    return parts.join('，');
  }

  /* ---------------- 失败 / 结算 ---------------- */

  function checkDefeat(){
    if(!S || S.phase === 'ending') return true;
    if(S.res.hull <= 0){
      defeat('车况归零。老骡在路中间熄了火，再也打不着了。');
      return true;
    }
    if(S.res.morale <= 0){
      defeat('人心归零。最后一个人在下一个路口下了车，没有回头。');
      return true;
    }
    return false;
  }

  function defeat(reason){
    if(!S || S.phase === 'ending') return;
    S.phase = 'ending';
    S.endingId = 'extinguish';
    S.endingReason = reason;
    S.finale.active = false;
    log(reason, 'bad');
    clearSave();
  }

  /* ---------------- 奖励 ---------------- */

  function buildRewards(){
    const act = S.act;
    const climax = isClimaxSeg(S.seg);
    let pool = CARDS.filter(c => c.rarity !== 'basic' && c.rarity !== 'sig');
    if(!climax) pool = pool.filter(c => c.rarity !== 'legend');
    const weightOf = c => c.rarity === 'legend' ? 1 : c.rarity === 'rare' ? 2.5 : 5;
    const picked = [];
    let guard = 0;
    while(picked.length < BALANCE.rewardCards && guard++ < 80){
      const c = pickWeighted(rand, pool, pool.map(weightOf));
      if(c && !picked.some(x => x.id === c.id)) picked.push(c);
    }
    if(climax){
      const legends = CARDS.filter(c => c.rarity === 'legend');
      if(legends.length && !picked.some(x => x.rarity === 'legend')){
        picked[0] = pick(legends);
      }
    }
    const cardOpts = picked.map(c => ({ kind:'card', cardId:c.id, name:c.name, rarity:c.rarity, disc:c.disc }));
    const roll = rand();
    let third;
    if(roll < 0.18) third = { kind:'repair', n:2, name:'修整', desc:'车况 +2' };
    else if(roll < 0.3) third = { kind:'morale', n:1, name:'休整', desc:'人心 +1' };
    else if(roll < 0.38) third = { kind:'seed', n:1, name:'拾遗', desc:'火种 +1' };
    else {
      const res = (rand() < 0.62 && S.route) ? S.route.reward : pick(['fuel','food','parts','meds']);
      const n = res === 'meds' ? 2 : 3;
      third = { kind:'res', res, n, name:RES_META[res].name, desc:`${RES_META[res].name} +${n}` };
    }
    S.rewardOptions = cardOpts.concat([third]);
    log('三选一：带走一样东西。', 'info');
  }

  function chooseReward(index){
    if(!S || S.phase !== 'reward') return { ok:false };
    const opt = S.rewardOptions[index];
    if(!opt) return { ok:false };
    if(opt.kind === 'card'){
      const inst = { uid:uid('k'), id:opt.cardId, up:false };
      S.discard.push(inst);
      log(`把「${CARD_BY_ID[opt.cardId].name}」收进了牌堆。`, 'good');
    } else {
      const fx = opt.kind === 'repair' ? [FX.hull(opt.n)]
        : opt.kind === 'morale' ? [FX.morale(opt.n)]
        : opt.kind === 'seed' ? [FX.seed(opt.n)]
        : [FX.gain(opt.res, opt.n)];
      const summary = applyEffects(fx);
      log(`收下${opt.name}${summary ? '：' + summary : ''}。`, 'good');
    }
    S.rewardOptions = [];
    if(checkDefeat()) return { ok:true };
    afterSegment();
    save();
    return { ok:true };
  }

  function afterSegment(){
    if(BALANCE.camps.indexOf(S.seg) >= 0){
      enterCamp();
    } else {
      nextSegment();
    }
  }

  function nextSegment(){
    if(S.seg >= S.maxSeg){
      enterFinale();
    } else {
      beginSegment();
    }
  }

  /* ---------------- 营地 ---------------- */

  function enterCamp(){
    const idx = BALANCE.camps.indexOf(S.seg);
    const beat = BEATS[Math.max(0, Math.min(BEATS.length - 1, idx))];
    const others = SERVICES.filter(s => s.id !== 'upgrade');
    const services = [SERVICE_BY_ID['upgrade']].concat(sample(others, BALANCE.campServicesOffered - 1));
    S.camp = {
      beat,
      services,
      beatChoice:null,
      reply:'',
      serviceUsed:null,
      pendingService:null
    };
    S.phase = 'camp';
    log('找到一处能停车的地方。生火，吃点东西，检查车。', 'info');
    save();
  }

  function canPay(cost){
    if(!cost) return true;
    for(const k in cost){
      if((S.res[k] || 0) < cost[k]) return false;
    }
    return true;
  }

  function pay(cost){
    if(!cost) return;
    for(const k in cost){
      S.res[k] = clampRes(k, S.res[k] - cost[k]);
    }
  }

  function canAffordEffects(fx){
    const need = {};
    (fx || []).forEach(f => {
      if(f.type === 'gain' && f.n < 0){
        need[f.res] = (need[f.res] || 0) + (-f.n);
      }
    });
    for(const k in need){
      if((S.res[k] || 0) < need[k]) return false;
    }
    return true;
  }

  function chooseBeat(index){
    if(!S || S.phase !== 'camp' || !S.camp || S.camp.beatChoice != null) return { ok:false };
    const choice = S.camp.beat.choices[index];
    if(!choice) return { ok:false };
    if(!canAffordEffects(choice.fx)) return { ok:false, reason:'资源不足' };
    const summary = applyEffects(choice.fx);
    S.camp.beatChoice = index;
    S.camp.reply = choice.reply;
    log(choice.reply, 'info');
    if(summary) log(summary, 'info');
    if(checkDefeat()) return { ok:true };
    save();
    return { ok:true };
  }

  function chooseService(id){
    if(!S || S.phase !== 'camp' || !S.camp || S.camp.serviceUsed) return { ok:false };
    const svc = S.camp.services.find(s => s.id === id);
    if(!svc) return { ok:false };
    if(svc.kind === 'upgrade' || svc.kind === 'burn'){
      if(!canPay(svc.cost)) return { ok:false, reason:'资源不足' };
      if(svc.kind === 'upgrade' && !S.deck.some(c => !c.up)) return { ok:false, reason:'没有可升级的牌' };
      if(svc.kind === 'burn' && !S.deck.length) return { ok:false, reason:'没有可烧的牌' };
      S.camp.pendingService = id;
      save();
      return { ok:true, pending:id };
    }
    if(!canPay(svc.cost)) return { ok:false, reason:'资源不足' };
    pay(svc.cost);
    const summary = applyEffects(svc.fx);
    S.camp.serviceUsed = id;
    log(`营地：${svc.name}${summary ? '，' + summary : ''}。`, 'good');
    if(checkDefeat()) return { ok:true };
    save();
    return { ok:true };
  }

  function chooseCampCard(uidValue){
    if(!S || S.phase !== 'camp' || !S.camp || !S.camp.pendingService) return { ok:false };
    const svc = SERVICE_BY_ID[S.camp.pendingService];
    const inst = S.deck.find(c => c.uid === uidValue);
    if(!inst || !svc) return { ok:false };
    if(svc.kind === 'upgrade'){
      if(inst.up) return { ok:false, reason:'已经升级过了' };
      if(!canPay(svc.cost)) return { ok:false, reason:'资源不足' };
      pay(svc.cost);
      inst.up = true;
      S.camp.serviceUsed = svc.id;
      S.camp.pendingService = null;
      log(`营地：把「${CARD_BY_ID[inst.id].name}」磨得更顺手了。`, 'good');
    } else if(svc.kind === 'burn'){
      const idx = S.deck.findIndex(c => c.uid === uidValue);
      if(idx < 0) return { ok:false };
      const name = CARD_BY_ID[inst.id] ? CARD_BY_ID[inst.id].name : '一张牌';
      S.deck.splice(idx, 1);
      const summary = applyEffects(svc.fx);
      S.camp.serviceUsed = svc.id;
      S.camp.pendingService = null;
      log(`营地：把「${name}」丢进了火里。${summary ? summary + '。' : ''}`, 'bad');
    }
    if(checkDefeat()) return { ok:true };
    save();
    return { ok:true };
  }

  function cancelCampService(){
    if(S && S.camp){ S.camp.pendingService = null; save(); }
    return { ok:true };
  }

  function leaveCamp(){
    if(!S || S.phase !== 'camp') return { ok:false };
    S.camp = null;
    nextSegment();
    save();
    return { ok:true };
  }

  /* ---------------- 终局 ---------------- */

  function enterFinale(){
    S.finale = { active:true, stage:0, successes:0, results:[] };
    log('第 20 段走完了。北岭就在前面，垭口是最后一道门。', 'info');
    startFinaleStage();
  }

  function startFinaleStage(){
    const f = FINALE[S.finale.stage];
    if(!f){ arrive(); return; }
    S.crisis = f;
    S.phase = 'crisis';
    S.approach = null;
    S.played = [];
    S.roll = null;
    S.rerolled = false;
    S.freeReroll = false;
    S.ap = BALANCE.ap;
    S.selected = null;
    S.crisisEase = 0;
    drawCards(BALANCE.hand - S.hand.length);
    log(`${f.title}。${f.text}`, 'info');
    save();
  }

  function arrive(){
    const successes = S.finale.successes || 0;
    S.finale.active = false;
    S.res.seeds = clampRes('seeds', S.res.seeds + successes);
    if(successes >= 2) S.res.hull = clampRes('hull', S.res.hull + 2);
    S.res.morale = clampRes('morale', S.res.morale + 1);
    S.phase = 'settle';
    S.settle = { built:[] };
    log(`你们到了北岭。三次终局检定成功 ${successes} 次。`, 'good');
    if(successes) log(`带回的火种 +${successes}。`, 'good');
    save();
  }

  function continueAfterResolve(){
    if(!S || S.phase !== 'resolve') return { ok:false };
    if(S.finale.active){
      const r = S.resolve;
      const ok = r && (r.tier === 'success' || r.tier === 'great');
      if(ok) S.finale.successes++;
      S.finale.results.push({ tier:r ? r.tier : 'fail' });
      S.finale.stage++;
      if(S.finale.stage >= FINALE.length){
        arrive();
      } else {
        startFinaleStage();
      }
      save();
      return { ok:true };
    }
    S.phase = 'reward';
    buildRewards();
    save();
    return { ok:true };
  }

  /* ---------------- 定居点 / 结局 ---------------- */

  function buildModule(id){
    if(!S || S.phase !== 'settle') return { ok:false };
    const m = MODULE_BY_ID[id];
    if(!m || S.settle.built.indexOf(id) >= 0) return { ok:false };
    if(S.settle.built.length >= BALANCE.maxModules) return { ok:false, reason:'最多建 4 个' };
    if(!canPay(m.cost)) return { ok:false, reason:'资源不足' };
    pay(m.cost);
    S.settle.built.push(id);
    log(`建起${m.name}。${m.fate}`, 'good');
    save();
    return { ok:true };
  }

  function finishSettlement(){
    if(!S || S.phase !== 'settle') return { ok:false };
    const alive = aliveCrew().length;
    const modules = S.settle.built.length;
    let ending = 'ember';
    if(modules >= 4 && alive >= 2 && S.res.morale >= 8 && S.res.seeds >= 2) ending = 'dawn';
    else if(modules >= 3) ending = 'spark';
    S.endingId = ending;
    S.phase = 'ending';
    S.bestEnding = bestOf(S.bestEnding, ending);
    saveBest(S.bestEnding);
    clearSave();
    return { ok:true, ending };
  }

  function bestOf(a, b){
    const ra = ENDING_RANK[a] != null ? ENDING_RANK[a] : -1;
    const rb = ENDING_RANK[b] != null ? ENDING_RANK[b] : -1;
    return rb > ra ? b : a;
  }

  function endingView(){
    if(!S || !S.endingId) return null;
    const e = ENDINGS[S.endingId] || ENDINGS.ember;
    const alive = aliveCrew().length;
    const modules = S.settle ? S.settle.built.length : 0;
    let text = e.text
      .replace(/\{reason\}/g, S.endingReason || '')
      .replace(/\{modules\}/g, String(modules))
      .replace(/\{survivors\}/g, String(alive))
      .replace(/\{seeds\}/g, String(S.res.seeds));
    const fates = CREW.map(c => {
      const inRun = S.crew.some(x => x.id === c.id);
      if(!inRun) return { name:c.name, text:c.fateLeft };
      const member = S.crew.find(x => x.id === c.id);
      return { name:c.name, text:member.alive ? c.fateAlive : c.fateDead };
    });
    return {
      id: S.endingId,
      title: e.title,
      kicker: e.kicker,
      sub: e.sub,
      text,
      fates,
      stats: {
        seg: S.seg,
        modules,
        alive,
        seeds: S.res.seeds,
        hull: S.res.hull,
        morale: S.res.morale,
        checks: S.stats.checks,
        great: S.stats.great,
        fail: S.stats.fail,
        cards: S.stats.cardsPlayed
      }
    };
  }

  /* ---------------- 存档 ---------------- */

  function storageGet(key){
    try { return localStorage.getItem(key); } catch(e){ return null; }
  }
  function storageSet(key, value){
    try { localStorage.setItem(key, value); return true; } catch(e){ return false; }
  }
  function storageRemove(key){
    try { localStorage.removeItem(key); } catch(e){}
  }

  function save(){
    if(!S || simMode || demoMode || S.phase === 'ending') return false;
    S.savedAt = Date.now();
    return storageSet(SAVE_KEY, JSON.stringify(S));
  }

  function load(){
    const raw = storageGet(SAVE_KEY);
    if(!raw) return false;
    try {
      const obj = JSON.parse(raw);
      if(!obj || obj.v !== 1 || !obj.res || !Array.isArray(obj.deck) || !Array.isArray(obj.crew)) return false;
      if(!obj.phase || obj.phase === 'ending') return false;
      obj.log = Array.isArray(obj.log) ? obj.log : [];
      obj.hand = Array.isArray(obj.hand) ? obj.hand : [];
      obj.discard = Array.isArray(obj.discard) ? obj.discard : [];
      obj.exhausted = Array.isArray(obj.exhausted) ? obj.exhausted : [];
      obj.rewardOptions = Array.isArray(obj.rewardOptions) ? obj.rewardOptions : [];
      obj.finale = obj.finale || { active:false, stage:0, successes:0, results:[] };
      obj.settle = obj.settle || { built:[] };
      obj.flags = obj.flags || { emergencyUsed:false, tutorialSeen:false };
      obj.stats = obj.stats || { checks:0, success:0, great:0, fail:0, crit:0, damage:0, cardsPlayed:0 };
      obj.bestEnding = getBestEnding();
      S = obj;
      if(S.phase === 'rolling' && !S.roll){ S.phase = 'crisis'; }
      return true;
    } catch(e){
      return false;
    }
  }

  function hasSave(){
    const raw = storageGet(SAVE_KEY);
    if(!raw) return false;
    try {
      const o = JSON.parse(raw);
      return o && o.v === 1 && o.phase && o.phase !== 'ending';
    } catch(e){ return false; }
  }

  function clearSave(){ if(simMode || demoMode) return; storageRemove(SAVE_KEY); }

  function getBestEnding(){
    const v = storageGet(BEST_KEY);
    return v && ENDINGS[v] ? v : null;
  }
  function saveBest(id){ if(simMode || demoMode) return; if(id) storageSet(BEST_KEY, id); }

  function loadSettings(){
    try {
      const raw = storageGet(SETTINGS_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch(e){ return {}; }
  }
  function saveSettings(obj){
    return storageSet(SETTINGS_KEY, JSON.stringify(obj || {}));
  }

  /* ---------------- 自动模拟 ---------------- */

  function expectedApproach(a){
    const played = [];
    let bonus = 0;
    S.hand.forEach(inst => {
      const d = cardData(inst);
      (d.effects || []).forEach(fx => {
        if(!effectActive(fx)) return;
        if(fx.type === 'bonus' && fx.disc === a.disc) bonus += fx.n;
        else if(fx.type === 'anyBonus') bonus += fx.n;
      });
    });
    const comp = S.crew.find(c => c.alive && !c.injured && CREW_BY_ID[c.id] && CREW_BY_ID[c.id].bonusDisc === a.disc);
    if(comp) bonus += CREW_BY_ID[comp.id].bonus || 1;
    return 7 + bonus - a.diff;
  }

  function autoPickApproach(){
    let best = 0;
    let bestVal = -999;
    S.crisis.approaches.forEach((a, i) => {
      const v = expectedApproach(a);
      if(v > bestVal){ bestVal = v; best = i; }
    });
    return best;
  }

  function autoPlayCards(){
    if(!S.approach) return;
    for(let guard = 0; guard < 5; guard++){
      const playable = S.hand.filter(inst => canPlay(inst.uid).ok);
      if(!playable.length) return;
      let chosen = null;
      let bestVal = 0;
      playable.forEach(inst => {
        const d = cardData(inst);
        let val = 0;
        (d.effects || []).forEach(fx => {
          if(!effectActive(fx)) return;
          if(fx.type === 'bonus' && fx.disc === S.approach.disc) val += fx.n;
          else if(fx.type === 'anyBonus') val += fx.n;
          else if(fx.type === 'gain' && fx.n > 0) val += 1;
          else if(fx.type === 'draw') val += 1;
          else if(fx.type === 'cure' && S.crew.some(c => c.alive && c.injured)) val += 2;
          else if(fx.type === 'seed') val += 1.5;
          else if(fx.type === 'hull' && fx.n < 0 && S.res.hull <= 4) val -= 4;
        });
        val -= d.cost * 0.15;
        if(val > bestVal){ bestVal = val; chosen = inst; }
      });
      if(!chosen) return;
      playCard(chosen.uid);
    }
  }

  function autoChooseReward(){
    if(!S.rewardOptions.length) return;
    const deckSize = S.deck.length + S.hand.length + S.discard.length;
    const lowFuel = S.res.fuel <= 4;
    const lowFood = S.res.food <= 4;
    const lowHull = S.res.hull <= 5;
    let idx = -1;
    // 先补命脉
    if(lowFuel) idx = S.rewardOptions.findIndex(o => (o.kind === 'res' && o.res === 'fuel'));
    if(idx < 0 && lowFood) idx = S.rewardOptions.findIndex(o => (o.kind === 'res' && o.res === 'food'));
    if(idx < 0 && lowHull) idx = S.rewardOptions.findIndex(o => (o.kind === 'repair' || (o.kind === 'res' && o.res === 'parts')));
    if(idx < 0 && deckSize < 27) idx = S.rewardOptions.findIndex(o => o.kind === 'card');
    if(idx < 0) idx = S.rewardOptions.findIndex(o => o.kind === 'res' || o.kind === 'repair');
    if(idx < 0) idx = 0;
    chooseReward(idx);
  }

  function autoCamp(){
    if(!S.camp) return;
    if(S.camp.beatChoice == null){
      for(let i = 0; i < S.camp.beat.choices.length; i++){
        if(canAffordEffects(S.camp.beat.choices[i].fx)){ chooseBeat(i); break; }
      }
    }
    if(!S.camp.serviceUsed && S.phase === 'camp'){
      const has = id => S.camp.services.some(s => s.id === id);
      const trySvc = id => {
        if(has(id) && canPay(SERVICE_BY_ID[id].cost)){ chooseService(id); return true; }
        return false;
      };
      if(S.res.fuel <= 4 && trySvc('trade')){}
      else if(S.res.hull <= 8 && trySvc('repair')){}
      else if(S.crew.some(c => c.alive && c.injured) && trySvc('heal')){}
      else if(S.res.parts >= 5 && trySvc('mod_armor')){}
      else if(S.res.parts >= 5 && trySvc('mod_tank')){}
      else if(S.res.morale <= 5 && trySvc('rest')){}
      else if(trySvc('upgrade')){
        const target = S.deck.find(c => !c.up);
        if(target) chooseCampCard(target.uid);
      }
      else if(trySvc('radio')){}
      else if(trySvc('trade')){}
    }
    leaveCamp();
  }

  function autoSettle(){
    const order = ['greenhouse','well','clinic','workshop','watchtower','school'];
    for(const id of order){
      if(S.settle.built.length >= BALANCE.maxModules) break;
      if(canPay(MODULE_BY_ID[id].cost)) buildModule(id);
    }
    finishSettlement();
  }

  function autoPlay(){
    let steps = 0;
    while(S.phase !== 'ending' && steps++ < 500){
      try {
        if(S.phase === 'route'){
          const affordable = S.routeOptions.filter(r => r.fuel <= S.res.fuel);
          if(!affordable.length){
            const e = emergencyFuel();
            if(!e.ok){ defeat('燃油耗尽。你们在原地等了三天，没有车经过。'); break; }
            continue;
          }
          // 优先匹配牌组学科
          const score = r => {
            let s = 0;
            r.bias.forEach(d => {
              s += S.deck.concat(S.hand).filter(inst => CARD_BY_ID[inst.id] && CARD_BY_ID[inst.id].disc === d).length * 0.2;
            });
            const fuelWeight = S.res.fuel <= 5 ? 2.2 : 0.4;
            return s - r.fuel * fuelWeight;
          };
          affordable.sort((a,b) => score(b) - score(a));
          chooseRoute(affordable[0].id);
        } else if(S.phase === 'crisis'){
          if(!S.approach){
            chooseApproach(autoPickApproach());
          } else {
            autoPlayCards();
            rollDice();
            if(S.phase === 'rolling'){
              if(S.roll.tier === 'fail' && S.res.morale > 3 && !S.rerolled){
                reroll();
              }
              resolveRoll();
            }
          }
        } else if(S.phase === 'rolling'){
          resolveRoll();
        } else if(S.phase === 'resolve'){
          continueAfterResolve();
        } else if(S.phase === 'reward'){
          autoChooseReward();
        } else if(S.phase === 'camp'){
          autoCamp();
        } else if(S.phase === 'settle'){
          autoSettle();
        } else {
          break;
        }
      } catch(e){
        return { error:String(e) };
      }
    }
    return { steps };
  }

  function simulate(n, seedBase){
    n = Math.max(1, Math.min(1000, n || 100));
    const prev = S;
    const prevSim = simMode;
    simMode = true;
    const start = Date.now();
    const out = {
      runs:0, reached:0, ending:{ extinguish:0, ember:0, spark:0, dawn:0 },
      failReasons:{}, errors:[], segments:[], finalRes:{ fuel:0, food:0, parts:0, meds:0, hull:0, morale:0, seeds:0 },
      checks:0, great:0, fail:0
    };
    for(let i = 0; i < n; i++){
      const crewPool = ['ahe','tiepi','bailu'];
      const a = i % 3;
      const b = (i + 1 + (i % 2)) % 3;
      const crew = [crewPool[a], crewPool[(b === a ? (b + 1) % 3 : b)]];
      try {
        newRun(crew, (seedBase || 20261127) + i, { silent:true });
        const r = autoPlay();
        if(r.error){ out.errors.push(r.error); }
        out.runs++;
        out.segments.push(S.seg);
        out.checks += S.stats.checks;
        out.great += S.stats.great;
        out.fail += S.stats.fail;
        const id = S.endingId || 'extinguish';
        out.ending[id] = (out.ending[id] || 0) + 1;
        if(id === 'extinguish'){
          const reason = (S.endingReason || '').slice(0, 8) || '未知';
          out.failReasons[reason] = (out.failReasons[reason] || 0) + 1;
        } else {
          out.reached++;
        }
        ['fuel','food','parts','meds','hull','morale','seeds'].forEach(k => {
          out.finalRes[k] += S.res[k] || 0;
        });
      } catch(e){
        out.errors.push(String(e));
      }
    }
    S = prev;
    simMode = prevSim;
    out.runs = Math.max(1, out.runs);
    out.avgSeg = out.segments.reduce((a,b)=>a+b,0) / Math.max(1, out.segments.length);
    out.reachedRate = out.reached / out.runs;
    out.ms = Date.now() - start;
    out.seedBase = seedBase || 20261127;
    for(const k in out.finalRes) out.finalRes[k] = +(out.finalRes[k] / out.runs).toFixed(1);
    delete out.segments;
    return out;
  }

  /* ---------------- 内容校验 ---------------- */

  const KNOWN_FX = ['bonus','anyBonus','gain','hull','morale','seed','cure','injury','death','draw','max','fuelNext','discount','scout','preventDamage','extraDie','reroll','ease','exhaustSelf','retain'];

  function validate(){
    const issues = [];
    const ids = new Set();
    CARDS.forEach(c => {
      if(ids.has('card:' + c.id)) issues.push('卡牌 ID 重复：' + c.id);
      ids.add('card:' + c.id);
      if(!DISC[c.disc]) issues.push('卡牌学科无效：' + c.id);
      if(!Art.hasScene(c.art)) issues.push('卡牌插画 key 不存在：' + c.id + ' / ' + c.art);
      if(!c.up) issues.push('卡牌缺少升级定义：' + c.id);
      (c.effects || []).forEach(f => { if(KNOWN_FX.indexOf(f.type) < 0) issues.push('未知效果：' + c.id + ' / ' + f.type); });
      (c.onSuccess || []).forEach(f => { if(KNOWN_FX.indexOf(f.type) < 0) issues.push('未知效果：' + c.id + ' / ' + f.type); });
      (c.onFail || []).forEach(f => { if(KNOWN_FX.indexOf(f.type) < 0) issues.push('未知效果：' + c.id + ' / ' + f.type); });
    });
    const cids = new Set();
    CRISES.forEach(c => {
      if(cids.has('crisis:' + c.id)) issues.push('危机 ID 重复：' + c.id);
      cids.add('crisis:' + c.id);
      if(!Art.hasScene(c.art)) issues.push('危机插画 key 不存在：' + c.id);
      if(!c.approaches || c.approaches.length < 2) issues.push('危机应对少于 2 种：' + c.id);
      (c.approaches || []).forEach(a => {
        if(!DISC[a.disc]) issues.push('危机学科无效：' + c.id);
        if(typeof a.diff !== 'number') issues.push('危机难度无效：' + c.id);
        if(!a.success || !a.success.text || !a.fail || !a.fail.text) issues.push('危机缺少成败文本：' + c.id);
      });
    });
    [1,2,3].forEach(act => {
      const rs = ROUTES.filter(r => r.act === act);
      if(rs.length < 2) issues.push('第' + act + '幕路线不足：' + rs.length);
    });
    ROUTES.forEach(r => {
      r.bias.forEach(d => { if(!DISC[d]) issues.push('路线学科无效：' + r.id); });
    });
    CREW.forEach(c => {
      if(!CARD_BY_ID[c.sig]) issues.push('同伴签名卡不存在：' + c.id);
      if(!Art.portrait) issues.push('肖像函数缺失');
    });
    if(CREW.length !== 3) issues.push('同伴数量不是 3：' + CREW.length);
    const sids = new Set();
    SERVICES.forEach(s => { if(sids.has(s.id)) issues.push('服务 ID 重复：' + s.id); sids.add(s.id); });
    MODULES.forEach(m => {
      if(!Art.ICON_PATHS[m.icon]) issues.push('模块图标不存在：' + m.id + ' / ' + m.icon);
    });
    Object.keys(ENDINGS).forEach(k => {
      if(!ENDINGS[k].text || !ENDINGS[k].title) issues.push('结局文本缺失：' + k);
    });
    return {
      ok: issues.length === 0,
      issues,
      counts: { cards:CARDS.length, crises:CRISES.length, routes:ROUTES.length, crew:CREW.length, services:SERVICES.length, modules:MODULES.length, endings:Object.keys(ENDINGS).length }
    };
  }

  /* ---------------- 对外接口 ---------------- */

  return {
    get state(){ return S; },
    get simMode(){ return simMode; },
    newRun, beginSegment,
    chooseRoute, emergencyFuel, chooseApproach,
    selectCard, playCard, canPlay,
    rollDice, reroll, resolveRoll, continueAfterResolve,
    chooseReward,
    chooseBeat, chooseService, chooseCampCard, cancelCampService, leaveCamp,
    enterCamp, enterFinale, startFinaleStage, arrive,
    buildModule, finishSettlement,
    endingView, defeat, checkDefeat,
    save, load, hasSave, clearSave, getBestEnding,
    loadSettings, saveSettings,
    simulate, validate, autoPlay,
    setDemoMode(v){ demoMode = !!v; },
    helpers: { actOfSeg, isClimaxSeg, aliveCrew, cardData, cardEffects, canPay, canAffordEffects }
  };
})();

/* ============================================================
   界面：标题、选人、桌面、地图、手牌、骰子、营地、结局
   ============================================================ */

const UI = (() => {

  let settings = { muted:false, volume:0.22, reduceMotion:false };
  let selectedCrew = [];
  let params = {};
  let overlayType = null;
  let overlayLocked = false;
  let lastFocus = null;
  let rulesTab = 'loop';
  let lastLogLen = 0;
  let lastSeg = -1;
  let lastPhase = null;
  let pickerKind = null;
  let dragState = null;
  let dragMoved = false;
  let dragJustFinished = false;

  const $ = sel => document.querySelector(sel);
  const $$ = sel => Array.from(document.querySelectorAll(sel));

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function pct(v, max){ return max ? Math.max(0, Math.min(100, (v / max) * 100)) : 0; }

  /* ---------------- 初始化 ---------------- */

  function init(){
    params = new URLSearchParams(location.search);
    settings = Object.assign({ muted:false, volume:0.22, reduceMotion:false }, Game.loadSettings());
    if(params.get('static')) settings.reduceMotion = true;
    applySettings();
    $('#title-art').innerHTML = Art.titleScene();
    $('#seg-max').textContent = String(BALANCE.segments);
    bindEvents();
    updateTitle();
    if(params.get('validate')){ runValidation(); return; }
    if(params.get('sim')){ runSim(); return; }
    if(params.get('demo')){ runDemo(params.get('demo')); return; }
    showTitle();
  }

  function applySettings(){
    document.body.classList.toggle('reduce-motion', !!settings.reduceMotion);
    const snd = $('#btn-sound');
    if(snd){
      snd.classList.toggle('is-off', !!settings.muted);
      snd.textContent = settings.muted ? '静音' : '音效';
    }
    if(window.Audio && Audio.setMuted) Audio.setMuted(!!settings.muted);
  }

  function saveSettings(){
    Game.saveSettings(settings);
    applySettings();
  }

  /* ---------------- 屏幕切换 ---------------- */

  function showTitle(){
    if(window.Audio) Audio.stopAmbient();
    $('#screen-title').classList.remove('hidden');
    $('#screen-setup').classList.add('hidden');
    $('#screen-game').classList.add('hidden');
    $('#overlay-root').innerHTML = '';
    overlayType = null;
    document.body.classList.remove('in-game');
    updateTitle();
  }

  function showSetup(){
    if(window.Audio) Audio.stopAmbient();
    selectedCrew = [];
    renderSetup();
    $('#screen-title').classList.add('hidden');
    $('#screen-setup').classList.remove('hidden');
    $('#screen-game').classList.add('hidden');
    $('#overlay-root').innerHTML = '';
    overlayType = null;
  }

  function showGame(){
    $('#screen-title').classList.add('hidden');
    $('#screen-setup').classList.add('hidden');
    $('#screen-game').classList.remove('hidden');
    document.body.classList.add('in-game');
  }

  function updateTitle(){
    const best = Game.getBestEnding();
    const label = best ? ({ extinguish:'熄灭', ember:'余烬', spark:'火种', dawn:'黎明' }[best] || best) : null;
    const el = $('#best-ending');
    if(el) el.textContent = label ? `上一次，你走到了：${label}` : '还没有人在这里过冬。';
    const cont = $('#btn-continue');
    if(cont) cont.disabled = !Game.hasSave();
  }

  /* ---------------- 选同伴 ---------------- */

  function renderSetup(){
    const box = $('#crew-picker');
    box.innerHTML = CREW.map(c => {
      const picked = selectedCrew.indexOf(c.id) >= 0;
      const sig = CARD_BY_ID[c.sig];
      return `<button class="crew-pick ${picked ? 'is-picked' : ''}" type="button" data-action="toggle-crew" data-id="${c.id}" aria-pressed="${picked}">
        <div class="crew-portrait">${Art.portrait(c.portrait)}</div>
        <div class="crew-name"><b>${esc(c.name)}</b><span>${esc(c.role)}</span></div>
        <span class="crew-passive">${esc(c.passive)}</span>
        <div class="crew-desc">${esc(c.desc)}</div>
        <div class="crew-sig">签名牌：<b>${sig ? esc(sig.name) : '—'}</b> · ${sig ? esc(sig.text) : ''}</div>
      </button>`;
    }).join('');
    $('#setup-count').textContent = `已选 ${selectedCrew.length} / 2`;
    $('#btn-depart').disabled = selectedCrew.length !== 2;
  }

  function toggleCrew(id){
    const i = selectedCrew.indexOf(id);
    if(i >= 0) selectedCrew.splice(i, 1);
    else if(selectedCrew.length < 2) selectedCrew.push(id);
    else toast('只能带两个人。第三个人得留下。');
    renderSetup();
    if(window.Audio) Audio.play('tick');
  }

  function startRun(){
    if(selectedCrew.length !== 2) return;
    const seed = params.get('seed') ? (parseInt(params.get('seed'), 10) >>> 0) : undefined;
    Game.newRun(selectedCrew, seed);
    showGame();
    renderAll();
    if(window.Audio){ Audio.init(); if(!settings.muted) Audio.startAmbient(); }
    const S = Game.state;
    if(S && !S.flags.tutorialSeen && !params.get('static')) openTutorial();
  }

  /* ---------------- 主渲染 ---------------- */

  function renderAll(){
    const S = Game.state;
    if(!S){ showTitle(); return; }
    if(S.phase === 'ending'){ showGame(); renderTopbar(); renderResources(); renderMap(); renderLog(); renderStage(); renderEnding(); return; }
    showGame();
    renderTopbar();
    renderResources();
    renderMap();
    renderLog();
    renderHand();
    renderStage();
    if(S.phase === 'camp') renderCampOverlay();
    else if(S.phase === 'settle') renderSettleOverlay();
    else if(overlayType === 'camp' || overlayType === 'settle') closeOverlay(true);
    lastPhase = S.phase;
  }

  function renderTopbar(){
    const S = Game.state;
    if(!S) return;
    const meta = BALANCE.acts.find(a => a.no === S.act) || BALANCE.acts[0];
    $('#act-kicker').textContent = `第${['','一','二','三'][S.act]}幕`;
    $('#act-name').textContent = meta.name;
    $('#seg-now').textContent = String(Math.min(S.seg, S.maxSeg));
    $('#weather').textContent = S.weather || '天色：灰';
    $('#radio-line').textContent = S.radio || '无线电静默';
  }

  function renderResources(){
    const S = Game.state;
    if(!S) return;
    const keys = ['fuel','food','meds','parts','hull','morale'];
    $('#resource-rack').innerHTML = keys.map(k => {
      const meta = RES_META[k];
      const val = S.res[k] || 0;
      const max = S.res[k + 'Max'] || 1;
      return `<div class="gauge" style="--rc:${meta.color};--rc2:${meta.color2}" title="${meta.name} ${val}/${max}">
        <div class="gauge-icon">${Art.icon(meta.icon)}</div>
        <div class="gauge-body">
          <div class="gauge-top"><span class="gauge-name">${meta.name}</span><span class="gauge-val">${val}<small>/${max}</small></span></div>
          <div class="gauge-track"><div class="gauge-fill" style="width:${pct(val, max)}%"></div></div>
        </div>
      </div>`;
    }).join('');

    const seeds = S.res.seeds || 0;
    const tokens = Math.min(seeds, 5);
    $('#seed-row').innerHTML = `<div class="seed-label">${Art.icon('seed')}火种</div>
      <div class="seed-count">${'<span class="seed-token">✦</span>'.repeat(tokens)}<span class="seed-num">×${seeds}</span></div>`;

    $('#crew-rail').innerHTML = S.crew.map(member => {
      const c = CREW_BY_ID[member.id];
      if(!c) return '';
      const status = !member.alive ? '不在了' : member.injured ? '受伤' : '在车上';
      return `<div class="crew-mini ${member.injured ? 'is-injured' : ''}" title="${esc(c.passive)}">
        <div class="crew-face">${Art.portrait(c.portrait)}</div>
        <div class="crew-meta"><b>${esc(c.name)}</b><span>${esc(c.passive)}</span></div>
        <div class="crew-status">${status}</div>
      </div>`;
    }).join('');
  }

  /* ---------------- 地图 ---------------- */

  function mapPoints(){
    const W = 980, H = 126, pad = 28;
    const pts = [];
    for(let i = 0; i < 21; i++){
      const t = i / 20;
      const x = pad + t * (W - pad * 2);
      const y = 70 + Math.sin(t * Math.PI * 3.1) * 22;
      pts.push({ x, y, seg:i + 1 });
    }
    return { pts, W, H };
  }

  function renderMap(){
    const S = Game.state;
    if(!S) return;
    const { pts, W, H } = mapPoints();
    const final = S.phase === 'ending' || S.phase === 'settle' || (S.finale && S.finale.active);
    const currentIdx = final ? 20 : Math.max(0, Math.min(19, S.seg - 1));
    const lineD = pts.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
    const doneD = pts.slice(0, currentIdx + 1).map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
    const nodes = pts.map((p, i) => {
      const isFinal = i === 20;
      const isCurrent = i === currentIdx;
      const isDone = !isCurrent && i < currentIdx;
      const clim = !isFinal && BALANCE.climaxSegs.indexOf(i + 1) >= 0;
      const cls = ['map-node', isDone ? 'is-done' : '', isCurrent ? 'is-current' : '', clim ? 'is-climax' : ''].filter(Boolean).join(' ');
      return `<g class="${cls}" transform="translate(${p.x},${p.y})">
        ${isCurrent ? '<circle class="node-ring" r="10"/>' : ''}
        <circle class="node-dot" r="${isFinal ? 5 : 3.4}"/>
        <text y="${isFinal ? 18 : 14}">${isFinal ? '北岭' : (i + 1)}</text>
      </g>`;
    }).join('');
    const truckP = pts[currentIdx];
    const prevP = pts[Math.max(0, currentIdx - 1)];
    const angle = Math.atan2(truckP.y - prevP.y, truckP.x - prevP.x) * 180 / Math.PI;
    const acts = [
      { label:'出城', i:2.5 }, { label:'灰原', i:9 }, { label:'北岭', i:16.5 }
    ].map(a => {
      const p = pts[Math.round(a.i)] || pts[0];
      return `<text class="map-act-label" x="${p.x}" y="20" text-anchor="middle">${a.label}</text>`;
    }).join('');
    const lines = [6, 13].map(seg => {
      const p = pts[seg - 1];
      return `<line class="map-act-line" x1="${p.x}" y1="28" x2="${p.x}" y2="${H - 8}"/>`;
    }).join('');
    $('#map-svg').setAttribute('viewBox', `0 0 ${W} ${H}`);
    $('#map-svg').innerHTML = `
      <path class="map-route-line" d="${lineD}"/>
      <path class="map-route-done" d="${doneD}"/>
      ${lines}
      ${acts}
      ${nodes}
      <g class="map-truck" transform="translate(${truckP.x},${truckP.y}) rotate(${angle})">
        <ellipse cx="0" cy="5" rx="13" ry="3" fill="rgba(0,0,0,.28)"/>
        <g transform="translate(-11,-6)">
          <rect x="0" y="2" width="15" height="8" rx="1" fill="#2a2116"/>
          <rect x="14" y="0" width="7" height="11" rx="1" fill="#3b2b1c"/>
          <rect x="16" y="2" width="4" height="4" fill="#d8c39a" opacity=".65"/>
          <circle cx="4" cy="11" r="2.2" fill="#1b1410"/>
          <circle cx="16" cy="11" r="2.2" fill="#1b1410"/>
        </g>
      </g>`;
    const meta = BALANCE.acts.find(a => a.no === S.act) || BALANCE.acts[0];
    const nextCamp = BALANCE.camps.find(c => c > S.seg);
    $('#map-caption').textContent = final
      ? '垭口就在前面。'
      : `第 ${S.seg} 段 · ${meta.name}${nextCamp ? ` · 下一个营地在第 ${nextCamp} 段` : ' · 最后一段'}`;
    if(S.seg !== lastSeg){
      lastSeg = S.seg;
      const scroll = $('#map-scroll');
      if(scroll){
        const target = Math.max(0, truckP.x - scroll.clientWidth * 0.5);
        scroll.scrollLeft = target;
      }
    }
  }

  /* ---------------- 日志 ---------------- */

  function renderLog(){
    const S = Game.state;
    if(!S) return;
    const list = $('#log-list');
    const entries = S.log.slice(-60);
    list.innerHTML = entries.map(e => `<div class="log-entry ${e.type || 'info'} ${e.stamp ? 'stamp' : ''}" data-stamp="${esc(e.stamp || '')}">
      <span class="log-seg">第 ${e.seg || '·'} 段</span>${esc(e.text)}
    </div>`).join('');
    list.scrollTop = list.scrollHeight;
  }

  /* ---------------- 卡牌 ---------------- */

  function cardHTML(data, opts){
    const o = opts || {};
    const d = (data.id && CARD_BY_ID[data.id]) ? Game.helpers.cardData(data) : data;
    if(!d) return '';
    const isInst = !!data.uid;
    const uidValue = data.uid || d.id;
    const selected = isInst && Game.state && Game.state.selected === uidValue;
    const can = isInst ? Game.canPlay(uidValue) : { ok:true };
    const disabled = isInst && !can.ok;
    const style = `--rot:${o.rot || 0}deg;--lift:${o.lift || 0}px;${o.overlap != null ? `--overlap:${o.overlap}px;` : ''}`;
    const disc = DISC[d.disc] || DISC.drive;
    const inner = `
      <span class="card-cost">${d.cost}</span>
      <span class="card-disc">${Art.discIcon(d.disc)}</span>
      <span class="card-art">${Art.scene(d.art, d.pal, uidValue + (d.upgraded ? 'u' : ''))}</span>
      <span class="card-body">
        <span class="card-name">${esc(d.name)}</span>
        <span class="card-type"><span>行动 · ${disc.name}</span><span>${RARITY[d.rarity] || ''}</span></span>
        <span class="card-text">${esc(d.text)}</span>
        <span class="card-flavor">${esc(d.flavor)}</span>
      </span>
      <span class="card-serial">${esc(o.serial || '')}</span>
      ${d.upgraded ? '<span class="card-up">＋</span>' : ''}`;
    if(o.interactive){
      return `<button type="button" class="card ${selected ? 'is-selected' : ''} ${disabled ? 'is-disabled' : ''}" style="${style}" data-action="card" data-uid="${uidValue}" aria-label="${esc(d.name)}，${d.cost} 费，${esc(d.text)}" ${disabled ? 'aria-disabled="true"' : ''}>${inner}</button>`;
    }
    return `<div class="card ${o.className || ''}" style="${style}" aria-hidden="true">${inner}</div>`;
  }

  function renderHand(){
    const S = Game.state;
    if(!S) return;
    const handBox = $('#hand-cards');
    const actions = $('#hand-actions');
    const hint = $('#hand-hint');
    const ap = $('#ap-pips');
    const gameScreen = $('#screen-game');
    const actionBar = (S.phase === 'rolling' || S.phase === 'resolve');
    if(gameScreen){
      gameScreen.classList.toggle('no-hand', S.phase !== 'crisis');
      gameScreen.classList.toggle('action-bar', actionBar);
    }
    if(actionBar){
      handBox.innerHTML = '';
      ap.innerHTML = '';
      if(S.phase === 'rolling'){
        hint.textContent = '骰子落定了。';
        const canRe = !S.rerolled && (S.freeReroll || S.res.morale >= 1);
        actions.innerHTML = `<button class="btn btn-ghost" type="button" data-action="reroll" ${canRe ? '' : 'disabled'}>${S.freeReroll ? '免费重掷' : `重掷（人心 -${BALANCE.rerollMoraleCost}）`}</button>
          <button class="btn btn-primary" type="button" data-action="resolve">结算</button>`;
      } else {
        hint.textContent = '这一段结束了。';
        actions.innerHTML = `<button class="btn btn-primary" type="button" data-action="continue">继续</button>`;
      }
      return;
    }
    if(S.phase !== 'crisis'){
      handBox.innerHTML = '';
      actions.innerHTML = '';
      ap.innerHTML = '';
      if(S.phase === 'route') hint.textContent = '选择一条路。油和吃的都会少一点。';
      else if(S.phase === 'reward') hint.textContent = '带走一样东西。';
      else if(S.phase === 'camp') hint.textContent = '在营火边歇一会儿。';
      else if(S.phase === 'settle') hint.textContent = '把剩下的东西变成能过冬的墙。';
      else if(S.phase === 'resolve') hint.textContent = '路还长。';
      else hint.textContent = '';
      return;
    }
    // 手牌
    const n = S.hand.length;
    const mid = (n - 1) / 2;
    handBox.innerHTML = S.hand.map((inst, i) => {
      const serial = 'NO.' + String(i + 1).padStart(2, '0');
      return cardHTML(inst, {
        interactive:true,
        rot: n > 1 ? (i - mid) * 3.4 : 0,
        lift: Math.abs(i - mid) * 1.8,
        overlap: n > 1 ? -14 : 0,
        serial
      });
    }).join('');
    // 行动点
    const pips = [];
    for(let i = 0; i < S.apMax; i++){
      pips.push(`<span class="ap-pip ${i < S.ap ? '' : 'is-empty'}"></span>`);
    }
    ap.innerHTML = pips.join('') + `<span class="ap-label">${S.ap}/${S.apMax} 行动点</span>`;

    // 提示与按钮
    if(!S.approach){
      hint.textContent = '先选择一种应对方式，再出牌。';
      actions.innerHTML = '';
      return;
    }
    hint.textContent = S.selected ? '再点一次选中的牌，把它打到桌上。' : '打出与学科匹配的牌，增加检定加值。';
    let html = '';
    if(S.selected){
      const d = Game.helpers.cardData(S.hand.find(c => c.uid === S.selected) || {});
      if(d) html += `<button class="btn btn-primary" type="button" data-action="play-selected">打出「${esc(d.name)}」</button>`;
    }
    if(S.phase === 'crisis'){
      html += `<button class="btn ${S.selected ? 'btn-ghost' : 'btn-primary'}" type="button" data-action="roll">掷骰</button>`;
    }
    actions.innerHTML = html;
  }

  /* ---------------- 舞台 ---------------- */

  function renderStage(){
    const S = Game.state;
    if(!S) return;
    const box = $('#stage');
    if(S.phase === 'route') box.innerHTML = routeStage(S);
    else if(S.phase === 'crisis') box.innerHTML = crisisStage(S);
    else if(S.phase === 'rolling') box.innerHTML = crisisStage(S);
    else if(S.phase === 'resolve') box.innerHTML = crisisStage(S);
    else if(S.phase === 'reward') box.innerHTML = rewardStage(S);
    else if(S.phase === 'camp') box.innerHTML = campStage(S);
    else if(S.phase === 'settle') box.innerHTML = settleStage(S);
    else box.innerHTML = '';
    if(S.phase === 'rolling' && S.roll) animateDice(S.roll.dice);
  }

  function routeStage(S){
    const minFuel = Math.min.apply(null, S.routeOptions.map(r => r.fuel));
    const noFuel = S.res.fuel < minFuel;
    const cards = S.routeOptions.map(r => {
      const fuelOk = S.res.fuel >= r.fuel;
      const tags = r.bias.map(d => `<span class="route-tag">${Art.discIcon(d)}${DISC[d].name}</span>`).join('');
      return `<button class="route-card" type="button" data-action="route" data-id="${r.id}" ${fuelOk ? '' : 'disabled'}>
        <div class="route-fuel">${Art.icon('fuel')}${r.fuel}</div>
        <h4>${esc(r.name)}</h4>
        <div class="route-en">${esc(r.en)}</div>
        <div class="route-tags">${tags}<span class="route-tag">${Art.icon(RES_META[r.reward].icon)}多 ${RES_META[r.reward].name}</span></div>
        <div class="route-desc">${esc(r.desc)}</div>
        <div class="route-desc" style="color:var(--rust-deep);font-size:10.5px;min-height:0">风险：${esc(r.risk)}</div>
        <span class="route-pick">${fuelOk ? '走这条路' : '油不够'}</span>
      </button>`;
    }).join('');
    return `<div class="stage-inner"><div class="paper stage-panel">
      <div class="stage-head">
        <div><div class="kicker">第 ${S.seg} 段 · ${BALANCE.acts.find(a => a.no === S.act).name}</div><h3>下一段路</h3></div>
        <div class="stage-sub">油 ${S.res.fuel}/${S.res.fuelMax} · 粮 ${S.res.food}/${S.res.foodMax}</div>
      </div>
      <p class="stage-note">${esc(S.weather)}。每走一段，油和口粮都会少一点。选一条你付得起、也扛得住的路。</p>
      ${noFuel ? `<div class="camp-beat" style="border-left-color:var(--bad)"><div class="beat-kicker">走不动了</div><p>两条路都烧不起。${(!S.flags.emergencyUsed && S.res.hull > BALANCE.emergencyHullCost) ? '你可以拆掉车身的一部分，换一点油——但车会伤得更重。' : '车身已经拆不出东西了。你们只能停在这里。'}</p>
        <div class="camp-choices">${(!S.flags.emergencyUsed && S.res.hull > BALANCE.emergencyHullCost)
          ? `<button class="camp-choice" type="button" data-action="emergency">拆东墙：车况 -${BALANCE.emergencyHullCost}，燃油 +${BALANCE.emergencyFuelGain}</button>`
          : `<button class="camp-choice" type="button" data-action="stranded" style="border-color:var(--bad);color:var(--bad)">抛锚：结束这段旅程</button>`}</div></div>` : ''}
      <div class="route-options">${cards}</div>
    </div></div>`;
  }

  function crisisCardHTML(S){
    const c = S.crisis;
    if(!c) return '';
    return `<div class="crisis-card">
      <div class="crisis-top"><span class="crisis-kicker">${c.finale ? '终局' : '危机'} · ${['','第一幕','第二幕','第三幕'][c.act] || ''}</span><span class="crisis-stamp">${c.finale ? '垭口' : '危机'}</span></div>
      <div class="crisis-art">${Art.scene(c.art, c.pal, c.id)}</div>
      <div class="crisis-title">${esc(c.title)}</div>
      <div class="crisis-text">${esc(c.text)}</div>
      <div class="crisis-foot"><span>${S.route ? esc(S.route.name) : ''}</span><span>第 ${S.seg} 段</span></div>
    </div>`;
  }

  function previewCheck(S){
    const a = S.approach;
    if(!a) return { bonus:0, dc:0, parts:[] };
    let bonus = 0;
    const parts = [];
    S.played.forEach(inst => {
      const d = Game.helpers.cardData(inst);
      if(!d) return;
      (d.effects || []).forEach(fx => {
        if(fx.cond && fx.cond.moraleMin != null && S.res.morale < fx.cond.moraleMin) return;
        if(fx.type === 'bonus' && fx.disc === a.disc){ bonus += fx.n; parts.push(`${d.name} +${fx.n}`); }
        else if(fx.type === 'anyBonus'){ bonus += fx.n; parts.push(`${d.name} +${fx.n}`); }
      });
    });
    const comp = S.crew.find(c => c.alive && !c.injured && CREW_BY_ID[c.id] && CREW_BY_ID[c.id].bonusDisc === a.disc);
    if(comp){ const b = CREW_BY_ID[comp.id].bonus || 1; bonus += b; parts.push(`${CREW_BY_ID[comp.id].name} +${b}`); }
    const ease = (S.crisisEase || 0);
    return { bonus, dc: Math.max(2, a.diff - ease), parts, ease };
  }

  function approachPanel(S){
    const c = S.crisis;
    return `<div class="approach-panel">
      <div class="approach-title">怎么过去</div>
      <div class="approach-sub">选择一种应对方式。不同的方式，失败代价也不一样。</div>
      <div class="approach-list">${c.approaches.map((a, i) => `<button class="approach-btn" type="button" data-action="approach" data-index="${i}">
        <span class="approach-disc">${Art.discIcon(a.disc)}</span>
        <span class="approach-main"><b>${esc(a.label)}</b><span>${esc(a.desc)}</span></span>
        <span class="approach-dc">${a.diff}<small> ${DISC[a.disc].name}</small></span>
      </button>`).join('')}</div>
      <div class="desk-note">
        <span>手牌 <b>${S.hand.length}</b></span>
        <span>行动点 <b>${S.ap}</b></span>
        <span>${S.crew.filter(x => x.alive && !x.injured).map(x => `${CREW_BY_ID[x.id].name} <b>${DISC[CREW_BY_ID[x.id].bonusDisc].name} +${CREW_BY_ID[x.id].bonus || 1}</b>`).join(' · ') || '没有同伴能帮上忙'}</span>
      </div>
    </div>`;
  }

  function checkPanel(S){
    const a = S.approach;
    const r = S.roll;
    const pv = previewCheck(S);
    const dice = r ? r.dice : null;
    const formula = r
      ? `${r.dice.join(' + ')}${r.bonus ? ' + ' + r.bonus : ''} = <b>${r.total}</b> vs ${r.dc}`
      : `2d6 ${pv.bonus ? '+ ' + pv.bonus : ''} vs <b>${pv.dc}</b>`;
    const names = (S.phase === 'resolve' && S.resolve && S.resolve.playedNames)
      ? S.resolve.playedNames
      : S.played.map(inst => { const d = Game.helpers.cardData(inst); return d ? d.name : '?'; });
    const played = `<div class="play-zone" data-dropzone="play">
      <div class="play-zone-label">打出的牌 · PLAYED</div>
      <div class="play-zone-cards">${names.length
        ? names.map(n => `<span class="played-chip">${esc(n)}<b>已打出</b></span>`).join('')
        : '<span class="play-slot">空</span><span class="play-slot">空</span><span class="play-slot">空</span>'}</div>
    </div>`;
    const result = S.phase === 'resolve' && S.resolve ? `<div style="margin-top:10px">
      <span class="result-stamp ${S.resolve.tier === 'great' ? 'great' : (S.resolve.tier === 'success' ? 'good' : 'bad')}">${S.resolve.stamp}</span>
      <div class="result-text">${esc(S.resolve.text)}${S.resolve.summary ? `<br><span style="color:var(--rust-deep)">${esc(S.resolve.summary)}</span>` : ''}</div>
    </div>` : '';
    return `<div class="check-panel">
      <div class="check-row">
        <div class="check-formula">${a.label} · ${DISC[a.disc].name} ${a.diff}<br>${formula}</div>
        <div class="dice-hint">${S.phase === 'crisis' ? '出牌后掷骰' : S.phase === 'rolling' ? '骰子落定了' : ''}</div>
      </div>
      ${played}
      ${dice ? `<div class="dice-wrap">
        <div class="dice-tray">${dice.map((v, i) => dieHTML(v, i)).join('')}</div>
        <div class="dice-total"><b>${r.total}</b><span>对抗 ${r.dc}</span></div>
      </div>` : ''}
      ${result}
    </div>`;
  }

  function crisisStage(S){
    const finale = S.finale && S.finale.active;
    return `<div class="stage-inner"><div class="paper stage-panel">
      <div class="stage-head">
        <div><div class="kicker">${finale ? `终局 ${Math.min(S.finale.stage + 1, 3)} / 3` : `第 ${S.seg} 段 · 危机`}</div><h3>${esc(S.crisis.title)}</h3></div>
        <div class="stage-sub">${S.approach ? `${DISC[S.approach.disc].name} ${S.approach.diff}` : '等待你的决定'}</div>
      </div>
      <div class="crisis-layout">

      </div>
    </div></div>`;
  }

  function rewardStage(S){
    const cards = S.rewardOptions.map((o, i) => {
      if(o.kind === 'card'){
        const d = CARD_BY_ID[o.cardId];
        return `<button class="reward-pick" type="button" data-action="reward" data-index="${i}">
          ${cardHTML(d, { serial:'NO.' + String(i + 1).padStart(2, '0') })}
          <span class="reward-label">拿走这张牌</span>
        </button>`;
      }
      const icon = o.kind === 'res' ? RES_META[o.res].icon : o.kind === 'repair' ? 'truck' : o.kind === 'morale' ? 'heart' : 'seed';
      return `<button class="reward-pick" type="button" data-action="reward" data-index="${i}">
        <div class="reward-res">${Art.icon(icon)}<b>${esc(o.name)}</b><span>${esc(o.desc)}</span></div>
        <span class="reward-label">收下这份物资</span>

    }).join('');
    return `<div class="stage-inner"><div class="paper stage-panel">
      <div class="stage-head"><div><div class="kicker">第 ${S.seg} 段之后</div><h3>带走一样东西</h3></div><div class="stage-sub">三选一</div></div>
      <p class="stage-note">车斗里还有一点空。拿一张牌，或者拿一点能撑到下一段的东西。</p>

  function campStage(S){
    return `<div class="stage-inner"><div class="paper stage-panel" style="text-align:center;padding:34px">
      <div class="kicker">营地</div>

  function settleStage(S){

      <div class="kicker">北岭</div>
      <h3 style="font-family:var(--font-title);font-size:24px;letter-spacing:.16em;margin:6px 0 8px">第一年</h3>

    </div></div>`;

  /* ---------------- 骰子 ---------------- */

  function pips(v){
    const layouts = {
      1:[[2,2]], 2:[[1,1],[3,3]], 3:[[1,1],[2,2],[3,3]],
      4:[[1,1],[1,3],[3,1],[3,3]],
      5:[[1,1],[1,3],[2,2],[3,1],[3,3]],
      6:[[1,1],[1,3],[2,1],[2,3],[3,1],[3,3]]
    };
    return (layouts[v] || layouts[1]).map(([r,c]) => `<span class="pip" style="grid-area:${r}/${c}"></span>`).join('');
  }

  function faceTransform(v){
    return { 1:'rotateX(0deg) rotateY(0deg)', 2:'rotateX(0deg) rotateY(180deg)', 3:'rotateX(0deg) rotateY(90deg)', 4:'rotateX(0deg) rotateY(-90deg)', 5:'rotateX(-90deg) rotateY(0deg)', 6:'rotateX(90deg) rotateY(0deg)' }[v] || '';
  }

  function dieHTML(v, i){
    const faces = [1,2,3,4,5,6].map(f => `<div class="face f${f}">${pips(f)}</div>`).join('');
    return `<div class="die" data-value="${v}" data-i="${i}" style="transform:${faceTransform(v)}">${faces}</div>`;
  }

  function animateDice(values){
    if(settings.reduceMotion) return;
    const dice = $$('.die');
    if(!dice.length) return;
    dice.forEach(el => { el.classList.add('rolling'); el.style.transform = ''; });
    if(window.Audio) Audio.play('dice');
    setTimeout(() => {
      dice.forEach((el, i) => {
        el.classList.remove('rolling');
        el.style.transform = faceTransform(values[i] || 1);
      });
      if(window.Audio) Audio.play('settle');
    }, 720);
  }

  /* ---------------- 营地 ---------------- */

  function campOverlayHTML(S){
    const camp = S.camp;
    const beat = camp.beat;
    const beatHtml = `<div class="camp-beat">
      <div class="beat-kicker">夜话</div>
      <h4 style="font-family:var(--font-title);font-size:16px;letter-spacing:.1em;margin-bottom:5px">${esc(beat.title)}</h4>
      <p>${esc(beat.text)}</p>
      <div class="camp-choices">${beat.choices.map((ch, i) => {
        const afford = Game.helpers.canAffordEffects(ch.fx);
        return `<button class="camp-choice ${camp.beatChoice === i ? 'is-picked' : ''}" type="button" data-action="beat" data-index="${i}" ${camp.beatChoice != null || !afford ? 'disabled' : ''}>${esc(ch.label)}</button>`;
      }).join('')}</div>
      ${camp.reply ? `<p style="margin-top:8px;color:var(--rust-deep);font-family:var(--font-hand);font-size:12px">${esc(camp.reply)}</p>` : ''}
    </div>`;

    let serviceHtml = '';
    if(camp.pendingService){
      const svc = SERVICE_BY_ID[camp.pendingService];
      const cards = S.deck.filter(c => svc.kind === 'upgrade' ? !c.up : true);
      serviceHtml = `<div style="margin-top:12px">
        <div class="approach-title">${svc.kind === 'upgrade' ? '选一张牌，磨得更顺手' : '选一张牌，丢进火里'}</div>
        <div class="approach-sub">${svc.kind === 'upgrade' ? '升级后数值或效果会变强。' : '牌会从本局牌组中移除，人心 -1。'}</div>
        <div class="reward-grid" style="grid-template-columns:repeat(auto-fill,minmax(96px,1fr))">
          ${cards.map(inst => `<button class="reward-pick" type="button" data-action="camp-card" data-uid="${inst.uid}">
            ${cardHTML(inst, { serial:'NO.' })}
          </button>`).join('')}
        </div>
        <div style="margin-top:10px"><button class="btn btn-ghost btn-sm" type="button" data-action="cancel-service">算了</button></div>
      </div>`;
    } else {
      serviceHtml = `<div style="margin-top:12px">
        <div class="approach-title">营地服务</div>
        <div class="approach-sub">只做一件事。想清楚。</div>
        <div class="service-grid">${camp.services.map(svc => {
          const afford = Game.helpers.canPay(svc.cost);
          const used = camp.serviceUsed === svc.id;
          return `<button class="service-card" type="button" data-action="service" data-id="${svc.id}" ${camp.serviceUsed || !afford ? 'disabled' : ''}>
            <h4>${esc(svc.name)}${used ? ' · 已做' : ''}</h4>
            <p>${esc(svc.desc)}</p>
            <span class="service-cost">${esc(svc.costText)}</span>
          </button>`;
        }).join('')}</div>
      </div>`;
    }

    return `<div class="overlay-head">
      <div><div class="kicker">第 ${S.seg} 段之后 · 营地</div><h3>火堆边</h3><p>风小了一点。今晚可以停久一点。</p></div>
    </div>
    ${beatHtml}
    ${serviceHtml}
    <div class="camp-foot">
      <span class="camp-note">${camp.serviceUsed ? '该做的事做完了。' : '也可以什么都不做，继续上路。'}</span>
      <button class="btn btn-primary" type="button" data-action="leave-camp">继续上路</button>
    </div>`;
  }

  function renderCampOverlay(){
    const S = Game.state;
    if(!S || !S.camp) return;
    showOverlay(campOverlayHTML(S), 'camp', true);
  }

  /* ---------------- 定居点 ---------------- */

  function settleOverlayHTML(S){
    const built = S.settle.built;
    const cards = MODULES.map(m => {
      const isBuilt = built.indexOf(m.id) >= 0;
      const afford = Game.helpers.canPay(m.cost);
      const cost = Object.entries(m.cost).map(([k,v]) => `${RES_META[k] ? RES_META[k].name : k} ${v}`).join(' + ');
      return `<button class="module-card ${isBuilt ? 'is-built' : ''}" type="button" data-action="build-module" data-id="${m.id}" ${isBuilt || !afford || built.length >= BALANCE.maxModules ? 'disabled' : ''}>
        ${isBuilt ? '<span class="module-built">已建</span>' : ''}
        <div class="module-icon">${Art.icon(m.icon)}</div>
        <h4>${esc(m.name)}</h4>
        <p>${esc(m.desc)}</p>
        <span class="module-cost">${cost}</span>
      </button>`;
    }).join('');
    const score = built.length * 10 + Game.helpers.aliveCrew().length * 5 + S.res.seeds * 3 + S.res.morale;
    return `<div class="overlay-head">
      <div><div class="kicker">北岭 · 第一年</div><h3>定居点</h3><p>最多建 4 个模块。剩下的东西，留给下一个冬天。</p></div>
    </div>
    <div class="stage-note" style="color:var(--ink-soft);font-family:var(--font-title);line-height:1.9;margin-bottom:12px">

    </div>
    <div class="module-grid">${cards}</div>
    <div class="settle-score">
      <div><span>火种值</span><br><b>${score}</b></div>
      <div style="text-align:right"><span>资源：燃油 ${S.res.fuel} · 食物 ${S.res.food} · 药品 ${S.res.meds} · 零件 ${S.res.parts} · 火种 ${S.res.seeds}</span></div>

      <button class="btn btn-primary" type="button" data-action="finish-settle">完成建设，进入结局</button>
    </div>`;
  }

  function renderSettleOverlay(){
    const S = Game.state;
    if(!S) return;
    showOverlay(settleOverlayHTML(S), 'settle', true);

  /* ---------------- 覆盖层 ---------------- */

  function showOverlay(html, type, locked){
    const root = $('#overlay-root');
    if(overlayType === type && root.firstElementChild){
      const sheet = root.querySelector('.overlay-sheet');
      if(sheet){ sheet.innerHTML = html; sheet.scrollTop = 0; return; }
    }
    lastFocus = document.activeElement;
    root.innerHTML = `<div class="overlay"><div class="overlay-sheet" role="dialog" aria-modal="true" tabindex="-1">${html}</div></div>`;
    overlayType = type;
    overlayLocked = !!locked;
    const sheet = root.querySelector('.overlay-sheet');
    if(sheet) setTimeout(() => sheet.focus({ preventScroll:true }), 30);
  }

  function closeOverlay(force){
    if(!force && overlayLocked && (overlayType === 'camp' || overlayType === 'settle' || overlayType === 'ending' || overlayType === 'tutorial')) return;
    $('#overlay-root').innerHTML = '';
    overlayType = null;
    overlayLocked = false;
    if(lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch(e){}
  }

  /* ---------------- 规则 ---------------- */

  function rulesBody(){
    if(rulesTab === 'loop') return `
      <h4>一局在做什么</h4>
      <p>你开着一台旧卡车，带着两名同伴，穿过 20 段公路。每一段：选路 → 付油和口粮 → 翻危机 → 选应对 → 出牌 → 掷骰 → 结算 → 拿一份奖励。</p>
      <p>第 4、8、12、16 段之后是营地；第 6、13、20 段是幕危机；第 20 段之后是垭口三连检定。抵达北岭后，用手上的资源建定居点。</p>
      <h4>输赢</h4>
      <ul><li>车况归零：车毁，进入“熄灭”。</li><li>人心归零：散伙，进入“熄灭”。</li><li>燃油不足且无法拆东墙：抛锚，进入“熄灭”。</li><li>抵达北岭：至少进入“余烬”；建 3 个模块是“火种”，4 个且两人存活、人心 ≥6 是“黎明”。</li></ul>`;

      <h4>检定</h4>
      <p>每种危机有 2–3 种应对方式，各自对应一个学科和一个难度。选择后，从手牌打出最多 3 点行动点的牌，再掷 2d6。</p>
      <div class="rules-kv"><b>总值</b><span>2d6 + 卡牌加值 + 同伴被动</span><b>成功</b><span>总值 ≥ 难度</span><b>大成功</b><span>总值 ≥ 难度 + 4：额外人心 +1，并触发“大成功”效果</span><b>失败</b><span>总值 &lt; 难度</span><b>大失败</b><span>总值 ≤ 难度 - 4：额外车况 -1</span></div>
      <h4>重掷</h4>
      <p>每次检定限一次。支付 1 人心重掷 2d6；某些牌提供免费重掷。</p>
      <h4>同伴</h4>
      <p>同伴的被动只在未受伤时生效。受伤的同伴不提供加值，需要药品或医疗牌治疗。</p>`;
    if(rulesTab === 'cards') return `
      <h4>卡牌</h4>
      <p>卡牌分 6 个学科：驾驶、搜寻、修理、医疗、交涉、意志。打出的牌只有在学科与当前应对方式一致时，才提供对应加值；“任意检定”加值则总是生效。</p>
      <div class="rules-kv"><b>行动点</b><span>每次检定 3 点，用不完不保留</span><b>手牌</b><span>每次检定抽到 5 张</span><b>弃牌</b><span>检定结束后，手牌和打出的牌进入弃牌堆</span><b>消耗</b><span>带“消耗”的牌本局不再回到牌堆</span></div>
      <h4>构筑</h4>
      <p>每段危机后三选一，通常有 2 张牌和 1 份物资。营地可以升级一张牌（数值或效果变强），也可以烧掉一张牌（牌组更薄，人心 -1）。稀有牌和幕传说牌更强，但有代价。</p>`;

      <div class="setting-row"><div><b>减弱动效</b><p>关闭骰子翻滚、卡片飞行与震屏。</p></div><button class="switch ${settings.reduceMotion ? 'is-on' : ''}" type="button" data-action="toggle-motion" aria-label="切换减弱动效"></button></div>

    showOverlay(`<div class="overlay-head"><div><div class="kicker">ABANDON</div><h3>放弃本局？</h3><p>当前进度会被删除，不能恢复。</p></div></div>
