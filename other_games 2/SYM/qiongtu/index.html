  /* ---------------- 调试 / 模拟 ---------------- */

  function runValidation(){
    const v = Game.validate();
    document.body.innerHTML = `<pre id="validation-out" style="white-space:pre-wrap;padding:20px;font:12px/1.6 monospace;color:#eee;background:#111">VALIDATE_${v.ok ? 'OK' : 'FAIL'}\n${esc(JSON.stringify(v, null, 2))}</pre>`;
  }

  function runSim(){
    const n = parseInt(params.get('sim'), 10) || 100;
    const seed = parseInt(params.get('seed'), 10) || 20261127;
    setTimeout(() => {
      let out;
      try { out = Game.simulate(n, seed); }
      catch(e){ out = { error:String(e) }; }
      document.body.innerHTML = `<pre id="sim-out" style="white-space:pre-wrap;padding:20px;font:12px/1.6 monospace;color:#eee;background:#111">SIM_RESULT\n${esc(JSON.stringify(out, null, 2))}</pre>`;
    }, 60);
  }

  function runDemo(mode){
    if(mode === 'title'){ showTitle(); return; }
    if(mode === 'setup'){ showSetup(); return; }
    Game.setDemoMode(true);
    Game.newRun(['ahe','tiepi'], 20261127, { silent:true });
    showGame();
    const S = Game.state;
    if(mode === 'map'){ /* route */ }
    else if(mode === 'crisis' || mode === 'rolling' || mode === 'resolve' || mode === 'reward'){
      const r = S.routeOptions.find(x => x.fuel <= S.res.fuel) || S.routeOptions[0];
      Game.chooseRoute(r.id);
      if(mode === 'crisis'){ /* 保持未选应对，展示选择界面 */ }
      else {
        Game.chooseApproach(0);
      }
      if(mode === 'rolling'){ Game.rollDice(); }
      else if(mode === 'resolve' || mode === 'reward'){
        if(!S.roll) Game.rollDice();
        Game.resolveRoll();
        if(mode === 'reward') Game.continueAfterResolve();
      }
    }
    else if(mode === 'camp'){
      S.seg = 4; S.act = 1; S.phase = 'route'; Game.enterCamp();
    }
    else if(mode === 'settle'){
      S.seg = 20; S.act = 3; S.phase = 'settle'; S.finale.active = false;
      S.settle = { built:['greenhouse','well'] };
      S.res.fuel = 3; S.res.food = 4; S.res.parts = 3; S.res.meds = 2; S.res.seeds = 3; S.res.morale = 8;
    }
    else if(mode === 'ending'){
      S.seg = 20; S.act = 3; S.phase = 'ending'; S.endingId = 'dawn'; S.endingReason = '';
      S.finale.active = false;
      S.settle = { built:['greenhouse','well','clinic','workshop'] };
      S.res.fuel = 2; S.res.food = 4; S.res.parts = 2; S.res.meds = 2; S.res.seeds = 3; S.res.morale = 8;
    }
    renderAll();
    Game.setDemoMode(false);
  }

  /* ---------------- 交互 ---------------- */

  function bindEvents(){
    document.getElementById('app').addEventListener('click', onClick);
    document.getElementById('app').addEventListener('pointerdown', onPointerDown);
    document.addEventListener('pointermove', onDragMove);
    document.addEventListener('pointerup', onDragUp);
    document.addEventListener('pointercancel', cancelDrag);
    document.addEventListener('keydown', onKey);
    document.addEventListener('pointerdown', () => { if(window.Audio) Audio.init(); }, { once:true });
    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('visibilitychange', () => {
      if(!window.Audio) return;
      if(document.hidden) Audio.suspend(); else Audio.resume();
    });
    const root = $('#overlay-root');
    root.addEventListener('click', (e) => {
      if(e.target.classList.contains('overlay') && !overlayLocked) closeOverlay();
    });
  }

  function onPointerMove(e){
    if(settings.reduceMotion) return;
    const x = (e.clientX / window.innerWidth) * 100;
    const y = (e.clientY / window.innerHeight) * 100;
    document.documentElement.style.setProperty('--lx', x + '%');
    document.documentElement.style.setProperty('--ly', y + '%');
  }

  function onClick(e){
    if(dragJustFinished){ dragJustFinished = false; return; }
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;
    if(window.Audio) Audio.init();
    switch(action){
      case 'new': showSetup(); Audio.play('ui'); break;
      case 'continue': {
        const cur = Game.state;
        if(cur && cur.phase === 'resolve'){
          act(() => Game.continueAfterResolve(), 'ui');
        } else if(Game.load()){
          showGame(); renderAll();
          if(window.Audio){ Audio.startAmbient(); Audio.play('ui'); }
        } else { toast('没有可继续的存档。', 'bad'); updateTitle(); }
        break;
      }
      case 'rules': openRules(); break;
      case 'settings': openSettings(); break;
      case 'setup-back': showTitle(); break;
      case 'toggle-crew': toggleCrew(el.dataset.id); break;
      case 'depart': startRun(); break;
      case 'route': act(() => Game.chooseRoute(el.dataset.id), 'travel'); break;
      case 'emergency': act(() => Game.emergencyFuel(), 'damage'); break;
      case 'stranded': act(() => { Game.defeat('燃油耗尽。你们在原地等了三天，没有车经过。'); return { ok:true }; }, 'damage'); break;
      case 'approach': act(() => Game.chooseApproach(parseInt(el.dataset.index, 10)), 'ui'); break;
      case 'card': onCard(el.dataset.uid); break;
      case 'play-selected': act(() => Game.playCard(), 'card'); break;
      case 'roll': act(() => Game.rollDice(), 'dice'); break;
      case 'reroll': act(() => Game.reroll(), 'dice'); break;
      case 'resolve': act(() => Game.resolveRoll(), 'stamp'); break;
      case 'reward': act(() => Game.chooseReward(parseInt(el.dataset.index, 10)), 'pickup'); break;
      case 'beat': act(() => Game.chooseBeat(parseInt(el.dataset.index, 10)), 'ui'); break;
      case 'service': act(() => Game.chooseService(el.dataset.id), 'repair'); break;
      case 'cancel-service': act(() => Game.cancelCampService(), 'ui'); break;
      case 'camp-card': act(() => Game.chooseCampCard(el.dataset.uid), 'upgrade'); break;
      case 'leave-camp': act(() => Game.leaveCamp(), 'travel'); break;
      case 'build-module': act(() => Game.buildModule(el.dataset.id), 'build'); break;
      case 'finish-settle': act(() => Game.finishSettlement(), 'stamp'); break;
      case 'close-overlay': closeOverlay(); break;
      case 'rules-tab': switchRules(el.dataset.tab); break;
      case 'mute': {
        settings.muted = !settings.muted;
        saveSettings();
        const b = $('#btn-sound');
        if(b){ b.classList.toggle('is-off', settings.muted); b.textContent = settings.muted ? '静音' : '音效'; }
        if(window.Audio){ Audio.setMuted(settings.muted); if(!settings.muted) Audio.startAmbient(); }
        break;
      }
      case 'toggle-sound': settings.muted = !settings.muted; saveSettings(); openSettings(); break;
      case 'toggle-motion': settings.reduceMotion = !settings.reduceMotion; saveSettings(); openSettings(); break;
      case 'reset-tutorial': {
        const S = Game.state;
        if(S){ S.flags.tutorialSeen = false; Game.save(); }
        toast('下次出发时会再显示一次教学。');
        break;
      }
      case 'abandon': openAbandonConfirm(); break;
      case 'confirm-abandon': Game.clearSave(); location.reload(); break;
      case 'tutorial-done': {
        const S = Game.state;
        if(S){ S.flags.tutorialSeen = true; Game.save(); }
        closeOverlay(true);
        break;
      }
      case 'restart': showSetup(); break;
      case 'title': showTitle(); break;
      case 'log-toggle': $('#log-rail').classList.toggle('is-open'); break;
      case 'log-close': $('#log-rail').classList.remove('is-open'); break;
      default: break;
    }
  }

  function act(fn, sound){
    try {
      const r = fn();
      if(r && r.ok === false && r.reason){
        const msgs = { fuel:'燃油不够，走不了这条路。', hull:'车况太差，不能再拆了。', used:'已经用过一次了。', phase:'现在不能这么做。', route:'这条路不在选项里。', '资源不足':'资源不够。' };
        toast(msgs[r.reason] || r.reason, 'bad');
        if(window.Audio) Audio.play('bad');
      } else if(window.Audio && sound){
        Audio.play(sound);
      }
      if(Game.state && Game.state.phase === 'ending'){ renderAll(); return; }
      renderAll();
    } catch(err){
      console.error(err);
      toast('出了点问题，进度已保留。', 'bad');
      renderAll();
    }
  }

  function onCard(uidValue){
    const S = Game.state;
    if(!S || S.phase !== 'crisis'){ toast('现在不能出牌。'); return; }
    if(!S.approach){ toast('先选择一种应对方式。'); if(window.Audio) Audio.play('bad'); return; }
    const playable = Game.canPlay(uidValue);
    if(!playable.ok){ toast(playable.reason || '这张牌现在打不出去。', 'bad'); if(window.Audio) Audio.play('bad'); return; }
    if(S.selected === uidValue){
      const r = Game.playCard(uidValue);
      if(r.ok === false){ toast(r.reason || '打出失败。', 'bad'); if(window.Audio) Audio.play('bad'); }
      else if(window.Audio) Audio.play('card');
      renderAll();
    } else {
      Game.selectCard(uidValue);
      if(window.Audio) Audio.play('tick');
      renderAll();
    }
  }

  function onPointerDown(e){
    if(e.button != null && e.button !== 0) return;
    if(overlayType) return;
    const S = Game.state;
    if(!S || S.phase !== 'crisis' || !S.approach) return;
    const card = e.target.closest('.hand-cards .card[data-uid]');
    if(!card) return;
    dragState = { uid:card.dataset.uid, el:card, x:e.clientX, y:e.clientY, active:false, pointerId:e.pointerId };
  }

  function makeGhost(){
    if(!dragState) return null;
    const ghost = dragState.el.cloneNode(true);
    ghost.classList.remove('is-selected','is-disabled');
    ghost.classList.add('card-ghost');
    ghost.removeAttribute('data-action');
    ghost.style.setProperty('--cw', dragState.el.getBoundingClientRect().width + 'px');
    document.body.appendChild(ghost);
    return ghost;
  }

  function onDragMove(e){
    if(!dragState) return;
    const dx = e.clientX - dragState.x;
    const dy = e.clientY - dragState.y;
    if(!dragState.active){
      if(Math.abs(dy) > 14 && Math.abs(dy) > Math.abs(dx)){
        dragState.active = true;
        dragState.ghost = makeGhost();
        dragState.el.classList.add('is-dragging');
        dragMoved = true;
        if(window.Audio) Audio.play('tick');
      } else {
        return;
      }
    }
    if(!dragState.ghost) return;
    dragState.ghost.style.left = e.clientX + 'px';
    dragState.ghost.style.top = e.clientY + 'px';
    const over = document.elementFromPoint(e.clientX, e.clientY);
    const zone = over && over.closest('.play-zone, .stage');
    document.querySelectorAll('.play-zone.drop-active').forEach(el => el.classList.remove('drop-active'));
    if(zone){
      const pz = zone.closest('.play-zone') || document.querySelector('.play-zone');
      if(pz) pz.classList.add('drop-active');
    }
    e.preventDefault();
  }

  function onDragUp(e){
    if(!dragState) return;
    const st = dragState;
    const wasActive = st.active;
    if(st.ghost) st.ghost.remove();
    if(st.el) st.el.classList.remove('is-dragging');
    document.querySelectorAll('.play-zone.drop-active').forEach(el => el.classList.remove('drop-active'));
    dragState = null;
    if(!wasActive) return;
    dragMoved = false;
    dragJustFinished = true;
    setTimeout(() => { dragJustFinished = false; }, 40);
    const over = document.elementFromPoint(e.clientX, e.clientY);
    const target = over && over.closest('.play-zone, .stage');
    if(target){
      const r = Game.playCard(st.uid);
      if(r && r.ok === false) toast(r.reason || '这张牌现在打不出去。', 'bad');
      else if(window.Audio) Audio.play('card');
      renderAll();
    } else {
      const S = Game.state;
      if(S && S.phase === 'crisis') { Game.selectCard(st.uid); renderAll(); }
    }
  }

  function cancelDrag(){
    if(dragState && dragState.ghost) dragState.ghost.remove();
    if(dragState && dragState.el) dragState.el.classList.remove('is-dragging');
    document.querySelectorAll('.play-zone.drop-active').forEach(el => el.classList.remove('drop-active'));
    dragState = null;
    dragMoved = false;
  }

  function trapFocus(e){
    const sheet = document.querySelector('.overlay-sheet');
    if(!sheet) return;
    const focusables = Array.from(sheet.querySelectorAll('button:not(:disabled), [href], input, select, textarea, [tabindex="0"]'))
      .filter(el => el.offsetParent !== null);
    if(!focusables.length){ e.preventDefault(); sheet.focus(); return; }
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }

  function onKey(e){
    if(overlayType && e.key === 'Tab'){ trapFocus(e); return; }
    if(e.key === 'Escape'){
      if(overlayType && !overlayLocked){ closeOverlay(); e.preventDefault(); }
      return;
    }
    const S = Game.state;
    if(!S) return;
    if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    if(S.phase === 'crisis' && !S.approach && /^[1-3]$/.test(e.key)){
      const idx = parseInt(e.key, 10) - 1;
      if(S.crisis && S.crisis.approaches[idx]){ act(() => Game.chooseApproach(idx), 'ui'); e.preventDefault(); }
    } else if(S.phase === 'crisis' && S.approach){
      if(/^[1-5]$/.test(e.key)){
        const inst = S.hand[parseInt(e.key, 10) - 1];
        if(inst){ onCard(inst.uid); e.preventDefault(); }
      } else if(e.key === 'Enter'){
        if(S.selected){ onCard(S.selected); e.preventDefault(); }
        else if(S.hand.length === 0 || S.ap === 0){ act(() => Game.rollDice(), 'dice'); e.preventDefault(); }
      } else if(e.key.toLowerCase() === 'r'){
        act(() => Game.rollDice(), 'dice'); e.preventDefault();
      }
    } else if(S.phase === 'rolling'){
      if(e.key === 'Enter'){ act(() => Game.resolveRoll(), 'stamp'); e.preventDefault(); }
      else if(e.key.toLowerCase() === 'r'){ act(() => Game.reroll(), 'dice'); e.preventDefault(); }
    } else if(S.phase === 'resolve'){
      if(e.key === 'Enter' || e.key === ' '){ act(() => Game.continueAfterResolve(), 'ui'); e.preventDefault(); }
    } else if(S.phase === 'route' && /^[12]$/.test(e.key)){
      const r = S.routeOptions[parseInt(e.key, 10) - 1];
      if(r && S.res.fuel >= r.fuel){ act(() => Game.chooseRoute(r.id), 'travel'); e.preventDefault(); }
    } else if(S.phase === 'reward' && /^[1-3]$/.test(e.key)){
      act(() => Game.chooseReward(parseInt(e.key, 10) - 1), 'pickup'); e.preventDefault();
    }
  }

  function toast(msg, type){
    const root = $('#toast-root');
    if(!root) return;
    const el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(4px)'; }, 2100);
    setTimeout(() => el.remove(), 2500);
  }

  return {
    init, renderAll, showTitle, showSetup, toast,
    get settings(){ return settings; },
    set settings(v){ settings = v; applySettings(); }
  };
})();

/* ============================================================
   程序化音频：风声、发动机、卡牌、骰子、印章
   无外部音频文件
   ============================================================ */

const Audio = (() => {

  let ctx = null;
  let master = null;
  let noiseBuffer = null;
  let muted = false;
  let wanted = false;
  let ambient = null;
  let volume = 0.22;

  function init(){
    if(ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : volume;
      master.connect(ctx.destination);
      // 2 秒白噪声，循环使用
      const len = Math.floor(ctx.sampleRate * 2);
      noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for(let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    } catch(e){ ctx = null; }
  }

  function setMuted(v){
    muted = !!v;
    if(master && ctx){
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(muted ? 0 : volume, ctx.currentTime, 0.03);
    }
    if(!muted && wanted) startAmbient();
  }

  function setVolume(v){
    volume = Math.max(0, Math.min(1, v));
    if(master && !muted) master.gain.value = volume;
  }

  function now(){ return ctx ? ctx.currentTime : 0; }

  function beep(freq, dur, type, gain, slideTo){
    if(!ctx || muted) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, now());
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now() + dur);
    g.gain.setValueAtTime(0.0001, now());
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain || 0.05), now() + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, now() + dur);
    o.connect(g); g.connect(master);
    o.start(); o.stop(now() + dur + 0.02);
  }

  function noise(dur, filterFreq, gain, type){
    if(!ctx || muted || !noiseBuffer) return;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuffer;
    const f = ctx.createBiquadFilter();
    f.type = type || 'bandpass';
    f.frequency.value = filterFreq || 1200;
    f.Q.value = 0.8;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, now());
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, gain || 0.04), now() + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, now() + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(); src.stop(now() + dur + 0.02);
  }

  function play(name){
    if(!ctx || muted) return;
    switch(name){
      case 'ui': beep(520, 0.05, 'sine', 0.025); break;
      case 'tick': beep(760, 0.035, 'triangle', 0.018); break;
      case 'card':
        noise(0.09, 2200, 0.035, 'bandpass');
        beep(220, 0.05, 'triangle', 0.015);
        break;
      case 'dice':
        [0, 70, 150, 250, 380].forEach((t, i) => setTimeout(() => noise(0.045, 1600 + i * 240, 0.03, 'bandpass'), t));
        break;
      case 'settle':
        noise(0.06, 700, 0.035, 'lowpass');
        beep(110, 0.09, 'sine', 0.03);
        break;
      case 'stamp':
        noise(0.12, 380, 0.06, 'lowpass');
        beep(78, 0.16, 'sine', 0.06);
        break;
      case 'good':
        beep(440, 0.12, 'sine', 0.025);
        setTimeout(() => beep(660, 0.18, 'sine', 0.022), 90);
        break;
      case 'bad':
        beep(160, 0.22, 'sawtooth', 0.03, 96);
        break;
      case 'damage':
        noise(0.16, 240, 0.06, 'lowpass');
        beep(64, 0.2, 'sine', 0.05);
        break;
      case 'travel':
        beep(52, 0.5, 'sawtooth', 0.02, 84);
        noise(0.4, 400, 0.02, 'lowpass');
        break;
      case 'pickup':
        beep(880, 0.08, 'sine', 0.025);
        setTimeout(() => beep(1320, 0.12, 'sine', 0.018), 70);
        break;
      case 'repair':
        [0, 90, 190].forEach((t, i) => setTimeout(() => {
          noise(0.05, 2400, 0.03, 'bandpass');
          beep(300 + i * 60, 0.04, 'square', 0.012);
        }, t));
        break;
      case 'upgrade':
        beep(520, 0.1, 'triangle', 0.025);
        setTimeout(() => beep(780, 0.16, 'triangle', 0.02), 80);
        break;
      case 'build':
        noise(0.18, 300, 0.07, 'lowpass');
        beep(90, 0.22, 'sine', 0.06);
        break;
      case 'ending':
        [220, 277, 330, 440].forEach((f, i) => setTimeout(() => beep(f, 1.2, 'sine', 0.018), i * 140));
        break;
      default: break;
    }
  }

  function startAmbient(){
    wanted = true;
    if(!ctx || muted || ambient) return;
    try {
      const windSrc = ctx.createBufferSource();
      windSrc.buffer = noiseBuffer;
      windSrc.loop = true;
      const windFilter = ctx.createBiquadFilter();
      windFilter.type = 'bandpass';
      windFilter.frequency.value = 520;
      windFilter.Q.value = 0.45;
      const windGain = ctx.createGain();
      windGain.gain.value = 0.022;
      windSrc.connect(windFilter); windFilter.connect(windGain); windGain.connect(master);
      windSrc.start();

      const eng = ctx.createOscillator();
      eng.type = 'sawtooth';
      eng.frequency.value = 47;
      const engFilter = ctx.createBiquadFilter();
      engFilter.type = 'lowpass';
      engFilter.frequency.value = 130;
      const engGain = ctx.createGain();
      engGain.gain.value = 0.018;
      eng.connect(engFilter); engFilter.connect(engGain); engGain.connect(master);
      eng.start();

      const lfo = ctx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.value = 0.13;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 3.2;
      lfo.connect(lfoGain); lfoGain.connect(eng.frequency);
      lfo.start();

      ambient = { windSrc, eng, lfo, windGain, engGain };
    } catch(e){ ambient = null; }
  }

  function stopAmbient(){
    wanted = false;
    if(!ambient) return;
    try {
      ambient.windSrc.stop();
      ambient.eng.stop();
      ambient.lfo.stop();
    } catch(e){}
    ambient = null;
  }

  function suspend(){ if(ctx && ctx.state === 'running') { try { ctx.suspend(); } catch(e){} } }
  function resume(){ if(ctx && ctx.state === 'suspended') { try { ctx.resume(); } catch(e){} } }

  return { init, play, startAmbient, stopAmbient, setMuted, setVolume, suspend, resume };
})();

/* ============================================================
   启动
   ============================================================ */

(function(){
  window.Game = Game;
  window.UI = UI;
  window.Audio = Audio;
  window.QT = {
    Game, UI, Audio,
    get state(){ return Game.state; },
    DATA: { CARDS, CRISES, ROUTES, CREW, SERVICES, BEATS, MODULES, ENDINGS, FINALE, BALANCE }
  };

  function boot(){
    try {
      UI.init();
    } catch(err){
      console.error(err);
      const root = document.getElementById('app');
      if(root){
        root.innerHTML = '<div style="padding:40px;color:#e8dcc4;font-family:serif">游戏启动失败。请刷新页面，或检查浏览器控制台。<br><br><code style="font-size:12px;color:#c99">' + String(err && err.message || err) + '</code></div>';
      }
    }
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
